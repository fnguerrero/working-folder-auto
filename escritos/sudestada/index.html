 Que la casa era de los dos. Que su hermana no iba a vender. Acuña le había dicho que lo pensara, que el precio era ese ahora y en dos años iba a ser otro, que los lotes del Fraile iban a valer menos cuando el barrio estuviera hecho y la calle de tablas pasara por el fondo de todos, y le había dejado la tarjeta.</p>\n<p>—Y en agosto te mostré la foto —dijo Martín. Me miraba por primera vez—. Vos dijiste: lindo. Para el verano.</p>\n<p>—Ya sé.</p>\n<p>—Entonces supe que no te lo iba a poder decir. No con palabras. —Se miró las manos—. Y pensé que había otra manera.</p>\n<p>La otra manera había sido el banco del taller, de noche, con la lámpara de pinza, con la carpeta de la casa abierta en la página del poder de la obra social, donde está mi firma grande, clara, en tinta azul. Tres semanas. Todas las noches, desde fines de agosto, con Ana dormida arriba. Hojas y hojas de mi nombre.</p>\n<p>—¿Cuántas?</p>\n<p>—No las conté. —Pensó—. Un block entero. Dos. Las quemé en la cocina a leña de Elías, en septiembre, un día que él no estaba.</p>\n<p>Elías no dijo nada. Cebó.</p>\n<p>—Me salía. —Martín hablaba más bajo—. Al principio no, al principio era un dibujo, y vos me enseñaste que un dibujo se ve. Pero un día me salió. La mano la hizo sola, de corrido, la V con la cola y todo lo demás, y la miré y era tuya. Era más tuya que la mía. —Levantó la vista—. Me dio asco lo bien que me salía, Vero. Fui al arroyo a lavarme las manos y no se iba.</p>\n<p>El 12 de septiembre había ido a Tigre con el boleto que Acuña le había mandado por correo electrónico, impreso en el ciber de la estación fluvial, ya con mi firma puesta en el taller, en la madrugada, con el pulso que había tenido que esperar hasta las cuatro para tener. En la oficina de Acuña Hermanos, en Tigre, frente al río, había firmado la suya al lado. Acuña había mirado las dos firmas un rato. Había preguntado si la hermana estaba al tanto. Martín había dicho que sí. Acuña había dicho «perfecto» y había sacado los veinte mil de una caja fuerte, en fajos de diez, y se los había dado en una bolsa de supermercado.</p>\n<p>—¿Y después?</p>\n<p>—Después fui al banco del Turco y me quedé sentado una hora. Y una semana después tomé el colectivo a Zárate. —Miró a Ana, que no lo miró—. Y de Zárate a Paranacito, que son tres horas. Le di doce mil a Ibarra en la mano. Me hizo un recibo en una hoja de cuaderno. Me mostró dónde va a ir mi nombre en el cartel.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Ana habló por primera vez.</p>\n<p>—El veintiocho de septiembre me lo dijo —dijo, hacia la cocina a leña—. Un domingo. Me lo dijo porque yo encontré el recibo de Ibarra en la campera cuando la lavé. No porque quisiera. —Se apretó la manta—. Yo le dije: se lo decís a tu hermana o me voy. Se lo dije ese domingo y se lo dije el miércoles en el muelle. Y le mandé «hacelo». Y me fui a dar clase.</p>\n<p>—Y el cuatro de octubre —dije yo— yo vine y hablamos del motor.</p>\n<p>—Hablamos del motor —dijo Martín.</p>\n<p>—Y el martes me llamaste.</p>\n<p>—Te llamé.</p>\n<p>—Y el miércoles.</p>\n<p>El miércoles. Lo contó entero, y lo voy a poner como lo contó, porque es de él.</p>\n<p>Acuña a las ocho, el auto, la escribanía: Pereyra, un hombre de sesenta años con anteojos de media luna, que miró los papeles y dijo «y la señora Aldao viene el martes», y Martín dijo que sí. El café en la esquina. Acuña hablando del barrio náutico, de la calle de tablas, de que la gente se acostumbra. A las dos, la estación fluvial. Caminó las dos cuadras hasta lo del Turco y el Turco no estaba, había ido a almorzar, y Martín se sentó en el bar de la esquina, el que está frente al muelle de las colectivas, donde se ve la gente subir y bajar. Sacó el teléfono. Tenía el mensaje de Ana de las seis de la mañana: te amo, hacelo. Me iba a llamar, dijo. Tenía mi número en la pantalla. Lo miró diez minutos.</p>\n<p>—Y no pude. —Se frotó la cara con las dos manos—. Escribí «no puedo. perdoname» y se lo mandé a ella, porque a vos no te podía escribir ni eso. Y después llamé al mozo.</p>\n<p>—¿Qué pediste?</p>\n<p>—Una ginebra.</p>\n<p>Ana cerró los ojos.</p>\n<p>—La primera en doce años. No me gustó. —Lo dijo con una especie de asombro—. Tenía el gusto de la cocina. El del piso. Pedí otra para que se fuera el gusto. Cuatro. Cuando volvió el Turco a las cuatro me encontró ahí y me quiso llevar a tu casa, Vero. A Caballito. Me dijo: vamos a lo de tu hermana, que ella sabe qué hacer. —Me miró—. Y yo le dije que eso era exactamente lo que no quería. Que ella supiera qué hacer.</p>\n<p>Se había ido en la «Marta» a las cinco, del muelle de Acuña, con el Turco gritándole desde la costa que no, que el viento, que el arranque. El motor había arrancado a la tercera. Había hecho el río Luján con el viento ya de frente y el agua picada, y el Sarmiento, y había entrado en el Fraile a las siete, de noche, con el río subiendo por todos lados y la lancha dando saltos, y había visto la casa. La luz prendida arriba. Ana adentro. La mujer que le había dicho que se lo dijera ese día o se iba, y él con cuatro ginebras encima y nada dicho.</p>\n<p>—No pude amarrar ahí. —Lo dijo mirando la mesa—. Seguí hasta lo de Elías.</p>\n<p>—Llegó como llegaba a los veinte —dijo Elías—. Lo conozco. Le saqué las llaves de la lancha y la botella que traía en la campera, una entera, sin abrir, que había comprado en Tigre. La tiré al río. Lo acosté en el galpón y le puse la lancha bajo la lona, al lado de la mía, y al otro día, cuando vos pasaste en la colectiva, le dije: andá. Tu hermana llegó. Andá y hablá. —Se encogió de hombros—. No fue. Y yo no lo iba a llevar de la oreja a los treinta y ocho años. No llamé a Prefectura, Verónica. Te dije que llamé y no llamé. ¿Qué les iba a decir, que tengo al desaparecido en el galpón comiendo duraznos? —Miró el mate—. Primera vez en setenta y un años que le miento a una Aldao. Les mentí a las dos. Pan como para tres, dijiste. Era para tres.</p>\n<p>—Me dijiste que es grande.</p>\n<p>—Es grande. —Elías me miró con los ojos cansados—. Y vos lo tratás como si no, y él se deja, y los dos se la pasan haciendo eso desde que la Marta se murió, y yo los miro desde esta cocina hace diecinueve años. Esta vez no quise mirar. Quise que él fuera. —Bajó la voz—. Tampoco fue. En eso me equivoqué.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Las madrugadas en la chata las contó Martín sin que yo preguntara.</p>\n<p>El jueves había oído la colectiva pasar y no se había movido del galpón. El viernes, a las cinco, con el agua ya alta, había agarrado la chata de Elías y había cruzado, pegado a los sauces, y había remado hasta el recreo, y se había quedado entre las ramas mirando la casa. Me había visto salir a la galería con sus botas y su campera.</p>\n<p>—Quería verte —dijo—. Verte sin que me vieras. Como vos me mirás a mí hace doce años, una vez por mes, desde la mesa de la cocina. —No lo dijo con rabia. Lo dijo como se dice una medida—. Quería saber qué cara tenías cuando yo no estaba.</p>\n<p>—Rema cruzado desde los seis años —dijo Elías, sin que nadie le preguntara—. Es zurdo y yo le puse los remos como a todo el mundo y nunca se los pude enderezar. Rema con el cuerpo torcido, mal, y llega igual. —Me miró—. Vos me dijiste «rema raro, como al revés» en esta mesa, el viernes, y yo miré el mate. Y vos no lo reconociste, Verónica, y eso también lo miré.</p>\n<p>Era cierto. Hacía quince años que no veía a mi hermano remar. Desde que tenía la lancha, Martín no remaba delante de mí, y lo que yo había visto a sesenta metros, entre los sauces, era un hombre remando mal, y lo había pensado como se piensa en un desconocido.</p>\n<p>El sábado había vuelto. Más cerca. Y yo había bajado y había desatado la chata y había salido al medio del arroyo y había gritado su nombre.</p>\n<p>—Te oí. —Se le quebró la voz por primera vez—. Te oí gritar Martín y te vi venir, y remé. Remé para el otro lado, Vero. Te vi dar vuelta la chata en el medio del agua y seguí remando hasta los sauces y me metí y me quedé ahí, agarrado a una rama, escuchándote, hasta que Ana te sacó con la soga. Y después volví al galpón y me acosté. —Me miró—. Ese soy yo. Eso es lo que no te quería decir.</p>\n<p>Ana se levantó.</p>\n<p>Lo hizo sin ruido, con la manta en los hombros, y se paró delante de él, y Martín levantó la cara, y yo esperé el grito que no iba a venir porque Ana no grita.</p>\n<p>—Tomaste —dijo.</p>\n<p>—Sí.</p>\n<p>—Cuatro días a trescientos metros. Con un farol. Con duraznos. —Le temblaba todo—. Mientras yo llamaba a los hospitales. Mientras le decía a ella que te habías matado. Mientras me tiraba por una ventana. —Tragó—. Mi papá por lo menos se queda en la silla, Martín. Mi papá no se esconde en un galpón para que una lo busque en el río.</p>\n<p>—Ya sé.</p>\n<p>—Me voy en la primera colectiva.</p>\n<p>—Ya sé.</p>\n<p>Se quedó un segundo más. Después se fue a la pieza de Elías, la del fondo, y cerró la puerta, y el Negro, bajo la mesa, levantó la cabeza y la volvió a bajar.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Elías prendió la radio a las nueve. Llamó a Prefectura de Tigre con el nombre con que lo conocen, Ferreyra del Fraile, y dijo que la lancha «Marta» había aparecido amarrada en su muelle, que el propietario estaba bien, que estaba en su casa, que no hacía falta nada. Una voz joven dijo «recibido, Ferreyra», y preguntó si era el Aldao que había denunciado una mujer el jueves, y Elías dijo que sí, y la voz dijo que entonces alguien tenía que pasar por la delegación a firmar que había aparecido.</p>\n<p>—Que pase la hermana —dijo la voz—. Que firme ella.</p>\n<p>Elías colgó el micrófono. Nadie se rió. Martín tenía la cabeza entre las manos.</p>\n<p>Me quedé mirando la ventana. El agua, afuera, estaba quieta de una manera distinta, una quietud de cosa que va a empezar a irse. Y en algún momento, no sé cuánto después, Martín habló, sin levantar la cabeza, con la voz contra las palmas:</p>\n<p>—Es el martes, Vero. A las once. Si no vamos los dos, le debo cuarenta mil dólares a Acuña y tengo ocho en una lata. —Levantó la cara—. Y si vamos los dos, tenés que firmar al lado de una firma tuya que hice yo. Delante de un escribano.</p>\n<p>—Ya sé.</p>\n<p>—No sé qué querés que haga. —Lo dijo despacio, con la exactitud de los que estuvieron cuatro días pensando una sola frase—. Por eso te llamé. Para que vos supieras qué hacer. —Y después, más bajo—: Y me dio vergüenza llamarte para eso. Otra vez.</p>\n<p>No le contesté. No tenía con qué. Elías cebó un mate y me lo dio, y lo tomé, y afuera, por primera vez en tres días, por un hueco entre dos nubes que se iban hacia el oeste, se vio el sol, bajo, sobre el agua, y el agua lo devolvió.</p>","palabras":2587},{"n":17,"titulo":"Barro","cuando":"Domingo 12 de octubre, 15.00","html":"<p>El agua se fue como había dicho Elías. A mediodía el viento estaba en el norte y el arroyo, que durante tres días había corrido para arriba, se dio vuelta sin ruido, como se da vuelta un animal que dormía, y empezó a bajar. A las tres la galería de casa tenía otra vez tablas. A las cinco se veía el muelle, con el escalón de arriba fuera del agua, cubierto de una capa de barro gris y camalote muerto. A las seis la planta baja era una cocina con barro hasta la rodilla, un comedor con barro hasta la rodilla, una heladera parada en el barro con la puerta abierta y el olor, el olor del Delta cuando se va la creciente, que es a tierra vieja, a raíz, a algo que se pudrió lejos y que el río trajo para dejarlo en casa.</p>\n<p>Baldeamos. Martín y yo. Elías nos había cruzado en la chata a las tres, la de él, con dos baldes y dos escobas de las de cerda dura y un par de botas para mí de las de Nilda, y se había vuelto a su casa, donde Ana dormía desde la mañana en la pieza del fondo con la puerta cerrada. No la vi. No pregunté.</p>\n<p>Hay un modo de limpiar una casa después del agua que mi madre nos enseñó y que las manos recuerdan: primero se saca lo grueso con la pala, después se baldea con el agua del mismo río, que para eso sirve, de arriba hacia abajo, del fondo hacia la puerta, y se barre hacia la galería, y después se vuelve a baldear, y se vuelve a barrer, y en algún momento se ve la madera. Lo hicimos sin hablar la primera hora. Él con la pala, yo con el balde. Él sacando las sillas al muelle, dadas vuelta, para que escurrieran. Yo pasando la escoba por el piso que mi abuela encerraba de rodillas. La taza del asa pegada apareció debajo de la mesada, entera, llena de barro, y la lavé en el arroyo y la dejé en el escurridor, que Martín volvió a colgar de la pared.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Habló él primero. Estaba en cuclillas, rascando con una espátula el barro de la pata de la mesa, y lo dijo sin mirarme, como se dicen las cosas que se dicen con las manos ocupadas.</p>\n<p>—Me acuerdo del ficus.</p>\n<p>Seguí baldeando.</p>\n<p>—Me acuerdo de la oficina, de la mujer de anteojos, de vos con la lapicera. Yo estaba en la silla de al lado. Nadie me preguntó nada. Vos firmaste y la mujer te dijo que habías hecho lo correcto y vos dijiste «ya sé». —Rascó—. Me acuerdo del «ya sé».</p>\n<p>—Habías tomado dos tiras de pastillas con ginebra, Martín.</p>\n<p>—Ya sé.</p>\n<p>—Respirabas con un ronquido. Te metí los dedos en la boca. Corrí trescientos metros con sandalias.</p>\n<p>—Ya sé, Vero. —Se enderezó—. No digo que no. Digo que me acuerdo del ficus. Digo que a los veintiséis años firmaste por mí porque yo no podía firmar, y que a los veintisiete, y a los treinta, y a los treinta y cinco, seguiste firmando. La obra social. La receta. Las facturas con el comprobante abrochado. Las condiciones, en tu cocina, mientras yo miraba el piso. —No levantaba la voz; Martín no levanta la voz, en eso se parece a Ana—. Me enseñaste a firmar antes que a escribir mi nombre entero. Me enseñaste a firmar como vos.</p>\n<p>—Te enseñé a firmar como yo.</p>\n<p>—Y lo hago. —Tiró el barro de la espátula en el balde—. Es lo que hice. Firmé como vos. Me salió mejor que a vos. Eso es lo que me enseñaste, Vero: tu firma, no la mía.</p>\n<p>Baldeé. El agua marrón corrió por las tablas hacia la puerta y salió a la galería y cayó al arroyo, que ya estaba a un metro bajo el muelle y seguía bajando.</p>\n<p>—¿Las pastillas las tomás?</p>\n<p>Me miró como si le hubiera preguntado otra cosa.</p>\n<p>—Las tomo —dijo—. Las tomo porque si no las tomo, al mes siguiente me preguntás por qué quedan tantas. Las contás, Vero. Las contás delante mío en la mesa y las dejás al lado de la yerba. Doce años. —Hizo una pausa—. Hay meses que las tiro al arroyo de a una, por la noche, para que al mes siguiente falten las que tienen que faltar.</p>\n<p>Dejé el balde en el piso.</p>\n<p>—¿Querés que deje de traerlas?</p>\n<p>—Quiero que me preguntes si las necesito —dijo—. Una vez. Que me lo preguntes y que esperes a ver qué contesto.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Comimos a las nueve, arriba, en el pasillo, en el piso, con la vela que quedaba. Elías había cruzado al anochecer con una olla de guiso y, sin comentario, con la lata de duraznos, y Martín la abrió con el abrelatas de la caja de herramientas chica y comimos los duraznos del mismo frasco, con la misma cuchara, uno y otro, como cuando éramos chicos y la abuela abría una lata los domingos y nos la dejaba en el medio de la mesa.</p>\n<p>—Contame del galpón —dije.</p>\n<p>Me miró con desconfianza. Es justo: en treinta y ocho años no le había pedido que me contara nada que no fuera para comprobar algo.</p>\n<p>—¿Qué querés saber?</p>\n<p>—Lo que quieras contar.</p>\n<p>Contó. Despacio al principio, mirando la lata, y después mirando la pared, donde debía estar viendo la cosa. El río Paranacito, que es ancho como tres arroyos del Fraile y tranquilo, sin la marea del Plata. El galpón, de chapa y madera, con el techo a dos aguas y una claraboya, con la bancada de Ibarra que es una bancada de los años sesenta, de lapacho, que no se mueve ni con un casco de ocho metros encima. El guinche a mano, con la cadena. El muelle, con una rampa de rieles para sacar las lanchas del agua. La casa de atrás, chica, de dos piezas, con un limonero. Me dijo que en Paranacito hay todavía veinte lanchas de madera de las de antes, de los pescadores, y que no hay quien las arregle, y que Ibarra tiene una lista de nombres en un cuaderno, gente que espera, y que le va a dejar el cuaderno. Me dijo que iba a poner el cartel con las letras talladas, no pintadas. Me dijo cómo se llamaría el taller y no me pareció un buen nombre y no se lo dije.</p>\n<p>Lo escuché. Fue todo lo que hice. No le pregunté con qué plata, ni qué médico, ni cómo iba a hacer con la receta, ni quién iba a saber si no contestaba tres días. Me lo pregunté a mí, todo, en orden, mientras él hablaba, y lo dejé en el renglón de las cosas que no se dicen, y me di cuenta de que ese renglón, en mí, había estado vacío cuarenta y cuatro años.</p>\n<p>A las siete, con la luz que se iba, nos sentamos en el muelle. Él de un lado, yo del otro, con las piernas colgando sobre el agua que ya corría como un arroyo, para abajo, marrón, rápida, llevándose lo último. Martín sacó algo del bolsillo interno de la campera, la que tenía puesta desde el miércoles, la oscura, la que yo había visto desde la galería a sesenta metros. Eran hojas. Cuatro hojas dobladas en cuatro, mojadas y secadas y vueltas a mojar, con los bordes ondulados y la tinta azul que, como yo había pensado agarrada a la quilla de una chata, había aguantado. Me las dio.</p>\n<p>—Te las iba a dar el jueves. En lugar de decírtelo. —Se encogió de hombros—. Que las leyeras vos, que sabés leer.</p>\n<p>Las abrí sobre la rodilla. La letra chica, redonda, con el arrastre.</p>\n<p><em>vie 12/9. Firmé. Firmé por los dos. Me salió mejor la de ella que la mía. Me fui a lavar las manos al arroyo y no se iba.</em></p>\n<p><em>sáb 20/9. Paranacito. Ibarra me mostró dónde va el nombre en el cartel. Volví en el colectivo de la noche con un recibo en una hoja de cuaderno y no dormí.</em></p>\n<p><em>dom 28/9. A. encontró el recibo. Se lo dije todo. Dijo: se lo decís a tu hermana o me voy. No es una amenaza, dijo. Es lo que hay.</em></p>\n<p><em>sáb 4/10. Vino. Con la bolsa. Hablamos del motor. Le quise decir y dije: el arranque. Dije: lo llevo al Turco el miércoles. Ella dijo: bien. Se fue en la de las cinco. Me quedé en la puerta del taller con las manos en los bolsillos y levanté el mentón, como siempre, y ella pensó lo de siempre.</em></p>\n<p><em>mar 7/10. La llamé. Dije: necesito que vengas. Ella dijo: ¿pasó algo? Dije: no por teléfono. Después arranqué estas hojas con la trincheta, bien al ras, para que no se note. Se las voy a dar. Que las lea ella. Si hay alguien que sabe leer una firma es ella; que lea esta.</em></p>\n<p>Las doblé por los dobleces. Me las guardé en el bolsillo de la pollera de Nilda, que tenía bolsillos, como las polleras de antes. No dije nada de lo que había leído, y él no preguntó, y nos quedamos mirando el agua irse.</p>\n<p>—Hernán me dijo una vez que no te cuido —dije después—. Que te administro.</p>\n<p>Martín no contestó enseguida. Miraba el arroyo.</p>\n<p>—Hernán era un tipo justo —dijo.</p>\n<p>—Sí.</p>\n<p>—¿Y vos qué le dijiste?</p>\n<p>—Nada. Me pareció una frase para el momento.</p>\n<p>—Era para el momento —dijo Martín—. Lo que pasa es que el momento duró doce años.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Ana se fue el lunes en la colectiva de las siete y veinte. La misma de siempre, la de la escuela, con el Chino al timón y dos chicos adentro, y el arroyo ya en su cauce, y el muelle con las tablas secas por encima del barro. Había venido desde lo de Elías por el terraplén, con la campera de jean y una bolsa con la ropa que tenía en el ropero de Martín, tres perchas, las zapatillas, el libro de la escuela. Martín bajó al muelle. Yo me quedé en la galería, porque hay cosas que no son de una, y las miré como había mirado todo esa semana, desde arriba, desde lejos.</p>\n<p>No se abrazaron. Hablaron. Él con las manos en los bolsillos, ella con la bolsa. Vi a Ana decir algo corto y a Martín asentir. Vi a Martín decir algo más largo y a Ana no asentir. Vi a Ana mirar el arroyo, el agua que corría otra vez para donde tenía que correr, y después mirarlo a él, y levantar la mano y tocarle la cara, un segundo, con el dorso de los dedos, como se toca para ver si hay fiebre. La colectiva apareció por la curva. Ana subió. Se sentó del lado de la ventana.</p>\n<p>Antes de que la lancha se arrimara, Ana levantó la vista hacia la galería. Hacia mí. Y me dijo algo que no oí, porque el motor, pero que le leí en la boca, porque sé leer eso también:</p>\n<p>—Leíste mejor.</p>\n<p>Asentí.</p>\n<p>Ana dijo otra cosa, dos sílabas, y esa la entendí sin leerle los labios, porque era la que yo hubiera dicho:</p>\n<p>—Tarde.</p>\n<p>La lancha se fue arroyo arriba. Martín se quedó en el muelle hasta que el sauce de la curva la tapó, y después un rato más, y después subió, pasó al lado mío sin decir nada, con el mentón levantado, y entró en el taller.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Yo me fui a las nueve y media, en la que sigue. Con la bolsa. La bolsa de siempre, vacía: la yerba había quedado en la casa, las pilas en la radio, y la caja de clonazepam, con las treinta pastillas contadas, la había dejado sobre la mesa de la cocina, cerrada, al lado de la taza del asa pegada, sin decirle nada a él, sin contarlas, para que hiciera con ellas lo que quisiera. Me pareció poco. Era lo que tenía.</p>\n<p>Martín me acompañó al muelle. Nos quedamos los dos parados en las tablas secas, con el barro en las botas, mirando la colectiva venir.</p>\n<p>—El martes a las once —dijo.</p>\n<p>—Ya sé.</p>\n<p>—¿Vas a ir?</p>\n<p>Le miré las manos. Las tenía en los bolsillos de la campera. La izquierda, la que me había sacado del agua, la de la cicatriz en el índice. La derecha, la que no usa para nada que importe.</p>\n<p>—Voy a ir —dije—. No sé a qué.</p>\n<p>Subí a la lancha. Me senté del lado de la ventana, atrás. El Chino arrancó. Y mi hermano se quedó en el muelle de la casa de mi abuela con las manos en los bolsillos, y cuando la lancha tomó la curva levantó el mentón, como siempre, y yo, por primera vez en treinta y ocho años, no pensé lo de siempre. No supe qué pensar. Me pareció que eso, no saber, era lo más cerca de él que había estado en mucho tiempo.</p>","palabras":2155},{"n":18,"titulo":"Martes, once","cuando":"Martes 14 de octubre, 10.50","html":"<p>La Escribanía Pereyra está en una casa vieja de Tigre, a dos cuadras del río, con una placa de bronce al lado de la puerta y un pasillo con baldosas de las de antes. La sala de espera tiene cuatro sillas y un cuadro de un velero. Estoy sentada en la tercera. Tengo la lupa en la cartera, donde va siempre, y las cuatro hojas de Martín en el bolsillo interno del saco, y el boleto, el original, el que estuvo en el forro de una campera y en el fondo de un arroyo, doblado en tres, en el otro bolsillo. Son las once menos diez.</p>\n<p>Martín llega a las once menos cinco. Viene afeitado. Tiene una camisa blanca que no le conocía, planchada, con las mangas dobladas dos veces, y los zapatos de la sucesión de mi madre, que son los únicos zapatos que tiene. Se sienta en la silla de al lado sin saludarme, como se sienta uno al lado de alguien con quien ya habló, y se mira las manos. Yo le miro las manos. La izquierda arriba de la derecha. No tiembla.</p>\n<p>Acuña llega a las once en punto, con un portafolio y la camisa celeste, y nos da la mano a los dos, a mí primero, y dice «Verónica» como si nos conociéramos de siempre, y se sienta en la cuarta silla y no habla. Sabe no hablar. Es su oficio, como el mío es mirar.</p>\n<p>En el auto, por la Panamericana, con el sol en el parabrisas, había ensayado tres frases. Las había dicho en voz alta en el tráfico de Puente Saavedra, como un abogado antes de un alegato, y las tres me habían sonado a informe, a la voz de los dictámenes, y las había tirado una por una antes de la bajada de Tigre. Lo que me quedó no fue una frase. Fue la regla: cuando los hechos dicen lo que una ya pensaba, es cuando menos hay que creerles. Y lo que yo había pensado toda la vida era que la casa de la abuela no se vendía nunca.</p>\n<p>A las once y cinco se abre la puerta del fondo y Pereyra dice: pasen.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>El escritorio es grande, de madera oscura, con un vidrio encima y debajo del vidrio tarjetas y una foto de unos chicos. Pereyra tiene sesenta y pico, anteojos de media luna, la voz de los que leen en voz alta todos los días. Nos sienta: Acuña a su izquierda, nosotros a su derecha, Martín del lado de la ventana, yo en el medio. Abre una carpeta. Pone sobre el escritorio una escritura de doce fojas, impresa en el papel de los escribanos, con los sellos. Y pone, al lado, una fotocopia del boleto de compraventa, la que le dejó Martín el miércoles, con las tres firmas al pie.</p>\n<p>—Bien —dice—. Esta es la escritura traslativa de dominio del lote tal, sección primera, con frente al arroyo del Fraile, que los vendedores, Verónica Beatriz Aldao y Martín Raúl Aldao, transfieren a Acuña Hermanos Sociedad Anónima, por el precio que figura, del cual los vendedores han recibido veinte mil dólares en concepto de seña según el boleto de fecha doce de septiembre que tengo a la vista. —Levanta los ojos por encima de los anteojos—. Señora, señor: ¿ratifican lo firmado en el boleto?</p>\n<p>Hay un silencio en el que se oye el ventilador del techo.</p>\n<p>Saco la lupa.</p>\n<p>No la necesito. Ya lo dije. Pero la saco, la prendo, y me inclino sobre la fotocopia como me inclino sobre cualquier documento que un juez me pone delante, y miro mi firma. Verónica Beatriz Aldao. La V con la cola larga. El ataque, el remate, la proporción, la fluidez sin la pausa. Es mejor que la mía. Lo pienso con la claridad con que pienso las cosas de mi oficio: es mejor que la mía. Más segura. Más entera. La hizo una mano que aprendió el gesto de mi mano a los cinco años, en una mesa, sin saber lo que aprendía, y que lo guardó treinta y tres años, y que lo usó una vez para irse.</p>\n<p>Apago la lupa. La dejo sobre el escritorio.</p>\n<p>—Esa firma no es mía —digo.</p>\n<p>Acuña no se mueve. Pereyra se saca los anteojos. Martín, a mi lado, deja de respirar; lo oigo, porque conozco su respiración desde que la conté en una lancha de Prefectura con la mano en su pecho.</p>\n<p>—¿Cómo dice?</p>\n<p>—Soy perita calígrafa, escribano. Matrícula tal, Tribunales, Lavalle. Esa firma que dice Verónica Beatriz Aldao no la hice yo. La hizo mi hermano. —No lo miro—. Me la hizo él. Y yo se la enseñé. Si quiere, le hago el informe, se lo firmo, y usted llama a la fiscalía de Tigre y esto termina en una causa por falsificación de instrumento privado que no le va a devolver a nadie los veinte mil dólares ni le va a dar a nadie el lote. —Respiro—. O me da la lapicera.</p>\n<p>Pereyra mira a Acuña. Acuña mira la fotocopia, un segundo, y después me mira a mí, y en su cara hay una cosa muy rápida, el mismo reacomodo que le vi en la lancha, un expediente que cambia de carátula, y después nada.</p>\n<p>—Yo recibí un boleto firmado —dice Acuña con su voz suave— y pagué una seña de buena fe. Lo que haya pasado entre los hermanos Aldao con ese papel es un asunto de los hermanos Aldao. —Hace una pausa chica—. Si la señora quiere vender hoy, delante del escribano, con su firma, para mí es lo mismo.</p>\n<p>Pereyra se pone los anteojos. Mira la escritura. Mira el boleto. Es un hombre que hace esto hace treinta años y sabe lo que necesita y lo que no.</p>\n<p>—Lo que yo necesito —dice despacio— es que los dos condóminos manifiesten su voluntad de vender, hoy, acá, delante mío, y firmen la escritura. El boleto es un instrumento privado entre las partes. Si las partes no lo discuten, yo no lo discuto. —Me mira—. ¿Usted quiere vender, señora?</p>\n<p>Pienso en la casa de la abuela. En el muelle, en la mesa de la galería con la tabla hundida, en el piso que ella enceraba de rodillas. En la foto con el vestido de flores que Ana sacó de la pared con la linterna en la boca. En el tercer escalón y el séptimo. Pienso: que no se venda nunca. Lo pienso entero, con la fuerza con que lo pensé toda la vida.</p>\n<p>Y después pienso en un galpón de chapa sobre un río ancho, con un guinche y un muelle para lanchas de ocho metros, y un cartel donde va a ir un nombre.</p>\n<p>—Sí —digo—. Quiero vender.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Pereyra lee. Lee las doce fojas en voz alta, como se hace, con la voz de los que pesan los nombres, y yo no escucho las palabras: escucho el ventilador, y la respiración de Martín, que volvió. Cuando termina da vuelta la última foja y la pone delante de mí y me da la lapicera, una lapicera negra, pesada, de escribano.</p>\n<p>Firmo.</p>\n<p>Firmo como firmo. La V grande, la cola que baja por debajo del renglón y vuelve, y después la pausa. La pausa de los nueve años, el microsegundo en que levanto la lapicera antes del «erónica», el defecto que mi hermano no tiene porque yo se la enseñé entera. La hago. Es mía. Firmo con la pausa y con el pulso de siempre y con la lapicera de otro, y termino, y levanto la mano.</p>\n<p>Y mientras firmo, él me mira la mano.</p>\n<p>Me mira la mano como yo le miré la mano toda la vida: la de él, la izquierda, en la mesa de la galería, en el escritorio de la sucesión, en el agua de un muelle hundido. Me mira hacer el gesto que le di. No sé qué ve. No sé si ve la pausa. Creo que sí; creo que es la primera vez que la ve, y que entiende de dónde viene, y que entiende que yo nunca se la enseñé porque me daba vergüenza.</p>\n<p>Pereyra da vuelta la foja hacia él. Le da la lapicera.</p>\n<p>Y yo no lo miro.</p>\n<p>Lo decido así, en ese momento, con la lupa apagada sobre el escritorio de un escribano de Tigre: no le miro la mano. Miro el cuadro del velero, que también está en esta oficina, más chico. Miro la ventana, por donde se ve un pedazo de calle y un árbol. Oigo la lapicera sobre el papel, el trazo corto, el de alguien que firma de corrido y no levanta, y oigo que termina, y oigo que deja la lapicera, y recién entonces me doy vuelta.</p>\n<p>Firmó como firma. La V doble con la cola larga, la mía, la que le hice a los cinco años en una mesa, con el arrastre de la mano izquierda en el remate. Al lado de la mía. Las dos juntas por primera vez en un papel que ninguno de los dos falsificó.</p>\n<p>—Una cosa —le digo a Acuña, antes de que Pereyra guarde la carpeta—. La mesa de la galería. La de madera, la de la tabla hundida. Me la llevo.</p>\n<p>Acuña asiente como asiente un hombre al que acaban de hacerle el pedido más barato de su vida.</p>\n<p>—Es suya —dice.</p>\n<p>Salimos a la calle a las doce menos cuarto. Hace sol. Es un martes de octubre en Tigre, con el río a dos cuadras y el ruido de los motores de las lanchas que salen, y Martín se para en la vereda con las manos en los bolsillos de un pantalón que no es de él y levanta el mentón, como siempre, y yo lo miro hacerlo, y esta vez no me acerco, y no le pregunto por el motor, y no le digo nada que empiece con «tenés que».</p>\n<p>Le digo:</p>\n<p>—¿Las necesitás?</p>\n<p>Se queda un momento callado. El sol le da en la cara. Es grande, pienso. Tiene treinta y ocho años. Es carpintero de ribera y sabe hacer una firma mejor que la perita calígrafa que se la enseñó, y va a tener un cartel con su nombre sobre un río ancho, y no sé si va a volver a tomar ni si Ana va a volver ni si yo voy a saber alguna vez cómo se le pregunta algo a alguien y se espera.</p>\n<p>—No sé —dice Martín—. Dejame pensarlo.</p>\n<p>—Bueno —digo.</p>\n<p>Y espero.</p>","palabras":1743}];

  if (e.key === "ArrowLeft" && CAPITULOS[i - 1]) location.hash = "#cap-" + CAPITULOS[i - 1].n;
});
document.getElementById("tema").addEventListener("click", () => {
  const orden = ["auto", "oscuro", "claro"]; const p = leer(); const sig = orden[(orden.indexOf(p.tema || "auto") + 1) % orden.length];
  guardar({ tema: sig }); aplicarPrefs();
});
document.getElementById("letra-mas").addEventListener("click", () => { guardar({ tam: Math.min(1.6, (leer().tam || 1.08) + 0.08) }); aplicarPrefs(); });
document.getElementById("letra-menos").addEventListener("click", () => { guardar({ tam: Math.max(0.84, (leer().tam || 1.08) - 0.08) }); aplicarPrefs(); });
aplicarPrefs(); ruta();
</script>
