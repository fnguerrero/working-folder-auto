const META = {"titulo":"Sudestada","bajada":"Una novela corta de suspenso","sinopsis":["Martín llamó un martes a la noche: «Necesito que vengas. No por teléfono». Verónica Aldao, perita calígrafa, vive de decir si una firma es de quien dice ser; de su hermano menor, que vive solo en la casa de la familia en una isla del Delta, cree saberlo todo.","Cuando llega el jueves, la lancha de Martín no está, la puerta está abierta y en la cocina hay una mujer que dice ser su pareja desde hace cuatro meses. Verónica nunca oyó hablar de ella. Esa noche entra la sudestada: el río sube, no sale ninguna lancha, el teléfono no toma señal, y las dos quedan encerradas en una casa sobre pilotes con el agua trepando por la escalera, cada una convencida de que la otra sabe algo de Martín que no dice.","Entre las libretas de tapa negra que su hermano escribía desde hace doce años, un vecino que mira demasiado el cielo, un desarrollador que viene a ver «el lote» y un hombre que cada madrugada rema del otro lado del arroyo, Verónica va a tener que leer, por una vez, algo que no es un documento."],"total":18,"autor":"Programador nocturno"};
const CAPITULOS = [{"n":1,"titulo":"La bolsa de siempre","cuando":"Jueves 9 de octubre, 11.40","html":"<p>La lancha colectiva tomó el arroyo del Fraile a las doce menos veinte y yo seguía repitiendo la frase. No por teléfono. Cinco sílabas y una pausa. La había escuchado el martes a las once de la noche con el celular apoyado en la oreja y la otra mano todavía sobre un pagaré que no era mío, y desde entonces la venía dando vuelta como se da vuelta un documento contra la luz para ver la filigrana: desde arriba, desde abajo, de costado. Necesito que vengas. No por teléfono. Y el clic, que en mi hermano nunca fue un clic sino un silencio en el que uno lo imagina mirando el aparato antes de apretar.</p>\n<p>Me senté del lado de la ventana, atrás, lejos de los dos chicos de la escuela de islas que volvían con un adulto que no era su padre y lo trataban como si lo fuera. La lancha iba casi vacía. Un jueves de octubre, a esa hora, el Delta es de los que viven ahí. Las casas de fin de semana pasaban cerradas, con las persianas bajas y los muelles levantando la tabla de la escalera para que el agua no se la lleve, y entre casa y casa el sauce, el ceibo, la caña, el barro de la orilla con el dibujo que deja la creciente cuando baja. Conozco ese arroyo de memoria y sin embargo lo miraba como si me lo fueran a preguntar.</p>\n<p>Tenía que haber ido el miércoles. Lo digo ahora y lo sabía entonces. El miércoles a las nueve tenía una audiencia en el juzgado veintidós, una pericia de las que no se posponen porque el juez ya pospuso dos veces, y a la tarde el banco, y me dije que un día no era nada, que Martín había dicho que viniera y no que viniera ya, que si hubiera sido grave me lo hubiera dicho de otra manera. Mi hermano no dice las cosas de otra manera. Mi hermano dice las cosas de una sola manera, que es a medias, y una aprende a llenar el resto. Yo llené el resto con una audiencia.</p>\n<p>Lo llamé el miércoles a las ocho de la mañana, antes de entrar. Apagado. Lo llamé a la una, apagado. A las siete de la tarde, apagado. Martín deja el teléfono sin batería dos de cada tres días y las veces que lo tiene cargado no lo oye porque está en el taller con la lijadora, así que el apagado no era en sí una noticia. La noticia era la frase. Me acosté con la frase y me levanté con la frase y a las ocho y cuarto, en lugar de ir a Tribunales, llamé a Sandra para que me corriera las dos citas de la mañana y agarré el auto.</p>\n<p>En el bolso de mano llevaba la lupa, que es ridículo. La lupa de diez aumentos con luz, la que uso para ver si el trazo de una firma tiene el temblor fino de alguien que copia o el impulso de alguien que sabe. Viene conmigo a todos lados como la billetera. Y en el asiento de atrás llevaba la bolsa de siempre, que es más ridículo todavía, porque era jueves.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Voy a la isla el primer sábado de cada mes. Lo hago desde hace doce años, desde que Martín salió de la clínica y decidió que iba a vivir en la casa de la abuela, y lo hago con un orden que no cambia porque el orden es lo que hace que una cosa se pueda sostener en el tiempo. Tomo la lancha de las nueve y media en la estación fluvial. Llevo la bolsa: dos kilos de yerba de la que a él le gusta, pilas para la radio y la linterna, el diario del sábado entero con los suplementos, un libro que a veces lee y a veces deja apilado, las facturas de la luz y del celular ya pagas con el comprobante abrochado, y la caja de clonazepam que retiro en la farmacia de Rivadavia con la receta que me da el doctor Lerner una vez por mes, porque la obra social es la mía y Martín figura como adherente y porque en la isla no hay farmacia.</p>\n<p>La caja la abro en la cocina, antes de dársela. Son treinta comprimidos de medio miligramo, en tres tiras de diez. Las conté, siempre las conté, y las cuento delante de él; no es desconfianza, es orden, es lo que hago con un expediente antes de firmar la recepción. Después las dejo en la mesada, al lado de la yerba, y pregunto cómo anda el motor de la lancha, y él me dice que bien, y yo le creo porque sobre motores no tengo con qué no creerle.</p>\n<p>A las cinco tomo la lancha de vuelta. A veces nos abrazamos en el muelle y a veces él se queda en la puerta del taller con las manos en los bolsillos y levanta el mentón, que en Martín es un abrazo.</p>\n<p>Ese jueves bajé a la estación fluvial con la bolsa en la mano y me di cuenta de que la había cargado de puro reflejo, como quien lleva el paraguas a un lugar donde no llueve. Faltaba el diario. Las pastillas estaban, porque había retirado la caja el lunes, y la yerba, y las pilas. Pensé en dejarla en el auto. No la dejé.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>El hombre de la lancha me conocía de vista. Me preguntó si iba a lo de Aldao y le dije que sí, y me dijo que el arroyo andaba alto, que el río venía picado desde el martes a la tarde, que la del mediodía era la última que entraba hasta el Fraile porque después del Fraile ya no había a quién llevar. Dijo que el cielo no le gustaba. Lo dijo mirando hacia el sudeste, donde el cielo era de un gris parejo, no amenazante, un gris de pared.</p>\n<p>—¿Hay aviso?</p>\n<p>—Siempre hay aviso —dijo—. Pero yo miro el agua.</p>\n<p>Miré el agua. Estaba marrón y rápida y traía camalote, que es lo que trae cuando el Paraná empuja. No supe leer nada en eso. En el pagaré que había dejado sobre el escritorio la cosa era más fácil: una firma de un hombre de setenta y ocho años con una enfermedad en las manos, puesta al pie de un documento de dos millones de pesos que su sobrino decía que él había firmado y la hija decía que no. Yo sabía leer eso. Sabía que un parkinsoniano no sostiene el trazo horizontal más de dos centímetros sin que el temblor le entre, y sabía que esa firma tenía el trazo horizontal de un hombre sano, y sabía lo que iba a escribir en el informe. En el agua marrón no sabía nada, pero algo en la nuca me decía que ese día la lancha entraba y no salía.</p>\n<p>Pasamos la casa de los Riquelme con la bandera argentina deshilachada, el recreo abandonado con el cartel de «El Ceibo» que ya nadie pinta, la curva donde el arroyo se angosta y los sauces de las dos orillas casi se tocan. Después la casa de Elías, con el muelle de tablas desparejas y la lona azul sobre la lancha, y el Negro parado en la punta mirando pasar la colectiva como la mira todos los días, sin ladrar. Y trescientos metros más adelante, en la misma orilla, la nuestra.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Lo primero que vi fue lo que no estaba. El muelle tiene un amarre a cada lado: en el de la derecha va la «Marta», la lancha de madera de cinco metros que Martín rehízo tabla por tabla el año que salió de la clínica, y en el de la izquierda va la chata, la de remo, la que Elías nos hizo cuando yo tenía diez años y mi hermano cuatro y mi abuela todavía vivía. La chata estaba. La «Marta» no.</p>\n<p>El hombre de la lancha arrimó con cuidado porque el agua ya tapaba el primer escalón del muelle y la tabla estaba resbalosa. Me dio la mano para bajar. Me pasó la bolsa. Me dijo que si quería volver esa tarde no contara con él, y que si la cosa se ponía fea Elías tenía radio. Se lo agradecí. Lo vi irse arroyo arriba levantando una ola chica que vino a golpear los pilotes de la casa con un ruido hueco, de tambor, que es el ruido de mi infancia.</p>\n<p>La casa es de madera, verde, con el techo a dos aguas, sobre pilotes de quebracho de un metro ochenta. Mi abuela decía que la había levantado para la creciente del cincuenta y nueve y que desde entonces el agua había entrado dos veces, y que las dos veces había sido culpa de la gente que vive aguas abajo, que en el Delta es un modo de decir que no es culpa de nadie. Tiene la galería al frente, mirando el arroyo, la cocina y el comedor abajo, y arriba dos piezas y un baño que mi madre hizo poner el año antes de enfermarse. Al costado, separado por un pasillo de tablas, el galpón que Martín convirtió en taller, con la bancada, las sierras y el olor a aceite de lino que se le pega a la ropa.</p>\n<p>La puerta de la galería estaba abierta. No entornada: abierta, con la hoja contra la pared, como se deja una puerta cuando uno sale un minuto. En la baranda había una toalla colgada. Una toalla celeste, de las de cuerpo entero, con una tira de flores bordadas en una punta. En esa casa no hay toallas con flores. Las toallas las compro yo.</p>\n<p>Subí los escalones con la bolsa en una mano y la otra apoyada en la baranda, y me detuve en el último porque desde ahí se ve la cocina a través de la puerta, y en la cocina había una mujer de espaldas, lavando una taza.</p>\n<p>Tenía el pelo oscuro recogido con un elástico y un pulóver gris que le quedaba grande, y estaba descalza sobre el piso de madera que mi abuela encerraba de rodillas, y lavaba la taza con el agua abierta a pleno, lo que en la isla, donde el agua viene del tanque y el tanque de la bomba, es algo que nadie que viva ahí hace. Cerró la canilla. Se dio vuelta para dejar la taza en el escurridor y me vio.</p>\n<p>No gritó. No se sobresaltó siquiera, o se sobresaltó con una economía que después iba a reconocer como suya: un segundo de quietud, los ojos que van de mi cara a la bolsa y vuelven a mi cara. Treinta y pico de años. Flaca. Una cara ancha, de pómulos, con dos surcos a los costados de la boca que no eran de edad sino de reírse fuerte, aunque en ese momento no se estaba riendo. Le miré las manos, como les miro las manos a todos: cortas, con las uñas sin pintar, roja la derecha por el agua caliente.</p>\n<p>—Hola —dijo.</p>\n<p>—Hola —dije yo, y no me moví del escalón—. ¿Quién sos?</p>\n<p>Se secó las manos en el pulóver. Dio dos pasos hasta la puerta, no para cerrarme el paso sino para que no tuviéramos que hablar a los gritos, y se quedó parada en el marco, en mi casa, descalza.</p>\n<p>—Ana —dijo—. Soy la pareja de Martín. —Me miró la bolsa de nuevo, la yerba que asomaba, y algo se le ordenó en la cara—. ¿Vos sos la hermana?</p>\n<p>Martín no tiene pareja. Lo pensé así, en esas cuatro palabras, con la convicción con que pienso que un documento es apócrifo antes de encender la lupa. Después encendí la lupa.</p>\n<p>—Soy Verónica —dije—. ¿Dónde está?</p>\n<p>—No sé —dijo Ana—. Salió el miércoles temprano y no volvió.</p>\n<p>Detrás de ella, en la mesada, al lado del escurridor, había dos tazas más. Secas. Y una de ellas era la de Martín, la del asa pegada, la que yo le había pegado con epoxi hacía tres años en esa misma mesada mientras él miraba y no decía nada.</p>","palabras":2018},{"n":2,"titulo":"La tinta","cuando":"Jueves 9 de octubre, 14.30","html":"<p>Me senté en la silla de mi abuela, la de la cabecera, la que tiene la pata corta y se bambolea si uno se apoya para atrás, y dejé la bolsa en el piso al lado. Ana puso la pava. No preguntó si quería mate; lo puso como se pone en una casa donde uno sabe dónde está la yerba, y yo le miré la mano cuando abrió la lata de la alacena de arriba, la lata de galletitas con el dibujo de la nena con rulos, y pensé que esa lata la había puesto ahí mi madre.</p>\n<p>—Contame —dije.</p>\n<p>Contó. Lo hizo bien, en orden, sin adornos, como cuenta alguien que ya lo contó varias veces en la cabeza y se dio cuenta de que ninguna versión mejora la primera. Martín había salido el miércoles antes de las seis, de noche todavía, en la «Marta». Tenía que ir a Tigre por un trabajo, un muelle que había cotizado en el río Sarmiento, y de paso llevar el motor a lo del Turco, que le estaba fallando el arranque. Le había dicho que volvía para la cena. Ella se había tomado la colectiva de las siete y veinte a la escuela, como todos los días, había dado clase, había vuelto a las cinco y la casa estaba como la habían dejado. A las nueve de la noche le había escrito. A las once lo había llamado. Apagado. A la una, apagado. El jueves a la mañana había llamado a la escuela para avisar que no iba y había llamado a la Prefectura de Tigre, donde un cabo le había tomado los datos y le había dicho que un hombre adulto que no vuelve una noche no es una persona desaparecida, que lo busque en los hospitales, que vuelva a llamar el viernes. Había llamado al Hospital de Tigre y al de San Fernando. Nada. Al Turco no lo tenía agendado.</p>\n<p>—¿Y a mí?</p>\n<p>—No tengo tu número. —Me miró—. Martín dijo que te iba a llamar él.</p>\n<p>—Me llamó el martes.</p>\n<p>—Ya sé. Yo estaba.</p>\n<p>Lo dijo sin bajar los ojos, y yo sentí que la frase tenía un peso raro, como un sobre con algo adentro que no es una carta.</p>\n<p>—¿Qué te dijo que me iba a decir?</p>\n<p>—Que vinieras.</p>\n<p>La pava empezó a silbar. Ana se levantó y la sacó del fuego antes de que llegara a hervir, que es como se saca una pava en esa casa y en todas las casas donde se toma mate de verdad, y pensé contra mi voluntad que si fuera una impostora no sabría eso. Después pensé que cualquiera sabe eso.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Le pedí que me dejara recorrer la casa sola. No se lo pedí: lo dije, que iba a subir, y ella asintió como si yo le hubiera pedido permiso y ella me lo hubiera dado. Me molestó y subí.</p>\n<p>La escalera cruje en el tercero y en el séptimo escalón. Crujió. Arriba el pasillo con la ventana al fondo, que da al arroyo abajo, hacia lo de Elías; a la izquierda el baño, a la derecha la pieza que fue de mi madre y después mía, y al fondo la de Martín, que fue de los dos cuando éramos chicos y tenía las camas cuchetas que él mismo desarmó a los veinte.</p>\n<p>Hay una manera de entrar en un lugar donde pasó algo. La aprendí de un oficial de justicia con el que hice las primeras diligencias, un hombre que entraba en los departamentos de los muertos sin tocar nada durante el primer minuto, parado en la puerta, mirando. Decía que uno ve más en el primer minuto que en la hora siguiente, porque después ya empieza a buscar y el que busca encuentra lo que busca.</p>\n<p>Me quedé en la puerta.</p>\n<p>La cama era la de dos plazas que Martín compró usada en San Fernando. Estaba hecha. Las sábanas tirantes, la frazada doblada al pie en tres, las dos almohadas. Dos. Del lado de la ventana, la mesa de luz con su lámpara de pinza y una libreta de tapa negra, la de siempre, con una birome metida en el elástico. Del lado de la puerta, una mesita que antes no estaba, una banqueta con un libro de la escuela, de esos de tapa blanda con el nombre del ministerio, y arriba de la banqueta una crema para las manos y un atado de cigarrillos. En el ropero, que tenía una puerta abierta, la mitad de la izquierda con la ropa de Martín, las camisas de trabajo, el buzo gris, las dos camperas; la mitad de la derecha con ropa de mujer. No mucha. Tres o cuatro perchas, un par de zapatillas en el piso, una campera de jean. Lo que uno trae cuando viene a vivir con alguien y todavía no decidió si se queda. O lo que uno deja cuando decidió irse y no se llevó todo. Las dos cosas se ven igual desde una puerta.</p>\n<p>En el estante de arriba del ropero, donde de chicos guardábamos los juegos de mesa, estaban las libretas. Once, paradas como libros, con el lomo marcado con fibra blanca: un año y un mes por libreta, a veces dos meses, desde hace doce años. La psicóloga de la clínica se lo había recomendado y Martín, que no hacía nada de lo que le recomendaban, había hecho eso. Yo nunca las había leído. Nunca las había abierto. Había pasado doce años sabiendo que estaban ahí y no abriéndolas, y lo había considerado un mérito mío, una forma de respeto, que es como una se cuenta las cosas que no se anima a hacer.</p>\n<p>Entré. Fui derecho a la mesa de luz y agarré la libreta de tapa negra, la de la birome en el elástico, y la abrí por el final.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>No la leí. No todavía. Lo que hice primero fue lo que hago siempre, que es mirar el papel antes que las palabras. La tinta era azul, de birome, de las comunes. La letra de Martín, que conozco mejor que la mía porque yo se la enseñé, es chica, redonda, inclinada hacia la izquierda, con las eles que suben mucho y las ges que bajan poco. Y tiene lo que tienen todos los zurdos que escriben de corrido: el arrastre. La mano del zurdo va por delante de lo que escribe y pasa por encima de la tinta fresca, y la tinta se corre un poco hacia la derecha, se ensucia en el borde, y el trazo que viene de la izquierda, el de bajada de la ele o el de la te, queda más cargado que el de ida. A un perito que no se fija en eso le pueden vender un dictado como una carta. A mí no. Martín es zurdo desde que agarró la primera cuchara y mi madre le cambió la cuchara de mano dos veces y a la tercera se rindió.</p>\n<p>La última página escrita tenía una fecha arriba, con la abreviatura que usa él: mié 10/9. Un párrafo corto. Después, nada: la hoja siguiente estaba en blanco.</p>\n<p>Pero entre la hoja de «mié 10/9» y la hoja en blanco faltaban hojas. Lo vi antes de contarlas, por el grosor, por cómo el elástico cerraba un poco más flojo de lo que debería. Las conté: cuatro. Cuatro hojas arrancadas, y no arrancadas como se arranca cuando uno está enojado, con el borde rasgado y el pedazo que queda pegado al lomo. Estas estaban cortadas al ras, con una trincheta o una hoja de afeitar, pegado a la costura, con cuidado. Pasé el dedo por el borde. Prolijo. Alguien había sacado esas hojas de modo que no se notara, y lo había hecho tan bien que solo se notaba si uno sabía mirar.</p>\n<p>Abajo se abrió la canilla. El agua del tanque cayendo en la pileta de la cocina, el ruido de la casa. Cerré la libreta, la puse donde estaba, con la birome en el elástico en la misma posición, y bajé. En el tercer escalón y en el séptimo, el crujido.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Elías vino a las cuatro. Lo oí antes de verlo, el golpe de los remos en el agua, parejo, lento, el mismo compás que tenía cuando yo era chica y él remaba hasta nuestra casa con la damajuana de agua los veranos en que la bomba se rompía. La chata de Elías es verde como la nuestra, que la pintó él, y el Negro iba parado en la proa, y cuando vio el muelle se tiró al agua y subió la escalera chorreando.</p>\n<p>Elías amarró, subió despacio, se sacó la gorra. Tiene setenta y un años y las manos de mimbrero, grandes, con los nudillos abiertos. Me abrazó. Olía a leña y a río.</p>\n<p>—Verónica.</p>\n<p>—Elías.</p>\n<p>Miró a Ana, que había salido a la galería, y le hizo un gesto con la cabeza que era un saludo y no era más que un saludo, y Ana le devolvió el mismo gesto. Se conocían. Claro que se conocían: ella vivía ahí desde hacía cuatro meses. Yo era la única en ese muelle a la que todo le resultaba nuevo.</p>\n<p>—¿Sabés algo?</p>\n<p>—Lo que sé es poco. —Elías no se sienta en una galería ajena si no lo invitan; lo invité y se sentó en el banco de madera, con la gorra en la rodilla—. Lo vi salir el miércoles a las seis. Yo estaba en el muelle, levantando las nasas, que con el río así no sirven. Pasó para arriba en la «Marta», con el motor bajo, despacito, como va él. Me levantó la mano. La maestra lo despidió en el muelle.</p>\n<p>Lo dijo en el mismo tono con que dijo todo lo demás. Miré a Ana. Ana no me miró a mí, miró a Elías, y dijo:</p>\n<p>—Me levanté a despedirlo. Después me volví a acostar hasta la colectiva.</p>\n<p>—Me dijiste que dormías.</p>\n<p>—Dije que salió antes de que me levantara. —Se cruzó de brazos; el pulóver le tapaba las manos—. Me levanté, lo despedí, me volví a dormir. ¿Importa?</p>\n<p>Importaba. No sabía por qué, pero en mi trabajo una enmienda, por chica que sea, es el lugar donde hay que poner la lupa. No dije nada. Elías tampoco. Siguió:</p>\n<p>—No volvió. Yo estuve en el muelle hasta la noche, con el agua que subía, atando las cosas. No lo vi pasar de vuelta. Ayer tampoco. —Miró el arroyo—. El río está alto desde el martes. Si tuvo un problema con el motor en el Sarmiento o en el Luján, lo habrán remolcado a Tigre. Hay que preguntar en Tigre.</p>\n<p>—Llamé a Prefectura —dijo Ana—. Me dijeron que llame el viernes.</p>\n<p>—Prefectura. —Elías se puso la gorra—. Yo tengo la radio. Mañana a la mañana, si aflojó, llamo yo, que a mí me conocen. Hoy no van a salir. Hoy no sale nadie.</p>\n<p>Se paró. Miró el cielo hacia el sudeste, donde el gris se había puesto más bajo y más oscuro, y después miró el agua, que ya lamía el segundo escalón del muelle y traía camalote en placas grandes, con flores lilas, dando vueltas despacio.</p>\n<p>—Viene sudestada, Verónica —dijo—. Grande. Si te vas, andate hoy. El Chino no entra mañana. Nadie entra mañana.</p>\n<p>—¿Cuánto va a subir?</p>\n<p>Se encogió de hombros.</p>\n<p>—La del dos mil veintitrés entró en la casa de los Riquelme. Esta viene parecida. Subí las cosas de abajo. Tenés el grupo electrógeno en el galpón, fijate si tiene nafta. Y el agua del tanque, que después se ensucia. —Me puso una mano en el hombro, pesada—. Y quedate arriba. No andes en la chata. Con el río así no se anda en chata.</p>\n<p>Bajó al muelle, desamarró, se sentó en la chata y el Negro saltó a la proa. Antes de irse levantó la vista hacia la galería. Me miró a mí, y después a Ana, y después a mí otra vez, y hubo en esa mirada algo que no supe leer, una pregunta o una advertencia, y se fue arroyo abajo con el compás de siempre, un remo y el otro, hasta que el sauce de la curva lo tapó.</p>\n<p>Me quedé en la galería. Ana se quedó en la puerta. Pensé en la lancha de las cinco, que no iba a venir, y en mi auto en el estacionamiento de la estación fluvial, y en Sandra con mis citas corridas, y en el pagaré del hombre con parkinson, y en la bolsa en el piso de la cocina con las treinta pastillas contadas, y en las cuatro hojas cortadas al ras. Pensé que podía caminar hasta lo de Elías y pedirle que me cruzara a la ruta de la otra isla, de donde salía un colectivo. Elías no me iba a cruzar con el río así. Y yo no me iba a ir.</p>\n<p>—Me quedo —dije.</p>\n<p>—Ya sé —dijo Ana.</p>\n<p>El viento cambió a las seis. Se notó en la galería como se nota una persona que entra en una habitación: el aire dejó de venir del norte, tibio y con olor a tierra, y empezó a venir del sudeste, frío, con olor a nada, a agua abierta, a río grande. Los sauces de enfrente se dieron vuelta y mostraron el reverso plateado de las hojas. El arroyo, que corría para abajo, se quedó quieto. Y después, despacio, tan despacio que había que mirar un punto fijo del muelle para notarlo, empezó a correr para arriba.</p>","palabras":2240}];
const CLAVE = "sudestada";
function leer() { try { return JSON.parse(localStorage.getItem(CLAVE) || "{}") || {}; } catch { return {}; } }
function guardar(cambios) { try { const e = Object.assign(leer(), cambios); localStorage.setItem(CLAVE, JSON.stringify(e)); } catch {} }
const main = document.getElementById("main"), titSup = document.getElementById("titulo-sup"), prog = document.getElementById("progreso");
const h = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function aplicarPrefs() {
  const p = leer();
  document.documentElement.dataset.tema = p.tema || "auto";
  document.documentElement.style.setProperty("--tam", (p.tam || 1.08) + "rem");
}
function portada() {
  const p = leer(); const sigue = p.cap && CAPITULOS.some((c) => c.n === p.cap);
  const items = CAPITULOS.map((c) => `<li class="${p.cap === c.n ? "actual" : (p.leidos || []).includes(c.n) ? "leido" : ""}"><a href="#cap-${c.n}"><span class="n">${c.n}</span><span class="t">${h(c.titulo)}</span><span class="c">${h(c.cuando)}</span></a></li>`).join("");
  const nota = CAPITULOS.length < META.total ? `<div class="nota">La novela está en curso: hay ${CAPITULOS.length} de ${META.total} capítulos publicados. Los que faltan van saliendo noche a noche.</div>` : "";
  main.innerHTML = `<section class="portada">
    <h1>${h(META.titulo)}</h1><p class="bajada">${h(META.bajada)}</p>
    <div class="sinopsis">${META.sinopsis.map((s) => "<p>" + h(s).replace(/\*([^*]+)\*/g, "<em>$1</em>") + "</p>").join("")}</div>
    <div class="acciones">${sigue ? `<a class="boton" href="#cap-${p.cap}">Seguir leyendo · cap. ${p.cap}</a><a class="boton sec" href="#cap-1">Empezar de nuevo</a>` : `<a class="boton" href="#cap-1">Empezar a leer</a>`}
      <a class="boton sec" href="sudestada.html">Novela entera (para imprimir)</a><a class="boton sec" href="sudestada.epub" download>EPUB</a></div>
    ${nota}
    <h2 id="indice-titulo">Capítulos</h2><ol class="indice">${items}</ol>
    <p class="pie-vitrina"><a href="../../">← Volver a la vitrina</a> · ${h(META.autor)}</p></section>`;
  titSup.textContent = META.titulo; prog.style.width = "0";
  document.title = META.titulo;
}
function capitulo(n) {
  const i = CAPITULOS.findIndex((c) => c.n === n); if (i < 0) { location.hash = "#indice"; return; }
  const c = CAPITULOS[i], ant = CAPITULOS[i - 1], sig = CAPITULOS[i + 1];
  main.innerHTML = `<article class="capitulo"><h1><span class="num">Capítulo ${c.n} de ${META.total}</span>${h(c.titulo)}</h1><p class="cuando">${h(c.cuando)}</p><div class="texto">${c.html}</div>
    ${!sig && CAPITULOS.length >= META.total ? '<p class="fin">Fin</p>' : !sig ? '<p class="fin">Hasta acá por ahora. El capítulo que sigue sale otra noche.</p>' : ""}
    <nav class="pie">${ant ? `<a class="ant" href="#cap-${ant.n}"><small>← Anterior</small>${ant.n}. ${h(ant.titulo)}</a>` : `<a class="ant" href="#indice"><small>←</small>Índice</a>`}${sig ? `<a class="sig" href="#cap-${sig.n}"><small>Siguiente →</small>${sig.n}. ${h(sig.titulo)}</a>` : `<a class="sig" href="#indice"><small>→</small>Índice</a>`}</nav></article>`;
  titSup.textContent = c.n + ". " + c.titulo; document.title = c.n + ". " + c.titulo + " · " + META.titulo;
  const p = leer(); const leidos = new Set(p.leidos || []); if (ant) leidos.add(ant.n);
  guardar({ cap: n, leidos: [...leidos] });
  const pos = p.cap === n ? (p.pos || 0) : 0;
  requestAnimationFrame(() => { window.scrollTo(0, pos * Math.max(1, document.documentElement.scrollHeight - innerHeight)); });
}
let capActual = 0;
function ruta() {
  const m = /^#cap-(\d+)$/.exec(location.hash);
  if (m) { capActual = parseInt(m[1], 10); capitulo(capActual); } else { capActual = 0; portada(); if (location.hash !== "#indice") window.scrollTo(0, 0); }
}
let t = 0;
addEventListener("scroll", () => {
  if (!capActual) return;
  const max = Math.max(1, document.documentElement.scrollHeight - innerHeight); const f = Math.min(1, scrollY / max);
  prog.style.width = (f * 100).toFixed(1) + "%";
  clearTimeout(t); t = setTimeout(() => guardar({ cap: capActual, pos: f }), 150);
}, { passive: true });
addEventListener("hashchange", ruta);
addEventListener("keydown", (e) => {
  if (!capActual || e.altKey || e.ctrlKey || e.metaKey) return;
  const i = CAPITULOS.findIndex((c) => c.n === capActual);
  if (e.key === "ArrowRight" && CAPITULOS[i + 1]) location.hash = "#cap-" + CAPITULOS[i + 1].n;
  if (e.key === "ArrowLeft" && CAPITULOS[i - 1]) location.hash = "#cap-" + CAPITULOS[i - 1].n;
});
document.getElementById("tema").addEventListener("click", () => {
  const orden = ["auto", "oscuro", "claro"]; const p = leer(); const sig = orden[(orden.indexOf(p.tema || "auto") + 1) % orden.length];
  guardar({ tema: sig }); aplicarPrefs();
});
document.getElementById("letra-mas").addEventListener("click", () => { guardar({ tam: Math.min(1.6, (leer().tam || 1.08) + 0.08) }); aplicarPrefs(); });
document.getElementById("letra-menos").addEventListener("click", () => { guardar({ tam: Math.max(0.84, (leer().tam || 1.08) - 0.08) }); aplicarPrefs(); });
aplicarPrefs(); ruta();
</script>
