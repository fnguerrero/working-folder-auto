const META = {"titulo":"Sudestada","bajada":"Una novela corta de suspenso","sinopsis":["Martín llamó un martes a la noche: «Necesito que vengas. No por teléfono». Verónica Aldao, perita calígrafa, vive de decir si una firma es de quien dice ser; de su hermano menor, que vive solo en la casa de la familia en una isla del Delta, cree saberlo todo.","Cuando llega el jueves, la lancha de Martín no está, la puerta está abierta y en la cocina hay una mujer que dice ser su pareja desde hace cuatro meses. Verónica nunca oyó hablar de ella. Esa noche entra la sudestada: el río sube, no sale ninguna lancha, el teléfono no toma señal, y las dos quedan encerradas en una casa sobre pilotes con el agua trepando por la escalera, cada una convencida de que la otra sabe algo de Martín que no dice.","Entre las libretas de tapa negra que su hermano escribía desde hace doce años, un vecino que mira demasiado el cielo, un desarrollador que viene a ver «el lote» y un hombre que cada madrugada rema del otro lado del arroyo, Verónica va a tener que leer, por una vez, algo que no es un documento."],"total":18,"autor":"Programador nocturno"};
const CAPITULOS = [{"n":1,"titulo":"La bolsa de siempre","cuando":"Jueves 9 de octubre, 11.40","html":"<p>La lancha colectiva tomó el arroyo del Fraile a las doce menos veinte y yo seguía repitiendo la frase. No por teléfono. Cinco sílabas y una pausa. La había escuchado el martes a las once de la noche con el celular apoyado en la oreja y la otra mano todavía sobre un pagaré que no era mío, y desde entonces la venía dando vuelta como se da vuelta un documento contra la luz para ver la filigrana: desde arriba, desde abajo, de costado. Necesito que vengas. No por teléfono. Y el clic, que en mi hermano nunca fue un clic sino un silencio en el que uno lo imagina mirando el aparato antes de apretar.</p>\n<p>Me senté del lado de la ventana, atrás, lejos de los dos chicos de la escuela de islas que volvían con un adulto que no era su padre y lo trataban como si lo fuera. La lancha iba casi vacía. Un jueves de octubre, a esa hora, el Delta es de los que viven ahí. Las casas de fin de semana pasaban cerradas, con las persianas bajas y los muelles levantando la tabla de la escalera para que el agua no se la lleve, y entre casa y casa el sauce, el ceibo, la caña, el barro de la orilla con el dibujo que deja la creciente cuando baja. Conozco ese arroyo de memoria y sin embargo lo miraba como si me lo fueran a preguntar.</p>\n<p>Tenía que haber ido el miércoles. Lo digo ahora y lo sabía entonces. El miércoles a las nueve tenía una audiencia en el juzgado veintidós, una pericia de las que no se posponen porque el juez ya pospuso dos veces, y a la tarde el banco, y me dije que un día no era nada, que Martín había dicho que viniera y no que viniera ya, que si hubiera sido grave me lo hubiera dicho de otra manera. Mi hermano no dice las cosas de otra manera. Mi hermano dice las cosas de una sola manera, que es a medias, y una aprende a llenar el resto. Yo llené el resto con una audiencia.</p>\n<p>Lo llamé el miércoles a las ocho de la mañana, antes de entrar. Apagado. Lo llamé a la una, apagado. A las siete de la tarde, apagado. Martín deja el teléfono sin batería dos de cada tres días y las veces que lo tiene cargado no lo oye porque está en el taller con la lijadora, así que el apagado no era en sí una noticia. La noticia era la frase. Me acosté con la frase y me levanté con la frase y a las ocho y cuarto, en lugar de ir a Tribunales, llamé a Sandra para que me corriera las dos citas de la mañana y agarré el auto.</p>\n<p>En el bolso de mano llevaba la lupa, que es ridículo. La lupa de diez aumentos con luz, la que uso para ver si el trazo de una firma tiene el temblor fino de alguien que copia o el impulso de alguien que sabe. Viene conmigo a todos lados como la billetera. Y en el asiento de atrás llevaba la bolsa de siempre, que es más ridículo todavía, porque era jueves.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Voy a la isla el primer sábado de cada mes. Lo hago desde hace doce años, desde que Martín salió de la clínica y decidió que iba a vivir en la casa de la abuela, y lo hago con un orden que no cambia porque el orden es lo que hace que una cosa se pueda sostener en el tiempo. Tomo la lancha de las nueve y media en la estación fluvial. Llevo la bolsa: dos kilos de yerba de la que a él le gusta, pilas para la radio y la linterna, el diario del sábado entero con los suplementos, un libro que a veces lee y a veces deja apilado, las facturas de la luz y del celular ya pagas con el comprobante abrochado, y la caja de clonazepam que retiro en la farmacia de Rivadavia con la receta que me da el doctor Lerner una vez por mes, porque la obra social es la mía y Martín figura como adherente y porque en la isla no hay farmacia.</p>\n<p>La caja la abro en la cocina, antes de dársela. Son treinta comprimidos de medio miligramo, en tres tiras de diez. Las conté, siempre las conté, y las cuento delante de él; no es desconfianza, es orden, es lo que hago con un expediente antes de firmar la recepción. Después las dejo en la mesada, al lado de la yerba, y pregunto cómo anda el motor de la lancha, y él me dice que bien, y yo le creo porque sobre motores no tengo con qué no creerle.</p>\n<p>A las cinco tomo la lancha de vuelta. A veces nos abrazamos en el muelle y a veces él se queda en la puerta del taller con las manos en los bolsillos y levanta el mentón, que en Martín es un abrazo.</p>\n<p>Ese jueves bajé a la estación fluvial con la bolsa en la mano y me di cuenta de que la había cargado de puro reflejo, como quien lleva el paraguas a un lugar donde no llueve. Faltaba el diario. Las pastillas estaban, porque había retirado la caja el lunes, y la yerba, y las pilas. Pensé en dejarla en el auto. No la dejé.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>El hombre de la lancha me conocía de vista. Me preguntó si iba a lo de Aldao y le dije que sí, y me dijo que el arroyo andaba alto, que el río venía picado desde el martes a la tarde, que la del mediodía era la última que entraba hasta el Fraile porque después del Fraile ya no había a quién llevar. Dijo que el cielo no le gustaba. Lo dijo mirando hacia el sudeste, donde el cielo era de un gris parejo, no amenazante, un gris de pared.</p>\n<p>—¿Hay aviso?</p>\n<p>—Siempre hay aviso —dijo—. Pero yo miro el agua.</p>\n<p>Miré el agua. Estaba marrón y rápida y traía camalote, que es lo que trae cuando el Paraná empuja. No supe leer nada en eso.</p>\n<p>Hay una cosa que explico siempre, en las audiencias, cuando un abogado me pregunta cómo puedo estar tan segura. Una firma no es un dibujo. Un dibujo se copia. Una firma es un gesto, un movimiento que la mano aprendió a los nueve o a los quince años y que después hizo diez mil veces hasta que dejó de pensarlo, como se deja de pensar el camino a casa. El que falsifica copia el dibujo. Lo que no puede copiar es el gesto, porque el gesto no está en el papel: está en la velocidad, en dónde aprieta y dónde afloja, en el lugar donde la mano, sin que el dueño lo sepa, duda un instante antes de seguir. Yo no miro la forma. Miro la duda. Y en veinte años aprendí que la gente se parece a su firma más de lo que cree: los que aprietan, los que no terminan, los que vuelven atrás a corregir una letra que nadie iba a mirar. A veces pienso que podría conocer a una persona por su firma sin haberla visto. A veces lo digo en voz alta, en una cena, y la gente se ríe, y yo no. En el pagaré que había dejado sobre el escritorio la cosa era más fácil: una firma de un hombre de setenta y ocho años con una enfermedad en las manos, puesta al pie de un documento de dos millones de pesos que su sobrino decía que él había firmado y la hija decía que no. Yo sabía leer eso. Sabía que un parkinsoniano no sostiene el trazo horizontal más de dos centímetros sin que el temblor le entre, y sabía que esa firma tenía el trazo horizontal de un hombre sano, y sabía lo que iba a escribir en el informe. En el agua marrón no sabía nada, pero algo en la nuca me decía que ese día la lancha entraba y no salía.</p>\n<p>Pasamos la casa de los Riquelme con la bandera argentina deshilachada, el recreo abandonado con el cartel de «El Ceibo» que ya nadie pinta, la curva donde el arroyo se angosta y los sauces de las dos orillas casi se tocan. Después la casa de Elías, con el muelle de tablas desparejas y la lona azul sobre la lancha, y el Negro parado en la punta mirando pasar la colectiva como la mira todos los días, sin ladrar. Y trescientos metros más adelante, en la misma orilla, la nuestra.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Lo primero que vi fue lo que no estaba. El muelle tiene un amarre a cada lado: en el de la derecha va la «Marta», la lancha de madera de cinco metros que Martín rehízo tabla por tabla el año que salió de la clínica, y en el de la izquierda va la chata, la de remo, la que Elías nos hizo cuando yo tenía diez años y mi hermano cuatro y mi abuela todavía vivía. La chata estaba. La «Marta» no.</p>\n<p>El hombre de la lancha arrimó con cuidado porque el agua ya tapaba el primer escalón del muelle y la tabla estaba resbalosa. Me dio la mano para bajar. Me pasó la bolsa. Me dijo que si quería volver esa tarde no contara con él, y que si la cosa se ponía fea Elías tenía radio. Se lo agradecí. Lo vi irse arroyo arriba levantando una ola chica que vino a golpear los pilotes de la casa con un ruido hueco, de tambor, que es el ruido de mi infancia.</p>\n<p>La casa es de madera, verde, con el techo a dos aguas, sobre pilotes de quebracho de un metro ochenta. Mi abuela decía que la había levantado para la creciente del cincuenta y nueve y que desde entonces el agua había entrado dos veces, y que las dos veces había sido culpa de la gente que vive aguas abajo, que en el Delta es un modo de decir que no es culpa de nadie. Tiene la galería al frente, mirando el arroyo, la cocina y el comedor abajo, y arriba dos piezas y un baño que mi madre hizo poner el año antes de enfermarse. Al costado, separado por un pasillo de tablas, el galpón que Martín convirtió en taller, con la bancada, las sierras y el olor a aceite de lino que se le pega a la ropa.</p>\n<p>La puerta de la galería estaba abierta. No entornada: abierta, con la hoja contra la pared, como se deja una puerta cuando uno sale un minuto. En la baranda había una toalla colgada. Una toalla celeste, de las de cuerpo entero, con una tira de flores bordadas en una punta. En esa casa no hay toallas con flores. Las toallas las compro yo.</p>\n<p>Subí los escalones con la bolsa en una mano y la otra apoyada en la baranda, y me detuve en el último porque desde ahí se ve la cocina a través de la puerta, y en la cocina había una mujer de espaldas, lavando una taza.</p>\n<p>Tenía el pelo oscuro recogido con un elástico y un pulóver gris que le quedaba grande, y estaba descalza sobre el piso de madera que mi abuela encerraba de rodillas, y lavaba la taza con el agua abierta a pleno, lo que en la isla, donde el agua viene del tanque y el tanque de la bomba, es algo que nadie que viva ahí hace. Cerró la canilla. Se dio vuelta para dejar la taza en el escurridor y me vio.</p>\n<p>No gritó. No se sobresaltó siquiera, o se sobresaltó con una economía que después iba a reconocer como suya: un segundo de quietud, los ojos que van de mi cara a la bolsa y vuelven a mi cara. Treinta y pico de años. Flaca. Una cara ancha, de pómulos, con dos surcos a los costados de la boca que no eran de edad sino de reírse fuerte, aunque en ese momento no se estaba riendo. Le miré las manos, como les miro las manos a todos: cortas, con las uñas sin pintar, roja la derecha por el agua caliente.</p>\n<p>—Hola —dijo.</p>\n<p>—Hola —dije yo, y no me moví del escalón—. ¿Quién sos?</p>\n<p>Se secó las manos en el pulóver. Dio dos pasos hasta la puerta, no para cerrarme el paso sino para que no tuviéramos que hablar a los gritos, y se quedó parada en el marco, en mi casa, descalza.</p>\n<p>—Ana —dijo—. Soy la pareja de Martín. —Me miró la bolsa de nuevo, la yerba que asomaba, y algo se le ordenó en la cara—. ¿Vos sos la hermana?</p>\n<p>Martín no tiene pareja. Lo pensé así, en esas cuatro palabras, con la convicción con que pienso que un documento es apócrifo antes de encender la lupa. Después encendí la lupa.</p>\n<p>—Soy Verónica —dije—. ¿Dónde está?</p>\n<p>—No sé —dijo Ana—. Salió el miércoles temprano y no volvió.</p>\n<p>Detrás de ella, en la mesada, al lado del escurridor, había dos tazas más. Secas. Y una de ellas era la de Martín, la del asa pegada, la que yo le había pegado con epoxi hacía tres años en esa misma mesada mientras él miraba y no decía nada.</p>","palabras":2216},{"n":2,"titulo":"La tinta","cuando":"Jueves 9 de octubre, 14.30","html":"<p>Me senté en la silla de mi abuela, la de la cabecera, la que tiene la pata corta y se bambolea si uno se apoya para atrás, y dejé la bolsa en el piso al lado. Ana puso la pava. No preguntó si quería mate; lo puso como se pone en una casa donde uno sabe dónde está la yerba, y yo le miré la mano cuando abrió la lata de la alacena de arriba, la lata de galletitas con el dibujo de la nena con rulos, y pensé que esa lata la había puesto ahí mi madre.</p>\n<p>—Contame —dije.</p>\n<p>Contó. Lo hizo bien, en orden, sin adornos, como cuenta alguien que ya lo contó varias veces en la cabeza y se dio cuenta de que ninguna versión mejora la primera. Martín había salido el miércoles antes de las seis, de noche todavía, en la «Marta». Tenía que ir a Tigre por un trabajo, un muelle que había cotizado en el río Sarmiento, y de paso llevar el motor a lo del Turco, que le estaba fallando el arranque. Le había dicho que volvía para la cena. Ella se había tomado la colectiva de las siete y veinte a la escuela, como todos los días, había dado clase, había vuelto a las cinco y la casa estaba como la habían dejado. A las nueve de la noche le había escrito. A las once lo había llamado. Apagado. A la una, apagado. El jueves a la mañana había llamado a la escuela para avisar que no iba y había llamado a la Prefectura de Tigre, donde un cabo le había tomado los datos y le había dicho que un hombre adulto que no vuelve una noche no es una persona desaparecida, que lo busque en los hospitales, que vuelva a llamar el viernes. Había llamado al Hospital de Tigre y al de San Fernando. Nada. Al Turco no lo tenía agendado.</p>\n<p>—¿Y a mí?</p>\n<p>—No tengo tu número. —Me miró—. Martín dijo que te iba a llamar él.</p>\n<p>—Me llamó el martes.</p>\n<p>—Ya sé. Yo estaba.</p>\n<p>Lo dijo sin bajar los ojos, y yo sentí que la frase tenía un peso raro, como un sobre con algo adentro que no es una carta.</p>\n<p>—¿Qué te dijo que me iba a decir?</p>\n<p>—Que vinieras.</p>\n<p>La pava empezó a silbar. Ana se levantó y la sacó del fuego antes de que llegara a hervir, que es como se saca una pava en esa casa y en todas las casas donde se toma mate de verdad, y pensé contra mi voluntad que si fuera una impostora no sabría eso. Después pensé que cualquiera sabe eso.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Le pedí que me dejara recorrer la casa sola. No se lo pedí: lo dije, que iba a subir, y ella asintió como si yo le hubiera pedido permiso y ella me lo hubiera dado. Me molestó y subí.</p>\n<p>La escalera cruje en el tercero y en el séptimo escalón. Crujió. Arriba el pasillo con la ventana al fondo, que da al arroyo abajo, hacia lo de Elías; a la izquierda el baño, a la derecha la pieza que fue de mi madre y después mía, y al fondo la de Martín, que fue de los dos cuando éramos chicos y tenía las camas cuchetas que él mismo desarmó a los veinte.</p>\n<p>Hay una manera de entrar en un lugar donde pasó algo. La aprendí de un oficial de justicia con el que hice las primeras diligencias, un hombre que entraba en los departamentos de los muertos sin tocar nada durante el primer minuto, parado en la puerta, mirando. Decía que uno ve más en el primer minuto que en la hora siguiente, porque después ya empieza a buscar y el que busca encuentra lo que busca.</p>\n<p>Antes, en el pasillo, había mirado el baño. La puerta estaba abierta. El baño que mi madre hizo poner el año antes de enfermarse, con los azulejos celestes que eligió ella en una casa de sanitarios de San Fernando un sábado entero, y el espejo con el marco de madera que le hizo Elías. En el vaso del lavatorio, dos cepillos de dientes. Uno azul, gastado, con las cerdas abiertas, el de Martín, que no cambia el cepillo hasta que yo le traigo uno. Y uno blanco, nuevo, de cerdas derechas, apoyado contra el azul en el vaso, en el ángulo en que se apoyan dos cosas que llevan un tiempo compartiendo un vaso. Me quedé mirando ese ángulo más de lo que corresponde a un cepillo de dientes. Después seguí.</p>\n<p>Me quedé en la puerta.</p>\n<p>La cama era la de dos plazas que Martín compró usada en San Fernando. Estaba hecha. Las sábanas tirantes, la frazada doblada al pie en tres, las dos almohadas. Dos. Del lado de la ventana, la mesa de luz con su lámpara de pinza y una libreta de tapa negra, la de siempre, con una birome metida en el elástico. Del lado de la puerta, una mesita que antes no estaba, una banqueta con un libro de la escuela, de esos de tapa blanda con el nombre del ministerio, y arriba de la banqueta una crema para las manos y un atado de cigarrillos. En el ropero, que tenía una puerta abierta, la mitad de la izquierda con la ropa de Martín, las camisas de trabajo, el buzo gris, las dos camperas; la mitad de la derecha con ropa de mujer. No mucha. Tres o cuatro perchas, un par de zapatillas en el piso, una campera de jean. Lo que uno trae cuando viene a vivir con alguien y todavía no decidió si se queda. O lo que uno deja cuando decidió irse y no se llevó todo. Las dos cosas se ven igual desde una puerta.</p>\n<p>En el estante de arriba del ropero, donde de chicos guardábamos los juegos de mesa, estaban las libretas. Once, paradas como libros, con el lomo marcado con fibra blanca: los meses que cubre cada una, dos o tres, y desde la segunda el año, doce años seguidos. La psicóloga de la clínica se lo había recomendado y Martín, que no hacía nada de lo que le recomendaban, había hecho eso. Yo nunca las había leído. Nunca las había abierto. Había pasado doce años sabiendo que estaban ahí y no abriéndolas, y lo había considerado un mérito mío, una forma de respeto, que es como una se cuenta las cosas que no se anima a hacer.</p>\n<p>Entré. Fui derecho a la mesa de luz y agarré la libreta de tapa negra, la de la birome en el elástico, y la abrí por el final.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>No la leí. No todavía. Lo que hice primero fue lo que hago siempre, que es mirar el papel antes que las palabras. La tinta era azul, de birome, de las comunes. La letra de Martín, que conozco mejor que la mía porque yo se la enseñé, es chica, redonda, inclinada hacia la izquierda, con las eles que suben mucho y las ges que bajan poco. Y tiene lo que tienen todos los zurdos que escriben de corrido: el arrastre. La mano del zurdo va por delante de lo que escribe y pasa por encima de la tinta fresca, y la tinta se corre un poco hacia la derecha, se ensucia en el borde, y el trazo que viene de la izquierda, el de bajada de la ele o el de la te, queda más cargado que el de ida. A un perito que no se fija en eso le pueden vender un dictado como una carta. A mí no. Martín es zurdo desde que agarró la primera cuchara y mi madre le cambió la cuchara de mano dos veces y a la tercera se rindió.</p>\n<p>La última página escrita tenía una fecha arriba, con la abreviatura que usa él: mié 10/9. Un párrafo corto. Después, nada: la hoja siguiente estaba en blanco.</p>\n<p>Pero entre la hoja de «mié 10/9» y la hoja en blanco faltaban hojas. Lo vi antes de contarlas, por el grosor, por cómo el elástico cerraba un poco más flojo de lo que debería. Las conté: cuatro. Cuatro hojas arrancadas, y no arrancadas como se arranca cuando uno está enojado, con el borde rasgado y el pedazo que queda pegado al lomo. Estas estaban cortadas al ras, con una trincheta o una hoja de afeitar, pegado a la costura, con cuidado. Pasé el dedo por el borde. Prolijo. Alguien había sacado esas hojas de modo que no se notara, y lo había hecho tan bien que solo se notaba si uno sabía mirar.</p>\n<p>Abajo se abrió la canilla. El agua del tanque cayendo en la pileta de la cocina, el ruido de la casa. Cerré la libreta, la puse donde estaba, con la birome en el elástico en la misma posición, y bajé. En el tercer escalón y en el séptimo, el crujido.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Elías vino a las cuatro. Lo oí antes de verlo, el golpe de los remos en el agua, parejo, lento, el mismo compás que tenía cuando yo era chica y él remaba hasta nuestra casa con la damajuana de agua los veranos en que la bomba se rompía. La chata de Elías es verde como la nuestra, que la pintó él, y el Negro iba parado en la proa, y cuando vio el muelle se tiró al agua y subió la escalera chorreando.</p>\n<p>Elías amarró, subió despacio, se sacó la gorra. Tiene setenta y un años y las manos de mimbrero, grandes, con los nudillos abiertos. Me abrazó. Olía a leña y a río.</p>\n<p>—Verónica.</p>\n<p>—Elías.</p>\n<p>Miró a Ana, que había salido a la galería, y le hizo un gesto con la cabeza que era un saludo y no era más que un saludo, y Ana le devolvió el mismo gesto. Se conocían. Claro que se conocían: ella vivía ahí desde hacía cuatro meses. Yo era la única en ese muelle a la que todo le resultaba nuevo.</p>\n<p>—¿Sabés algo?</p>\n<p>—Lo que sé es poco. —Elías no se sienta en una galería ajena si no lo invitan; lo invité y se sentó en el banco de madera, con la gorra en la rodilla—. Lo vi salir el miércoles a las seis. Yo estaba en el muelle, levantando las nasas, que con el río así no sirven. Pasó para arriba en la «Marta», con el motor bajo, despacito, como va él. Me levantó la mano. La maestra lo despidió en el muelle.</p>\n<p>Lo dijo en el mismo tono con que dijo todo lo demás. Miré a Ana. Ana no me miró a mí, miró a Elías, y dijo:</p>\n<p>—Me levanté a despedirlo. Después me volví a acostar hasta la colectiva.</p>\n<p>—Me dijiste que dormías.</p>\n<p>—Dije que salió antes de que me levantara. —Se cruzó de brazos; el pulóver le tapaba las manos—. Me levanté, lo despedí, me volví a dormir. ¿Importa?</p>\n<p>Importaba. No sabía por qué, pero en mi trabajo una enmienda, por chica que sea, es el lugar donde hay que poner la lupa. No dije nada. Elías tampoco. Siguió:</p>\n<p>—No volvió. Yo estuve en el muelle hasta la noche, con el agua que subía, atando las cosas. No lo vi pasar de vuelta. Ayer tampoco. —Miró el arroyo—. El río está alto desde el martes. Si tuvo un problema con el motor en el Sarmiento o en el Luján, lo habrán remolcado a Tigre. Hay que preguntar en Tigre.</p>\n<p>—Llamé a Prefectura —dijo Ana—. Me dijeron que llame el viernes.</p>\n<p>—Prefectura. —Elías se puso la gorra—. Yo tengo la radio. Mañana a la mañana, si aflojó, llamo yo, que a mí me conocen. Hoy no van a salir. Hoy no sale nadie.</p>\n<p>Se paró. Miró el cielo hacia el sudeste, donde el gris se había puesto más bajo y más oscuro, y después miró el agua, que ya lamía el segundo escalón del muelle y traía camalote en placas grandes, con flores lilas, dando vueltas despacio.</p>\n<p>—Viene sudestada, Verónica —dijo—. Grande. Si te vas, andate hoy. El Chino no entra mañana. Nadie entra mañana.</p>\n<p>—¿Cuánto va a subir?</p>\n<p>Se encogió de hombros.</p>\n<p>—La del dos mil veintitrés entró en la casa de los Riquelme. Esta viene parecida. Subí las cosas de abajo. Tenés el grupo electrógeno en el galpón, fijate si tiene nafta. Y el agua del tanque, que después se ensucia. —Me puso una mano en el hombro, pesada—. Y quedate arriba. No andes en la chata. Con el río así no se anda en chata.</p>\n<p>Bajó al muelle, desamarró, se sentó en la chata y el Negro saltó a la proa. Antes de irse levantó la vista hacia la galería. Me miró a mí, y después a Ana, y después a mí otra vez, y hubo en esa mirada algo que no supe leer, una pregunta o una advertencia, y se fue arroyo abajo con el compás de siempre, un remo y el otro, hasta que el sauce de la curva lo tapó.</p>\n<p>Me quedé en la galería. Ana se quedó en la puerta. Pensé en la lancha de las cinco, que no iba a venir, y en mi auto en el estacionamiento de la estación fluvial, y en Sandra con mis citas corridas, y en el pagaré del hombre con parkinson, y en la bolsa en el piso de la cocina con las treinta pastillas contadas, y en las cuatro hojas cortadas al ras. Pensé que podía caminar hasta lo de Elías y pedirle que me cruzara a la ruta de la otra isla, de donde salía un colectivo. Elías no me iba a cruzar con el río así. Y yo no me iba a ir.</p>\n<p>—Me quedo —dije.</p>\n<p>—Ya sé —dijo Ana.</p>\n<p>El viento cambió a las seis. Se notó en la galería como se nota una persona que entra en una habitación: el aire dejó de venir del norte, tibio y con olor a tierra, y empezó a venir del sudeste, frío, con olor a nada, a agua abierta, a río grande. Los sauces de enfrente se dieron vuelta y mostraron el reverso plateado de las hojas. El arroyo, que corría para abajo, se quedó quieto. Y después, despacio, tan despacio que había que mirar un punto fijo del muelle para notarlo, empezó a correr para arriba.</p>","palabras":2374},{"n":3,"titulo":"Lo que dice ella","cuando":"Jueves 9 de octubre, 21.00","html":"<p>Ana hizo una tortilla de papas. La hizo sin preguntarme si tenía hambre, con las papas cortadas finas y la cebolla que Martín cultiva en el cantero de atrás, y la dio vuelta con un plato de una sola vez, limpia, y yo puse la mesa. Puse los platos donde van: el de mi abuela en la cabecera, el mío a la derecha, el de Martín a la izquierda. Me di cuenta cuando ya estaban puestos, tres platos para dos personas, y saqué el de la cabecera y lo dejé en la mesada, y Ana lo vio y no dijo nada.</p>\n<p>Comimos con la radio prendida. La radio de pilas de la cocina, la que Martín escucha mientras trabaja, en la AM, donde a esa hora un locutor que parecía tener sueño leía el pronóstico del Servicio Meteorológico y después el aviso de la Prefectura para el Río de la Plata: viento del sudeste rotando al este, de cuarenta a cincuenta kilómetros por hora con ráfagas, altura del río en el puerto de Buenos Aires de dos metros cincuenta y en ascenso, se recomienda a los habitantes de las zonas ribereñas, dijo, y Ana bajó el volumen.</p>\n<p>—Ya sé lo que recomienda —dijo.</p>\n<p>—¿Ya pasaste una?</p>\n<p>—Una. En junio, chiquita. Entró en el muelle y nada más. —Comió—. Martín dijo que las grandes son otra cosa.</p>\n<p>Las grandes son otra cosa. Yo pasé dos de chica y una a los veinte, con mi madre ya enferma, y me acuerdo del ruido más que del agua: la casa que suena distinto cuando el agua está abajo, los pilotes que crujen, el golpe de las cosas que flotan contra las tablas. Me acuerdo de mi madre con las botas de goma subiendo la heladera entre ella y Elías por la escalera, y de Martín, que tenía diez, llorando no por el agua sino porque la heladera se iba a caer. No se cayó.</p>\n<p>—¿Cómo lo conociste?</p>\n<p>Lo pregunté como se pregunta en un juzgado, sin mirar, pasando la miga de pan por el plato. Ana lo notó. Me di cuenta de que lo notó porque dejó el tenedor y me contestó mirándome, para que le viera la cara mientras hablaba, que es lo que hace la gente que no tiene nada que esconder o la que sabe cómo parece que no tiene nada que esconder.</p>\n<p>—En la colectiva. Tres años viéndolo subir y bajar. Él iba a Tigre los martes por los materiales y yo iba todos los días, así que los martes lo tenía enfrente. Un hombre que no habla. —Sonrió un poco, para adentro—. En junio se vino abajo el muelle de la escuela. Una tabla podrida, se cayó un chico, nada grave, un susto. La cooperadora no tenía plata. Yo le pregunté en la colectiva cuánto cobraba por arreglar un muelle. Me dijo que depende. Vino el sábado con la lancha llena de tablas y lo hizo en un día. No lo cobró. Dijo que se lo pagara con mate. —Levantó un hombro—. Se lo pagué con mate.</p>\n<p>—¿Y te viniste a vivir acá?</p>\n<p>—En junio.</p>\n<p>—¿Vos tenías dónde vivir?</p>\n<p>—Tengo. La pieza de la escuela, que es de las maestras que se quedan en la semana. Y mi mamá en Zárate, que es donde voy cuando… —Se cortó—. Los primeros fines de semana de cada mes voy a Zárate. Sábado a la mañana me voy, domingo a la tarde vuelvo.</p>\n<p>—Los primeros sábados.</p>\n<p>—Sí.</p>\n<p>—Yo vengo los primeros sábados.</p>\n<p>—Ya sé —dijo Ana—. Martín lo pidió así.</p>\n<p>Se hizo un silencio en el que la radio, con el volumen bajo, siguió diciendo números. Me pareció que Ana iba a agregar algo y lo pensó mejor, y lo que agregó fue otra cosa:</p>\n<p>—Me sacaba de la casa el primer sábado como quien esconde un perro. Me lo dijo una vez así: no te enojes, es que a Vero hay que decírselo bien, y yo todavía no sé cómo. Me enojé igual.</p>\n<p>—¿Y por qué había que decírmelo bien?</p>\n<p>Ana me miró un rato largo, con una expresión que no era de hostilidad ni de lástima sino de cálculo, como quien decide cuánto va a pagar por algo.</p>\n<p>—Eso preguntáselo a él —dijo.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Lavó ella. Sequé yo. Afuera el viento había agarrado el ritmo que iba a tener toda la noche, un empuje largo y parejo con ráfagas cada tanto que hacían vibrar los vidrios de la galería, y entre ráfaga y ráfaga se oía el agua, que ya no sonaba a arroyo sino a algo más ancho, sin orillas.</p>\n<p>—¿Te contó de la clínica?</p>\n<p>Lo dije mientras secaba la sartén. Ana se quedó con las manos en el agua.</p>\n<p>—Me contó lo que quiso contarme.</p>\n<p>—¿Y qué quiso?</p>\n<p>—Que a los veintiséis se quiso morir y vos lo encontraste. Que estuvo cuatro meses internado. Que no toma desde entonces. —Enjuagó una taza—. Y que la casa es de los dos.</p>\n<p>—¿Las pastillas las toma?</p>\n<p>—¿Cuáles?</p>\n<p>—Las de dormir. Las que le traigo.</p>\n<p>Cerró la canilla. Se secó las manos en el pulóver, que para ella era un gesto de puntuación.</p>\n<p>—Preguntale a él —dijo otra vez, y fue la segunda vez en una hora, y las dos veces el «él» estaba en presente.</p>\n<p>Me preguntó, después, a qué me dedicaba. Yo creo que me lo preguntó para cambiar de tema y yo contesté con más ganas de las que tenía, porque es un tema en el que sé lo que digo. Le expliqué qué hace una perita calígrafa: que miro una firma y digo si es de quien dice ser, que miro una letra y digo si la escribió la misma mano que escribió otra, que los jueces me mandan los expedientes y yo contesto, que los bancos me mandan los cheques y yo contesto, que la gente se piensa que una firma es un dibujo y es un gesto, un movimiento aprendido que la mano hace sola, y que el que imita un dibujo no imita un gesto, y que por eso se les ve. Le hablé de la presión, del ritmo, de los ataques y los remates, de la lupa que llevo en la cartera. Me oí hablar y no paré.</p>\n<p>—¿Y a la gente? —dijo Ana cuando paré—. ¿También les ves si son de quien dicen ser?</p>\n<p>—A la gente también.</p>\n<p>—Qué cómodo —dijo.</p>\n<p>Después, mientras guardaba los platos, preguntó lo otro, lo que preguntan todas, y lo preguntó sin curiosidad, como quien devuelve una pelota:</p>\n<p>—¿Y vos? ¿Tenés a alguien?</p>\n<p>—Tuve. Hernán. Nos separamos hace seis años.</p>\n<p>—¿Hijos?</p>\n<p>—No quise. —Me salió la frase de siempre, la que digo en las cenas, con la media sonrisa que la acompaña—: Ya tenía a Martín.</p>\n<p>Ana cerró la alacena. Se dio vuelta y me miró con la cara seria, sin ninguna sonrisa que devolverme.</p>\n<p>—No es un chiste —dijo.</p>\n<p>—Es un chiste.</p>\n<p>—Vos lo decís como un chiste. —Agarró el repasador y lo colgó del clavo—. Él no lo oye como un chiste.</p>\n<p>Me quedé con la sartén en la mano. Hay frases que una dice durante veinte años y que de pronto alguien levanta del piso y le muestra a una por el otro lado, como una foto, y una ve que del otro lado había otra cosa escrita. No contesté. Puse la sartén en su lugar.</p>\n<p>Se fue a la galería con el atado de cigarrillos y la vi, a través del vidrio, parada en el borde, de espaldas al viento, con el teléfono levantado en la mano hacia el cielo, buscando una raya de señal que no venía. Lo bajó. Lo miró. Se lo guardó en el bolsillo del pantalón, apagado, con el gesto de quien guarda algo que no quiere que le pregunten.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Dormí en la pieza de mi madre, en la cama de una plaza con el colchón que se hunde en el medio. No dormí. Me quedé con la luz de la lámpara de pinza y la libreta que había bajado del estante del ropero de Martín, la que tenía en el lomo, con fibra blanca, «jun-jul».</p>\n<p>Las abrí por cualquier lado, como se abre un libro ajeno, y después por el principio, como se abre un expediente.</p>\n<p>Hay algo que tengo que decir sobre esto y lo voy a decir una sola vez. No me sentí bien. Doce años sin abrirlas y las abrí la primera noche que mi hermano no estaba, y me dije que era por él, para encontrarlo, y era cierto, y también era cierto que había querido abrirlas siempre. Las dos cosas. Una se acostumbra a vivir con las dos cosas.</p>\n<p>La letra de Martín, chica y redonda, con el arrastre en cada bajada. Entradas cortas, de tres o cuatro renglones, muchas veces sin verbo. Fechadas con su abreviatura, el día en tres letras y la fecha con barra.</p>\n<p><em>lun 2/6. A. se quedó. Trajo tres perchas y un libro de la escuela y dijo: no te asustes. No me asusté.</em></p>\n<p><em>jue 5/6. El muelle de la escuela. Las tablas de quebracho que me sobraron del de los Riquelme. A. me miró lijar toda la tarde sin decir nada. Hay gente que sabe mirar.</em></p>\n<p><em>sáb 7/6. Ella trajo la bolsa. Hablamos del motor. No le dije.</em></p>\n<p>Me detuve ahí. El siete de junio era sábado; el primer sábado. Yo había estado en esa casa el siete de junio, de las diez a las cinco, y había hablado del motor, me acuerdo, el motor que ya entonces fallaba, y Ana no había estado, Ana estaba en Zárate. Entonces Ana había vuelto esa noche, pensé. Había vuelto antes, de Zárate, con una bolsa de algo, con naranjas, con ropa, y él no le había dicho. No le había dicho qué. Que yo había estado, supuse. Que yo existía de esa manera, una vez por mes, con la bolsa. Que no sabía cómo decírmelo a mí ni cómo decírselo a ella. Leí la entrada tres veces y las tres veces el «ella» me pareció otra cosa que la «A.» de arriba: más seco, más lejos, un pronombre para alguien a quien no se le pone inicial.</p>\n<p>Seguí.</p>\n<p><em>mar 17/6. A. pregunta cosas. Qué hacía mi mamá, qué hacía mi papá, por qué me fui a vivir a la isla. Contesto. Hace años que nadie me pregunta y me doy cuenta de que tenía las respuestas preparadas.</em></p>\n<p><em>dom 29/6. El motor otra vez. El Turco dice que es el arranque. Tengo para el repuesto si no pago la luz. A. dice que ella paga la luz. No.</em></p>\n<p><em>sáb 5/7. Ella no va a dejarme ir. No lo dice así. Dice: ¿y la casa? Dice: ¿y vos? Dice: ¿y el motor, lo arreglaste? Como si el motor fuera una manera de quedarse.</em></p>\n<p>Dejé la libreta sobre la frazada. El viento dio una ráfaga que hizo sonar la ventana en el marco y el crujido de los pilotes vino de abajo, largo, de madera que trabaja. Ella no va a dejarme ir. Ir adónde. Y «ella» otra vez sin inicial, otra vez un sábado, el primer sábado de julio, y yo había estado ese sábado también, y me acuerdo que le pregunté por la casa, por la pintura de la galería, y por el motor. Pensé: Ana vuelve los sábados a la noche. Vuelve y le pregunta por la casa, por él, por el motor. Pensé: le pregunta como quien no lo deja ir, y él escribe eso.</p>\n<p><em>mar 15/7. A. dice que lo diga. Que no es tan difícil. A. no conoce a la gente difícil.</em></p>\n<p><em>mié 23/7. Hice la cuenta en un papel. Lo que vale el lote. Lo que vale el taller. Lo que debo. Lo que sobra. Lo rompí.</em></p>\n<p><em>jue 31/7. Doce años sin tomar. A. preguntó cómo se festeja. Le dije que no festejando.</em></p>\n<p>Apagué la luz y me quedé con la libreta en el pecho y los ojos abiertos. La casa sonaba. Oí a Ana levantarse, en la pieza del fondo, oí la puerta, el tercer escalón, el séptimo, la puerta de la galería que se abría contra el viento y se cerraba, y después nada, o el viento, que era lo mismo que nada. Supuse que fumaba. Supuse que miraba el agua, que a esa hora, si uno se asomaba, tenía que estar ya sobre el último escalón del muelle, negra, lisa, yendo para arriba.</p>\n<p>Yo había venido a buscar a mi hermano y había encontrado a una mujer que sabía dónde estaba la yerba, que sacaba la pava antes del hervor, que decía «preguntale a él» en presente, que hacía preguntas que él anotaba con miedo. Martín le tenía miedo. Lo escribió. Ella no va a dejarme ir. Me dormí con eso, si es que me dormí, y en lo que fuera que dormí el arroyo corría al revés.</p>","palabras":2137},{"n":4,"titulo":"El agua sube por la escalera","cuando":"Viernes 10 de octubre, 6.10","html":"<p>Amaneció gris, sin amanecer. La luz vino de todos lados a la vez, como viene cuando el cielo es una sola nube baja, y con la luz vi el agua.</p>\n<p>El muelle no estaba. Estaba, en algún lado abajo, pero lo que se veía desde la galería era una lámina marrón que llegaba hasta el pie de la escalera de la casa y seguía, sin corte, hasta la otra orilla, que ya no era una orilla sino una línea de sauces metidos en el agua hasta la mitad del tronco. El arroyo del Fraile tiene cuarenta metros de ancho. Esa mañana tenía cien, y no corría: se movía, todo junto, para arriba, con una lentitud de cosa pesada, llevando ramas y camalote y una tabla con un clavo y una pelota de plástico roja que giraba sobre sí misma sin avanzar. El viento venía del sudeste con el frío de las seis y olía a río grande.</p>\n<p>Me había puesto las botas de goma de Martín, que me quedan dos números grandes, y la campera de él, la verde, porque la mía no era para eso. Bajé la escalera hasta el escalón anterior al agua y me quedé parada ahí, en el cuarto, mirando.</p>\n<p>Entonces lo vi.</p>\n<p>Del otro lado, donde el recreo abandonado, entre los sauces que entraban en el agua, había una chata. Verde, como la nuestra, como la de Elías, como todas las chatas de ese arroyo que pintó el mismo hombre con la misma pintura. Un hombre remaba. Remaba despacio, pegado a los sauces, de modo que las ramas lo tapaban y lo destapaban, y remaba raro. Lo noté antes de saber qué era lo raro: la chata cabeceaba, se iba de un lado, él la corregía con un solo remo, se iba del otro. Remaba como al revés, con el cuerpo cruzado, como si tuviera los remos cambiados de mano. Tenía una gorra y una campera oscura y la cara en sombra. No le vi la cara. A sesenta metros, con esa luz, no le hubiera visto la cara a nadie.</p>\n<p>—¡Eh! —grité.</p>\n<p>El viento se llevó el grito para el otro lado. Pero él levantó la cabeza. Juro que levantó la cabeza, que la chata se quedó quieta un segundo con los dos remos en el aire, y que después se metió para atrás, entre los sauces, de culata, con dos paladas, y la cortina de ramas se cerró y no quedó nada, ni la estela, porque en esa agua quieta no quedaba la estela de nada.</p>\n<p>Me quedé un rato en el escalón con el agua a tres dedos de las botas, mirando el lugar por donde había desaparecido. Pensé en Elías, que rema derecho y parejo desde hace sesenta años. Pensé en el hijo de los Riquelme, que no vive ahí. Pensé en los que andan en las crecientes por las casas cerradas, que es una cosa que pasa y de la que en la isla nadie habla. Y pensé en Martín, un segundo, como se piensa en lo que una vino a buscar, y lo descarté, porque no era Martín, porque Martín no se hubiera ido.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Fui a lo de Elías por atrás. Hay un terraplén detrás de las casas, un lomo de tierra que levantaron los isleños hace cincuenta años con el barro del canal, y se puede caminar por ahí cuando la costa está bajo agua. Esa mañana el terraplén tenía diez centímetros de agua en las partes bajas y las partes altas eran barro, y el camino que de chica hacía en cinco minutos me llevó veinte, con las botas que se me salían y el viento que empujaba de costado. Pasé por detrás de la casa de los Cardozo, cerrada, y de la de la señora que vendía dulce de naranja, cerrada, y de dos lotes vacíos donde habían demolido y nunca habían vuelto a levantar. En uno había un cartel caído, de chapa, con el logo de una inmobiliaria.</p>\n<p>Me agaché a leerlo, no sé por qué, con el agua en los tobillos. «Acuña Hnos. Desarrollos. Lotes con salida al río.» Un teléfono de Tigre. El cartel tenía el óxido de dos inviernos y una huella de bota marcada en el barro encima, fresca, grande, de alguien que había pasado por ahí hacía poco y lo había pisado. De chica ese lote era de una señora que vendía dulce de naranja y que nos daba a Martín y a mí un frasco cada verano a cambio de que le cortáramos el pasto con la hoz, y Martín a los siete años, con la hoz más grande que él, cortaba el pasto como si le fuera la vida, y yo le decía que fuera más despacio, que se iba a cortar, y él iba más rápido. No se cortó nunca con la hoz. Se cortó con el formón, en el galpón de Elías, a los dieciséis.</p>\n<p>La casa de Elías es más baja que la nuestra, sobre pilotes de un metro cincuenta, y el agua le llegaba al segundo escalón. Al costado, el galpón de chapa donde guarda las herramientas y los mimbres de cuando trabajaba el mimbre. Tenía la puerta cerrada. El Negro estaba echado delante de la puerta del galpón, sobre un pallet que lo mantenía fuera del agua, y cuando me vio se paró y me ladró dos veces, serio, hasta que me reconoció y bajó la cola y se acercó a olerme las botas, que eran de Martín, y las olió un rato largo.</p>\n<p>—¡Elías!</p>\n<p>Salió con el mate en la mano. No se sorprendió de verme, o si se sorprendió no lo demostró.</p>\n<p>—Verónica. Subí, que te vas a mojar.</p>\n<p>La cocina de Elías tiene la cocina a leña, la mesa de pinotea, el retrato de Nilda y el equipo de VHF en un estante, con el micrófono colgado del gancho y la luz verde prendida. Lo miré y él vio que lo miraba.</p>\n<p>—Quiero que llames a Prefectura.</p>\n<p>—Ahora están con los avisos. —Cebó y me pasó el mate—. A las siete, siete y media, cuando terminan de pasar las alturas, se los puede llamar. Lo llamo yo, quedate tranquila.</p>\n<p>—Elías, mi hermano no está desde el miércoles.</p>\n<p>—Ya sé.</p>\n<p>—Hay un tipo en una chata enfrente de casa. Lo vi recién. Se metió entre los sauces del recreo.</p>\n<p>Elías tomó el mate que yo le devolví, lo cebó para él, y mientras lo tomaba miró por la ventana hacia el arroyo, como si desde ahí se pudiera ver el recreo, que no se puede.</p>\n<p>—Con la creciente anda gente —dijo—. Mirando casas. Siempre fue así.</p>\n<p>—Remaba raro.</p>\n<p>—¿Raro cómo?</p>\n<p>—Cruzado. Como al revés.</p>\n<p>Me miró. Fue una mirada de nada, de medio segundo, y después bajó los ojos al mate.</p>\n<p>—Los que andan mirando casas no saben remar —dijo—. Por eso se los conoce.</p>\n<p>Me quedé callada. Afuera el Negro ladró una vez, hacia el galpón, y se calló. Elías se levantó, fue hasta el estante, descolgó el micrófono y lo volvió a colgar.</p>\n<p>—Verónica —dijo, de espaldas—, el Martín es grande. Tiene treinta y ocho años. Vos lo tratás como si tuviera veintiséis.</p>\n<p>—Tenía veintiséis cuando lo encontré en el piso de la cocina.</p>\n<p>—Ya sé. Yo llamé la ambulancia desde esta radio. —Se dio vuelta—. Y las otras veces que no estuvo, siempre volvió. Cuando se fue a Entre Ríos aquel verano con los pescadores. Cuando se quedó en Tigre una semana con el Turco. Siempre volvió. Vos no te enteraste porque no llamaste esos días.</p>\n<p>—¿Qué otras veces?</p>\n<p>—Hay otras veces, Verónica. Uno tiene otras veces.</p>\n<p>No supe qué contestar. Elías sacó de abajo de la mesada un bidón de nafta de diez litros, lo levantó como si no pesara, y lo dejó al lado de la puerta.</p>\n<p>—Para el grupo. Fijate que el de Martín esté sin agua en el tanque, que se le mete cuando lo deja afuera. Hoy van a cortar la luz, si no la cortaron ya. Subí lo que puedas. Y no andes en la chata.</p>\n<p>Le dije que no iba a andar en la chata. Le dije que llamara a Prefectura a las siete y media y que después viniera a decirme qué le habían dicho. Me dijo que sí. Bajé con el bidón y el Negro me acompañó hasta el terraplén, y cuando me di vuelta en el lote de los Cardozo lo vi volver y echarse otra vez sobre el pallet, delante de la puerta del galpón, con la cabeza apoyada en las patas, mirando el agua.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Ana dormía. Había vuelto a acostarse después de salir a fumar y dormía boca abajo, con un brazo colgando de la cama, en la pieza del fondo, la de Martín, con la puerta entornada. Pasé por delante. Dejé el bidón en la galería y las botas al pie de la escalera y subí en medias, y el tercer escalón crujió y el séptimo crujió, y ella no se movió.</p>\n<p>No fui a mi pieza. Fui a la de Martín. Entré y abrí el cajón de la mesa de luz.</p>\n<p>Lo digo así, sin dar vueltas, porque así fue. Lo abrí. Adentro había una linterna, un paquete de pilas, un rollo de hilo de pescar, un pasaporte vencido, un encendedor, una caja de clonazepam con dos tiras enteras y una por la mitad, y una carpeta de plástico transparente con papeles. La saqué.</p>\n<p>Era la carpeta de la casa. La conocía: la había armado yo, hacía doce años, cuando Martín salió de la clínica y decidimos que viviera en la isla, y se la había dejado a él con copias de todo por si alguna vez hacía falta algo cuando yo no estuviera. La escritura de la abuela, con la sucesión de mi madre abrochada. El plano de mensura. Las boletas del impuesto inmobiliario. La fotocopia de mi documento. El poder para la obra social, con mi firma al pie, grande, con la V larga. Una fotocopia de mi firma certificada por escribano para el trámite del gas que nunca llegó. Todo lo que yo había dejado ahí, en orden, para que él pudiera, si yo no estaba, probar quién era y de quién era la casa.</p>\n<p>Estaba en orden. Pasé las hojas y estaba todo, en el orden en que lo había puesto yo. Pero la carpeta estaba al alcance de la mano, en el cajón de la mesa de luz, y no en el estante de arriba del ropero, donde la había dejado. Alguien la había bajado. Alguien había necesitado mirar esos papeles con la luz de la lámpara de pinza, de noche, en la cama.</p>\n<p>—¿Qué buscás?</p>\n<p>Ana estaba en la puerta. Despeinada, con el pulóver gris encima de la remera de dormir, descalza, con la cara hinchada de sueño y los ojos nada dormidos.</p>\n<p>—Papeles —dije. No cerré el cajón.</p>\n<p>—Esa es la mesa de luz de Martín.</p>\n<p>—Es mi casa.</p>\n<p>—Es la pieza de Martín.</p>\n<p>—Es mi hermano.</p>\n<p>—Es mi… —Se cortó. Apretó la boca. No terminó la frase y no la terminó, me pareció, no porque no supiera la palabra sino porque la palabra, dicha en voz alta delante de mí, en esa pieza, se le volvía ridícula o se le volvía enorme, y no quería ninguna de las dos cosas.</p>\n<p>Cerré el cajón. Puse la carpeta encima de la mesa de luz, donde ella la viera.</p>\n<p>—¿Para qué bajó esto?</p>\n<p>—No sé.</p>\n<p>—¿Vos la viste leer estos papeles?</p>\n<p>—Yo no lo vigilo, Verónica.</p>\n<p>Lo dijo con una calma que me hizo más daño que un grito. Pasó delante de mí, agarró de la banqueta el atado de cigarrillos, y se fue al baño y cerró la puerta, y oí el agua de la canilla, y después oí, por encima del agua de la canilla, el otro ruido, el de abajo, el de las cosas que empezaban a flotar.</p>\n<p>Bajé. La galería estaba seca todavía pero el agua había llegado al primer escalón de la escalera de la casa, al primero de los seis, y lamía el segundo. En la cocina el piso crujía como cruje cuando tiene agua debajo. Afuera el viento no había bajado. Y la pelota roja, la de plástico, seguía dando vueltas en el mismo lugar, delante de la casa, sin ir ni venir, como si alguien la tuviera atada.</p>","palabras":2057},{"n":5,"titulo":"Firmé yo","cuando":"Viernes 10 de octubre, 9.30","html":"<p>Subimos las cosas. Lo hicimos sin hablar, con una eficacia de gente que no se conoce y que por eso no se estorba: Ana sacaba de la alacena y yo cargaba, yo bajaba por más y ella acomodaba arriba, en el pasillo, contra la pared, en el orden en que iban llegando. La radio. Las pilas. La yerba, la mía y la de ellos. Las latas. El pan. La bolsa, que subí yo sin que ella la viera, con las pastillas adentro. Las sillas de la cocina, de a una. La frazada de la galería. La caja de herramientas chica. Los libros del estante de abajo, que eran míos, de cuando era chica, y que nadie había tocado en veinte años y que subí igual, de a tres, porque eran míos.</p>\n<p>La heladera no. La heladera la miramos las dos, paradas en la cocina con el agua ya en el tercer escalón de afuera y el piso de adentro que sudaba, y Ana dijo que entre las dos no, y yo dije que mi madre y Elías sí, y ella dijo que mi madre y Elías eran dos personas que sabían cómo, y la desenchufamos, la vaciamos y la dejamos ahí, sobre dos ladrillos, que era lo que se podía.</p>\n<p>Lo demás lo hice con la cabeza en otro lado. La cabeza se me iba, mientras cargaba, a esa misma mesa de la galería, a un verano.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Yo tenía once años y él cinco. Mi madre trabajaba en la ciudad en enero, en la obra social, y nos dejaba en la isla con la abuela Lidia, que a las dos de la tarde dormía la siesta con la radio prendida y nos dejaba a nosotros con la condición de que no fuéramos al muelle. No íbamos al muelle. Nos sentábamos en la mesa de la galería, esa mesa, la de madera con la tabla del medio hundida, y yo le enseñaba a escribir.</p>\n<p>Nadie me lo había pedido. Martín entraba a primer grado en marzo y yo había decidido que iba a entrar sabiendo, no sé por qué, quizás porque yo había entrado sin saber y me acordaba de la vergüenza. Le compré con mis ahorros un cuaderno de tapa dura y una caja de lápices, y todas las tardes, mientras la abuela dormía, le agarraba la mano con la mía y le hacía hacer las letras. Él escribía con la izquierda. Mi madre le había cambiado el lápiz de mano dos veces, en invierno, y a la tercera se había rendido, y yo, que escribo con la derecha, no sabía cómo se le enseña a un zurdo, así que me sentaba enfrente de él, con la mesa en el medio, y le hacía las letras al revés, de espejo, para que él las viera derechas. Me salían. Todavía me salen: puedo escribir en espejo más rápido que mucha gente al derecho, y en el trabajo, cuando un abogado quiere que le explique qué es un trazo de ataque, lo hago en espejo para que se calle.</p>\n<p>A fines de enero escribía su nombre. A principios de febrero, el apellido. Y entonces le enseñé a firmar.</p>\n<p>No era necesario. Un chico de cinco años no firma nada. Pero yo tenía mi firma desde los nueve, la había inventado copiando la de mi madre, con la V de Verónica grande y con una cola que bajaba por debajo del renglón y volvía, y me parecía lo más adulto que tenía. Le dije: firmá como yo. Le agarré la mano. Le hice la M de Martín como una V doble, y la cola, la V con la cola larga, como la mía, que bajaba y volvía, y después el Aldao de corrido, sin levantar el lápiz. Lo repetimos cien veces. Él se reía, le parecía un dibujo. Cuando la abuela se despertó él fue corriendo con el cuaderno y le dijo: mirá, tengo firma. Y la abuela miró el cuaderno y me miró a mí y dijo: le hiciste la tuya.</p>\n<p>Martín firma así todavía. Lo sé porque a los veinte, cuando tuvo que firmar la sucesión de mi madre, miré su firma en el escritorio del escribano y vi mi cola, mi V, mi gesto hecho por otra mano, con el arrastre del zurdo, y pensé que había algo mío en él que no se iba a ir nunca. Lo pensé con orgullo. Eso también lo digo una sola vez.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Mi madre se enfermó cuando yo tenía veintitrés. Un cáncer de los lentos, de los que dan dos años de trámites. Los hice yo. Las autorizaciones de la obra social, los turnos, las quimios, los papeles para la licencia en el trabajo, la sucesión de la abuela, que estaba sin hacer, y después la de ella. Tenía veinticinco cuando se murió, en el Hospital de Clínicas, un martes a las cuatro de la tarde, y Martín tenía diecinueve y estaba en la isla porque no soportaba el hospital, y me lo dijo así, «no lo soporto», como si fuera una alergia, y yo lo acepté porque alguien tenía que estar en el hospital y alguien tenía que no estar, y se ve que ya entonces habíamos repartido los papeles.</p>\n<p>Después de eso él se fue. No se fue de la isla; se fue de todo. Dejó la escuela técnica a dos materias de terminar. Trabajó con unos pescadores en Entre Ríos un verano. Trabajó en un astillero de San Fernando y lo echaron. Trabajó con Elías en el mimbre. Tomaba. Yo me enteraba de a pedazos, por Elías, por mi tía, y le mandaba plata y él no la usaba o la usaba en lo que no había que usarla, y yo le decía que viniera a vivir conmigo a Caballito, y él me decía que sí y no venía. Yo me recibí. Entré en Tribunales. Me casé con Hernán. Iba a la isla cuando podía, que era menos de lo que digo.</p>\n<p>El domingo que lo encontré era marzo. Hacía tres días que no contestaba y yo tomé la lancha de las nueve y media sin avisar. La puerta estaba abierta. Estaba en el piso de la cocina, de costado, con la cabeza contra la pata de la mesa, con una botella de ginebra vacía al lado y dos tiras de blíster vacías al lado de la botella, y respiraba. Respiraba mal, con un ronquido, pero respiraba. Lo di vuelta. Le metí los dedos en la boca. Le grité. Y después corrí a lo de Elías, por el terraplén, con un vestido y sandalias, trescientos metros, y Elías llamó a Prefectura desde la radio, y vino una lancha de Prefectura con un enfermero y lo llevaron al hospital de San Fernando y yo fui en la lancha con la mano en el pecho de mi hermano contando la respiración, y nadie me preguntó quién era yo, y nadie me lo preguntó después tampoco.</p>\n<p>Le lavaron el estómago. Al día siguiente, cuando pudo hablar, un psiquiatra de guardia lo vio y me llamó a un costado y me dijo que no lo podían dejar ir. Que era un intento. Que si yo tenía una clínica, mejor una clínica. Yo tenía la obra social. Conseguí una clínica en Villa Devoto, con un parque y una reja que no parecía una reja. Lo llevamos en una ambulancia. Y en la clínica, en una oficina con un ficus, una mujer con anteojos me puso delante un formulario de internación, de los que llevan la firma de un familiar directo, y me dio una lapicera.</p>\n<p>Firmé yo. No había nadie más que firmara. Mi madre estaba muerta y mi padre estaba en Córdoba desde que Martín tenía cuatro años y no se le ocurrió venir ni entonces ni después. Firmé con mi firma, la V con la cola, y la mujer con anteojos miró la firma y me miró y me dijo que había hecho lo correcto, y yo le dije que ya sabía.</p>\n<p>La psicóloga de la clínica se llamaba Irene. Tenía el pelo gris corto y una manera de mirar que me ponía incómoda porque era la mía: miraba las manos. El último domingo, antes del alta, me llamó a su consultorio y me dio una libreta de tapa negra, nueva, con el elástico puesto, y me dijo que se la diera a Martín, que le había propuesto que escribiera y que él había dicho que sí. Y después me dijo, con la libreta todavía en mi mano, una cosa que yo tomé como un elogio y que no lo era: «Y usted no las lea nunca, Verónica. Son de él. Va a tener ganas. No las lea». Yo le dije que por supuesto. Y durante doce años no las leí, y cada vez que las veía en el estante del ropero pensaba en Irene y me sentía bien conmigo, como se siente una cuando cumple una regla que le pusieron y que, se da cuenta después, estaba puesta para medir otra cosa.</p>\n<p>Cuatro meses. Fui todos los domingos. Al principio él no me hablaba, y después me hablaba de cosas que no importaban, de la comida, del parque, de un hombre de la habitación de al lado que silbaba tangos. Nunca hablamos del piso de la cocina. Cuando salió, en julio, con doce kilos menos y una libreta de tapa negra que le había dado la psicóloga, me dijo que quería vivir en la isla. Yo le dije que sí. Le dije que sí con condiciones, que dije en voz alta en la cocina de mi departamento, mientras él miraba el piso: nada de alcohol, las pastillas que le había dado el psiquiatra para dormir, que yo le traería porque yo tenía la obra social, y yo iba a ir una vez por mes, a ver. Le armé la carpeta con los papeles de la casa. Le dije que si alguna vez no contestaba tres días yo iba a tomar la lancha. Él dijo que sí a todo. Dijo que sí como dice que sí a todo.</p>\n<p>Lo salvé. Yo lo cuento así porque así fue: entré en una cocina y había un hombre en el piso y a la semana había un hombre en una cama que respiraba. Hice lo que había que hacer y firmé lo que había que firmar. Hay gente que no puede.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Hernán me dijo una cosa, años después, el día que decidimos separarnos. No fue una pelea. Estábamos en la cocina de Caballito, él con las manos en los bolsillos, yo con la lupa en la mano porque estaba trabajando cuando él entró a decirme que se iba, y entre las cosas que dijo, que fueron pocas y justas, dijo esta:</p>\n<p>—Vos no cuidás a tu hermano, Vero. Lo administrás.</p>\n<p>No le contesté. Me pareció una frase hecha para el momento, de las que uno dice cuando necesita que la culpa tenga nombre. Hernán nunca había tenido que cargar con nadie. Hernán tenía dos padres vivos en Martínez que le preguntaban qué quería de regalo para el cumpleaños.</p>\n<p>La recordé esa mañana, cargando sillas, y la aparté como la había apartado entonces, con el mismo gesto.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>A las once cortaron la luz. Se oyó: la heladera desenchufada no dijo nada, pero el ventilador del techo de la cocina, que había quedado prendido en uno, dio dos vueltas más y se paró, y la casa se quedó con el único ruido del agua. Ana fue al galpón por el grupo electrógeno y yo bajé con ella, con el agua hasta la mitad de la pantorrilla, por el pasillo de tablas, que flotaba. El grupo estaba sobre el banco de trabajo, alto, seco. Tenía el tanque vacío. Le pusimos la nafta de Elías. Ana tiró de la cuerda tres veces y arrancó a la cuarta con un rugido que sonó indecente en ese silencio, y lo apagó, para la noche.</p>\n<p>Cuando volvimos a la escalera el agua tapaba el cuarto escalón. Ana subió primero. Yo me quedé un momento en la galería, con los pies mojados dentro de las botas de mi hermano, mirando la mesa en la que le había enseñado a firmar, y vi que la tabla hundida del medio tenía ya el brillo del agua que la buscaba por debajo.</p>","palabras":2045},{"n":6,"titulo":"Pan como para tres","cuando":"Viernes 10 de octubre, 13.00","html":"<p>Comimos arriba, en el pasillo, sentadas en el piso con la espalda contra la pared y las sillas de la cocina apiladas al lado, como en una mudanza. Pan de ayer, queso, una lata de atún abierta con el abrelatas de la caja de herramientas chica. Ana había subido el calentador de camping y la garrafa chica y calentó agua para el mate en el piso del baño, porque era el único lugar con baldosa. Afuera no había cambiado nada, que era lo peor: el viento en el mismo tono, el agua en el mismo marrón, el cielo en el mismo gris. Una sudestada no tiene clímax. Tiene duración.</p>\n<p>—¿Qué era lo que había que decirme bien?</p>\n<p>Lo pregunté con la boca llena, a propósito, para que no pareciera lo que era. Ana masticó. Tragó. Tomó un mate entero antes de contestar, mirando la pared de enfrente, donde había un clavo del que colgaba, desde que yo era chica, un almanaque de una ferretería de Tigre que nadie cambiaba y que estaba en febrero de un año que nadie recordaba.</p>\n<p>—Martín quería irse —dijo.</p>\n<p>—¿Adónde?</p>\n<p>—A Entre Ríos. A Villa Paranacito. —Lo dijo con cuidado, como si el nombre tuviera bordes—. Es el Delta también, el otro, el de arriba. Hay un galpón sobre el río, de un hombre que se jubiló, con la bancada y el guinche y un muelle para sacar lanchas de hasta ocho metros. Vale la mitad de lo que vale un lote acá. Él quería poner un taller. Un taller suyo, con su nombre, no arreglar muelles ajenos por mate. —Me miró—. Me mostró las fotos en el teléfono cien veces. Las tiene. Debe tener cincuenta fotos del mismo galpón.</p>\n<p>Yo pensé: Martín no se va a ningún lado. Y lo dije, porque pensarlo y decirlo, en mi caso, son la misma cosa:</p>\n<p>—Martín no se va a ningún lado.</p>\n<p>—¿Eso lo decidís vos?</p>\n<p>—Lo decide él. Y él no se va. Hace doce años que vive acá. Tiene el taller acá. Tiene la casa. Tiene…</p>\n<p>—A vos.</p>\n<p>—Tiene una historia, Ana. Tiene un médico en Tigre y una obra social que es la mía y una receta que retiro yo, y un lugar donde conoce a todo el mundo y donde todo el mundo sabe que si no contesta en tres días hay que ir a verlo. En Villa Paranacito no lo conoce nadie. —Se me había subido la voz; la bajé—. Vos no lo conocés.</p>\n<p>—Hace cuatro meses que vivo con él.</p>\n<p>—Hace doce años que…</p>\n<p>—Que venís un sábado por mes con una bolsa.</p>\n<p>Lo dijo sin levantar la voz, sin énfasis, como quien lee una cifra. Yo me quedé con el pan en la mano.</p>\n<p>—¿Lo viste trabajar? —dijo Ana después, en otro tono, como si la pregunta anterior la hubiera cansado—. En el taller, digo. ¿Lo viste con un casco?</p>\n<p>—Lo vi.</p>\n<p>—Yo lo veo todos los días. —Se abrazó las rodillas—. Llego de la escuela a las cinco y él está en el galpón con la puerta abierta y la radio, con un bote dado vuelta sobre los caballetes, y le pasa la mano por una tabla antes de tocarla con la herramienta. Le pasa la mano. Como si le preguntara. Yo me quedo en la puerta y él no me ve, o me ve y no dice nada, y sigue, y a veces se queda un minuto entero con la mano apoyada en la madera sin hacer nada, pensando. —Me miró—. Ese hombre no está en ninguna de las cosas que vos decís. No está en la obra social ni en la receta ni en el médico de Tigre. Está ahí, con la mano en la tabla. Y en Paranacito hay un galpón donde cabe un casco de ocho metros y acá no.</p>\n<p>No le contesté. Mastiqué el pan. Pensé en Martín con la mano apoyada en una tabla, que es una imagen que yo también tenía, de otro ángulo, de más lejos, desde la mesa de la cocina los primeros sábados, y que nunca había mirado como la miraba ella. Pensé varias cosas para contestar, todas verdaderas, todas inútiles, y no contesté ninguna, y en cambio pregunté lo que no quería preguntar, que es lo que suelo hacer cuando pierdo una discusión:</p>\n<p>—¿Y con qué plata?</p>\n<p>Ana bajó los ojos. Fue un segundo. Fue el único segundo en toda la conversación en que no me sostuvo la mirada, y yo lo registré como registro una pausa de la lapicera en una firma, un lugar donde la mano dudó.</p>\n<p>—Eso preguntáselo a él —dijo.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>A las dos, por un rato, el viento bajó. No paró; bajó, como baja la voz de alguien que sigue hablando, y en ese bajón el teléfono de Ana, que estaba en el piso al lado de ella, apagado desde la noche, lo prendió para mirar la hora o para mirar si había algo, y una raya de señal apareció en la esquina, una sola, y el aparato empezó a vibrar contra las tablas: un mensaje, otro, otro, todo lo que había estado esperando en algún lado desde el jueves a la noche entraba ahora de golpe. Ana lo agarró. Lo leyó con la cara cerrada. Lo dio vuelta, boca abajo, contra el piso, y se quedó con la mano encima.</p>\n<p>—¿Es él?</p>\n<p>—No.</p>\n<p>—¿Quién?</p>\n<p>—Mi mamá. La directora. —Lo dejó, se limpió la mano en el pantalón—. Nadie.</p>\n<p>—Ana.</p>\n<p>—No es él, Verónica. Si fuera él te lo diría.</p>\n<p>Lo dijo mirándome, y yo le creí la mitad, la primera, y me guardé la segunda. La raya de señal se fue al minuto. El viento volvió.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Elías llegó a las tres. Lo oí remar desde lejos, el compás parejo, un remo y el otro, y salí a la galería, que ya no era una galería sino una balsa: el agua pasaba por debajo de las tablas y se asomaba entre las juntas, y la mesa tenía las patas en el agua. Venía con la chata cargada hasta el borde, con una bolsa de arpillera en la proa y el Negro atrás, parado, con las patas abiertas para no caerse. Amarró a la baranda de la galería, porque el muelle estaba a un metro bajo el agua, y me pasó la bolsa.</p>\n<p>—Para que no se te acabe.</p>\n<p>Adentro había pan de campo, dos panes grandes, redondos, de los que hace la señora Cardozo cuando está, con la corteza partida; había un queso entero, de los de horma chica; había velas, una caja de fósforos envuelta en una bolsita, un paquete de fideos y una lata de duraznos al natural.</p>\n<p>—Pan como para tres —dije.</p>\n<p>—Para que no se te acabe —repitió—. Y los duraznos, que a Martín le gustan.</p>\n<p>Lo dijo así, en presente, «le gustan», y lo dijo con una naturalidad de abuelo que después, mucho después, iba a recordar con exactitud. En ese momento me pareció solamente eso: un viejo que había conocido a mi hermano de chico y que compraba duraznos al natural para cuando viniera, y que esa semana no había venido.</p>\n<p>—¿Llamaste?</p>\n<p>—Llamé. —Se sacó la gorra, se pasó la mano por el pelo, se la puso—. Les di los datos. Nombre, edad, la lancha, el motor, el color. Dicen que en los hospitales de Tigre y San Fernando no hay nadie con ese nombre. Dicen que cuando afloje salen con la lancha a recorrer el Sarmiento y el Luján. Antes no.</p>\n<p>—¿Cuándo afloja?</p>\n<p>—El río no me dice. —Miró el cielo, que era el mismo—. Mañana, pasado. Las grandes duran dos días, tres.</p>\n<p>Le ofrecí mate. Dijo que no, que tenía que volver, que el Negro no se quedaba quieto en la chata si él no remaba, y era cierto: el perro se había sentado y se había vuelto a parar y miraba arroyo abajo, hacia su casa, con una impaciencia que no le había visto nunca.</p>\n<p>—Elías. Si viene esta noche. Si lo ves.</p>\n<p>—Si lo veo te aviso.</p>\n<p>Me puso la mano en el hombro, la mano grande, y se bajó a la chata con una agilidad que no corresponde a un hombre de setenta y un años, y remó contra el viento, que ahora venía de frente para él, con el mismo compás de siempre pero más lento, un remo y el otro, hasta el sauce de la curva.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Después de que se fue subí y fui a la ventana del fondo del pasillo, la que da arroyo abajo. No sé por qué. Para verlo llegar, me dije. La ventana es chica y está alta, y de chica había que subirse a una silla para mirar por ella, y desde ahí, por encima del sauce de la curva, se ve a pedazos el muelle de Elías: una franja de agua, la punta de las tablas, la lona azul. En invierno, cuando el sauce está pelado, se ve entero. En octubre, con la hoja, se ve lo que las ramas dejan.</p>\n<p>Lo vi llegar. Lo vi amarrar la chata y al Negro saltar y correr por el pasillo de tablas hacia el galpón, y a Elías subir despacio la escalera de su casa. Y vi la lona. Estaba tirante sobre el muelle, atada con sogas a los postes, y el viento la hacía vibrar, y debajo de la lona había dos bultos. Uno era la lancha de Elías, que tiene el motor desarmado desde el invierno y que Elías tapa para que no se le llene de hojas. El otro era más largo. Más bajo en el agua. Apenas una curva distinta bajo la lona, al lado de la otra curva, como dos personas durmiendo bajo la misma frazada.</p>\n<p>Pensé que Elías le estaba guardando la lancha a alguien. A los Cardozo, a los Riquelme, a cualquiera de los que cierran la casa en invierno y dejan el bote al cuidado del vecino. Se hace. Siempre se hizo. Lo pensé, lo anoté en el lugar donde anoto las cosas que no tienen importancia, y me bajé de la silla.</p>\n<p>Ana estaba en la puerta de la pieza de Martín con el teléfono apagado en la mano, mirándome mirar por la ventana. No preguntó qué miraba. Yo no le dije. Nos quedamos un momento así, las dos en el pasillo angosto con las sillas apiladas entre las dos, y después ella entró en la pieza y cerró la puerta, y yo oí el elástico de la cama cuando se tiró, vestida, a dormir o a no dormir.</p>\n<p>Abajo el agua había tapado la mesada de la cocina. Lo supe por el ruido: el escurridor de alambre, con la taza de Martín, la del asa pegada, se había soltado de la pared y flotaba, y golpeaba contra la alacena cada vez que una ola chica entraba por la puerta de la galería, un golpe y una pausa, un golpe y una pausa, con la regularidad de alguien que llama.</p>","palabras":1822},{"n":7,"titulo":"Una mano que me conoce","cuando":"Viernes 10 de octubre, 16.00","html":"<p>Esperé a que Ana se durmiera. Lo supe por la respiración, que a través de la puerta de madera de la pieza del fondo se oía como se oye todo en esa casa, y por el silencio del teléfono, que había dejado de vibrar. Me puse las botas de Martín en el pasillo. Bajé la escalera hasta donde el agua me lo permitió, que fue el tercer escalón contando desde abajo, y desde ahí me metí.</p>\n<p>El agua estaba fría. No helada: fría de octubre, de río que viene del norte, pero fría, y me entró por arriba de las botas en el segundo paso y después ya no importó. Me llegaba a la mitad del muslo en la galería y más abajo en el pasillo de tablas que va al galpón, porque el pasillo está más alto, y caminé por ahí con una mano en la pared de la casa y la otra en el aire, con el viento de costado, hasta la puerta del taller.</p>\n<p>El taller de Martín tiene la puerta corrediza, de chapa, que él le puso para entrar los cascos. Estaba abierta un palmo, como la había dejado Ana cuando fuimos por el grupo. La corrí. Adentro el agua estaba quieta, oscura, con una capa de aserrín flotando que se abría cuando yo avanzaba y se cerraba atrás. La luz entraba por la claraboya, gris, suficiente. El banco de trabajo, alto, a la altura de la cintura de un hombre alto, estaba seco; el grupo electrógeno encima, los frascos de tornillos, las gubias en su tela enrollada, el cepillo, la escuadra, la lata de aceite de lino. Debajo del banco, el agua. En las paredes, colgados, los serruchos por tamaño, las plantillas de los cascos, una cuaderna de un bote que nunca terminó. Olía a aceite de lino, a madera mojada, a río.</p>\n<p>Lo que yo buscaba no sabía qué era. Buscaba, me dije, lo que uno busca cuando alguien no está: una agenda, un papel con un teléfono, un nombre. Buscaba lo que el oficial de justicia me había enseñado a no buscar en el primer minuto. Me quedé en la puerta el primer minuto. Después fui al banco.</p>\n<p>Martín guarda las cosas importantes en el cajón de las herramientas finas. Lo sé desde que tenía veinte años y guardaba ahí los cigarrillos para que mi madre no los viera. Es el cajón de abajo a la derecha del banco, el que tiene la manija de bronce, el que cierra con una traba de madera que hay que saber levantar. La levanté. El cajón salió con el ruido de la madera hinchada.</p>\n<p>Arriba, las herramientas finas: las gubias chicas, el compás de puntas, el calibre, el formón de media pulgada que fue de mi abuelo. Debajo de las herramientas, un trapo doblado. Debajo del trapo, una lata.</p>\n<p>Era una lata de galletitas, redonda, de las que se usan para guardar botones. La abrí. Adentro había dólares.</p>\n<p>Billetes de cien, usados, atados con una gomita en fajos de diez. Los conté como cuento las pastillas, sin pensar, con el dedo: ocho fajos. Ocho mil dólares en una lata de galletitas en el cajón de un hombre que el 29 de junio no tenía para el repuesto del motor si pagaba la luz.</p>\n<p>Debajo de los dólares, doblado en cuatro, un recibo. Y debajo del recibo, doblado en tres, con los bordes del papel marcados por el pliegue de haberse abierto y cerrado muchas veces, un documento de cuatro páginas.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Lo saqué del cajón y lo abrí sobre el banco, bajo la claraboya, y lo leí entero, de pie, con el agua hasta el muslo, antes de permitirme pensar nada. Es un hábito de oficio: primero se lee el documento completo, después se mira la firma. El que mira la firma primero ya no lee.</p>\n<p>Boleto de compraventa. Entre Verónica Beatriz Aldao, DNI tal, y Martín Raúl Aldao, DNI tal, en adelante «los vendedores», por una parte, y Acuña Hermanos S.A., representada por Federico Acuña, en adelante «la compradora», por la otra. El inmueble: el lote tal de la isla tal, sección primera del Delta del Paraná, partido de Tigre, con frente al arroyo del Fraile, con todo lo plantado, clavado y edificado, es decir, la casa de mi abuela. El precio: una cifra en dólares que era menos de lo que vale y más de lo que yo pensaba. La seña: veinte mil dólares, que la compradora entrega en este acto en efectivo y los vendedores reciben de conformidad, sirviendo el presente de suficiente recibo. La escritura traslativa de dominio se otorgará el día martes 14 de octubre a las 11 horas en la Escribanía Pereyra, Tigre, debiendo concurrir ambos vendedores. Para el caso de que los vendedores desistieran, deberán restituir la seña doblada. Lugar y fecha: Tigre, 12 de septiembre.</p>\n<p>Y al pie, tres firmas. La de Federico Acuña, con un sello de la sociedad. La de Martín Raúl Aldao, su V doble con la cola larga, su arrastre, su firma, la que yo le hice. Y en el medio, la mía.</p>\n<p>Verónica Beatriz Aldao. La V grande con la cola que baja por debajo del renglón y vuelve. El trazo de corrido. Mi firma.</p>\n<p>Yo no había firmado eso. No lo había visto nunca. No había estado en Tigre el 12 de septiembre, que era un viernes, porque los viernes a las once estoy en Tribunales, y no había vendido la casa de mi abuela, y no había recibido veinte mil dólares de conformidad, y no iba a ir a ninguna escribanía el martes.</p>\n<p>Puse el dedo sobre la firma. No para tocarla: para taparla, como se tapa algo que no se quiere ver un segundo más, un segundo nada más, y después lo saqué.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Saqué la lupa de la cartera. La llevo siempre, ya lo dije. La prendí. La luz blanca hizo un círculo sobre el papel y me incliné sobre mi propio nombre como me inclino sobre el nombre de cualquiera.</p>\n<p>Lo primero que se mira es si está calcada. Una firma calcada tiene el trazo lento, parejo, sin presión, porque la mano sigue una línea en lugar de hacer un gesto: se ve como se ve una letra dibujada, sin ataque, con las curvas redondeadas donde tendrían que ser angulosas, y a veces, con la luz rasante, se ve el surco del lápiz que fue por debajo. Esta no estaba calcada. Tenía ataque: la V arrancaba con un golpe, con un punto de presión al inicio donde la birome se apoya antes de salir, y tenía remate, la cola terminaba con la pluma ya en el aire, en un trazo que se afinaba hasta desaparecer. No era un dibujo. Era un gesto. Alguien había aprendido mi firma. La había hecho cien veces, mil, hasta que la mano la hizo sola.</p>\n<p>Lo segundo es la proporción. Mi V mide, en mi firma de siempre, poco más del doble de alto que el resto. La cola baja hasta un tercio de esa altura por debajo del renglón. Esta V medía lo que mide la mía. La cola bajaba lo que baja la mía. No lo medí con la regla; no hacía falta; conozco esa proporción como conozco mi cara en el espejo.</p>\n<p>Lo tercero es el ritmo, y ahí estaba la diferencia. Mi firma tiene una pausa: después de la V, antes del «erónica», levanto apenas la lapicera, un microsegundo, un hábito de cuando tenía nueve años y la hacía en dos partes. Esta firma no tenía la pausa. Iba de corrido, de la V al final, sin levantar. Más fluida que la mía. Más segura.</p>\n<p>Y lo cuarto, lo que vi al final, con la lupa inclinada para que la luz pegara de costado y mostrara el relieve de la tinta, fue el arrastre. En el remate de la cola, donde el trazo vuelve hacia la derecha y se afina, la tinta estaba corrida. Apenas. Un velo, una sombra hacia la derecha del trazo, donde algo había pasado por encima de la tinta fresca. La mano. El canto de una mano que va por delante de lo que escribe.</p>\n<p>El arrastre de un zurdo.</p>\n<p>Lo registré como se registra un hecho en un informe pericial: «se observa en el remate de la rúbrica un arrastre de tinta compatible con escritura de mano izquierda». Lo registré y lo dejé ahí, en su renglón, porque un hecho en un informe no es una conclusión, y porque en ese momento la conclusión ya la tenía, de antes, de la noche anterior, de la libreta, y era otra.</p>\n<p>Alguien que me conoce la mano. Alguien que tuvo mi firma delante, mi firma en el poder de la obra social, en la fotocopia certificada, en la carpeta que alguien había bajado del estante del ropero a la mesa de luz para mirarla con la lámpara de pinza, de noche, en la cama. Alguien que vive en esa casa desde junio, que sabe dónde está la yerba y dónde está la carpeta, que dijo «con qué plata, preguntáselo a él» y bajó los ojos. Alguien que quería irse a Villa Paranacito con un hombre que no tenía para el repuesto del motor, a comprar un galpón que vale la mitad de un lote del Fraile.</p>\n<p>Y Martín. Martín, que escribía «ella no va a dejarme ir». Martín, que el martes a la noche me llamó para decirme algo que no era por teléfono. Martín, que el miércoles a las seis salió en la lancha y una mujer lo despidió en el muelle, una mujer que primero dijo que dormía. Y que no volvió.</p>\n<p>No pensé la palabra. Hay palabras que una no piensa, que se quedan paradas en la puerta del pensamiento sin entrar, y una las ve ahí paradas y hace como que no. Pensé, en cambio, con una claridad de oficio: él lo descubrió. Vio su firma y vio la mía, al lado, y supo que no era mía, porque él sabe cómo firmo yo mejor que nadie, porque es la firma que le enseñé. Y la enfrentó. Y por eso no está.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Doblé el boleto en tres, por sus pliegues. Doblé el recibo. Puse los dólares en la lata y la lata bajo el trapo y las herramientas encima y cerré el cajón con la traba de madera. El boleto no lo dejé. Me abrí la campera de Martín, la verde, y lo metí en el forro, por el roto del bolsillo interno, donde se va a parar todo lo que se mete en esa campera, y me la cerré hasta arriba.</p>\n<p>Salí al pasillo de tablas. El agua me pareció más alta. La luz, que a las cuatro era gris, a las cinco era gris oscuro, y el viento había vuelto a subir, con ráfagas que traían agua de lluvia o de río, no se sabía. Caminé con la mano en la pared. En la galería la mesa de mi abuela se había movido: el agua la había levantado de las patas y la había corrido un metro, de costado, contra la baranda, y la tabla hundida del medio estaba ahora bajo un dedo de agua marrón.</p>\n<p>Subí la escalera. En el pasillo, la puerta del fondo seguía cerrada y adentro Ana seguía durmiendo, o seguía respirando como alguien que duerme. Me saqué las botas. Me senté en el piso del pasillo, en mi lugar, con la espalda contra la pared y el boleto contra el pecho, y me quedé mirando esa puerta como se mira una firma que una ya sabe que es falsa y de la que todavía hay que escribir por qué.</p>","palabras":1943},{"n":8,"tit
