ulo":"La planta baja","cuando":"Viernes 10 de octubre, 20.00","html":"<p>A las ocho bajamos por lo último. Ana dijo que había una foto, y yo supe cuál: la de mi abuela en el muelle, con el vestido de flores y la mano en la visera, en un marco de madera que mi madre había colgado al lado de la alacena. Había que ir a buscarla. Y había que atar la chata a la baranda de arriba, la de la escalera, porque la de la galería iba a quedar bajo agua antes de medianoche, y había que cerrar la llave de paso del tanque. Eran tres razones, y una sola hubiera bastado.</p>\n<p>El agua en la cocina me llegaba a la cintura. A Ana, que es más baja, un poco más arriba. Entramos con las linternas en alto, con la luz haciendo un círculo tembloroso en el techo y otro en el agua, y la cocina era otra cosa: las sillas que habíamos dejado flotaban dadas vuelta, con las patas para arriba, y se corrían despacio con cada ola que entraba por la puerta; la heladera estaba en su lugar, con el agua a mitad de la puerta, como un hombre parado en el río; una bolsa de pan de lactal, un repasador, una tapa de olla, y en todo eso el olor, el olor dulzón del río cuando entra en una casa, de barro y madera y gas, porque la garrafa grande había quedado abajo y perdía por la válvula un hilo que se oía.</p>\n<p>—La cerraste.</p>\n<p>—No. Cerrala vos, que sabés dónde está.</p>\n<p>Fui yo. Me agaché, con el agua al cuello, con la cara a un palmo del agua negra, y busqué la válvula a tientas detrás de la cocina y la cerré, y cuando me enderecé Ana estaba arriba de una silla que no flotaba porque la tenía pisada, descolgando la foto de la pared con las dos manos, con la linterna entre los dientes. Y la silla se fue. Se fue de abajo, despacio, como se van las cosas en el agua, y Ana se quedó un segundo en el aire con la foto en alto y la linterna en la boca, y se cayó de espaldas, entera, con un ruido de bolsa, y salió escupiendo agua y linterna y con la foto todavía en alto, seca, y se empezó a reír.</p>\n<p>Se reía con la boca abierta y el pelo en la cara, con el agua al pecho, riéndose de sí misma con una risa fuerte y tonta que rebotaba en el techo bajo de la cocina. Y yo me reí. Una vez. Una risa corta que me salió sola y que me sorprendió como un estornudo, y que ella oyó, y me miró, y por un momento fuimos dos mujeres mojadas hasta el cuello en una cocina inundada riéndose de una silla, y nada más que eso.</p>\n<p>Después subimos. Yo até la chata a la baranda de la escalera con dos vueltas y un as de guía, que me lo enseñó Elías a los diez años y la mano lo hace sola. Ana subió con la foto apretada contra el pecho.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Prendimos el grupo. Lo habíamos subido entre las dos al descanso de la escalera, sobre una tabla, con el caño de escape asomado a la ventana, y arrancó a la segunda y le enchufamos la lámpara de pie de mi pieza y el cargador del teléfono de Ana, y por una hora hubo luz eléctrica en el pasillo, una luz amarilla y temblona que hacía más oscuro todo lo que no alcanzaba. Ana se sentó en el piso con la espalda contra la puerta de la pieza de Martín, empapada, tiritando, y yo fui al baño y volví con la toalla celeste, la de las flores, la que había visto en la baranda el jueves.</p>\n<p>—Dame.</p>\n<p>Le sequé el pelo. No sé por qué lo hice ni por qué ella me dejó. Le pasé la toalla por la cabeza como se la pasaba a Martín cuando tenía seis años y salía del arroyo azul de frío, con fuerza, con las dos manos, y ella se dejó hacer con la cabeza gacha, y cuando terminé tenía el pelo parado en todas direcciones y la cara roja de la fricción y me miró de una manera que no supe leer. Le di la toalla. Se la puso en los hombros.</p>\n<p>—Mi papá tomaba —dijo.</p>\n<p>No lo dijo como una confesión. Lo dijo como quien pone una cosa sobre la mesa para que la otra sepa que está ahí.</p>\n<p>—En Zárate. Trabajaba en la papelera, turnos rotativos, y tomaba. No era de los que pegan. Era de los que se duermen en la silla con la tele prendida y hay que sacarles los zapatos. Mi mamá le sacaba los zapatos. Yo le sacaba los zapatos. —Se envolvió en la toalla—. Me fui a los diecisiete a lo de una tía en Campana para hacer el profesorado. No volví a vivir en esa casa. Vuelvo los primeros fines de semana porque mi mamá sigue ahí, sacándole los zapatos. Él tiene setenta años y todavía se duerme en la silla.</p>\n<p>—¿Martín sabe?</p>\n<p>—Martín sabe. —Me miró—. Por eso le creí lo de los doce años. Porque sé cómo huele un hombre que tomó y él no olía. Nunca. Ni un día.</p>\n<p>El grupo tosió. Siguió. Ana cerró los ojos un momento y los abrió.</p>\n<p>—¿Conocés a un tal Acuña? —dije.</p>\n<p>Hubo una pausa. Fue corta, del largo de un parpadeo, y en esa pausa Ana no me miró: miró el almanaque de la ferretería, el de febrero de ningún año, y después volvió.</p>\n<p>—¿Quién?</p>\n<p>—Federico Acuña. Acuña Hermanos. De Tigre.</p>\n<p>—No sé quién es.</p>\n<p>Lo dijo bien. Lo dijo con la voz justa y el tono justo, y lo que lo delató no fue la voz sino lo otro, el almanaque, el segundo en que la mirada se fue a buscar la respuesta a otro lado, que es lo que hace una mano cuando se detiene en una curva que no le sale. Yo no dije nada. Lo anoté. Y ella supo que lo había anotado, porque se levantó, se sacó la toalla de los hombros, la dobló, me la devolvió, y dijo que iba a cambiarse, y entró en la pieza de Martín y cerró la puerta.</p>\n<p>El grupo se paró a las nueve y veinte. Tosió dos veces y se apagó, y Ana salió y tiró de la cuerda diez veces y yo tiré cinco, y no arrancó más: la nafta de Elías, dijo ella, o agua en el carburador, o la bujía. Olía a nafta cruda. Lo dejamos. Encendimos las velas de Elías, dos, en dos platos, una en el pasillo y otra en mi pieza, y la casa se puso del color de las casas de antes de la luz.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Leí la libreta de agosto-septiembre a la luz de la vela, en la cama de mi madre, con la campera de Martín puesta y el boleto adentro del forro, contra el pecho, donde lo sentía con cada respiración como se siente un papel doblado.</p>\n<p><em>vie 1/8. A. de vacaciones de invierno. Vino con la lancha de las nueve y se quedó. Dos semanas seguidas. No sabía que se podía.</em></p>\n<p><em>sáb 2/8. Le mostré el galpón en el teléfono. Dijo: lindo. Dijo: para el verano. No entendió. O entendió.</em></p>\n<p>Ana me había dicho: me mostró las fotos cien veces. Y Martín escribía que se las había mostrado y que ella no había entendido, o había entendido, que es lo que uno escribe cuando el otro entendió y prefirió no entender. Para el verano. Como si el galpón de Paranacito fuera un lugar para ir en enero y no un lugar para irse.</p>\n<p><em>mar 12/8. A. preguntó por qué en la libreta es una letra. Le dije que es para que entre. Se rió.</em></p>\n<p><em>jue 21/8. El muelle de los Riquelme, terminado. Me pagaron la mitad. La otra mitad en octubre, dicen. Hice la cuenta otra vez. No da.</em></p>\n<p><em>sáb 6/9. Ella me dejó las pastillas contadas sobre la mesa. Treinta. Las miré toda la noche.</em></p>\n<p>Leí esa dos veces. Las pastillas. Ana, que decía «preguntale a él» cuando yo preguntaba si las tomaba, y que las dejaba sobre la mesa contadas. Contadas para qué. Para que supiera que las contaba. Para que supiera que alguien sabía cuántas había. Y él las había mirado toda la noche, treinta pastillas sobre la mesa de la cocina, un hombre que a los veintiséis había tomado dos tiras enteras con ginebra. Me subió algo por la garganta que no era un pensamiento. Tragué.</p>\n<p><em>dom 7/9. Ella no sabe lo que es que te cierren con llave. Yo sí.</em></p>\n<p>Pensé: no le contó. Le contó lo que quiso, dijo Ana, y lo que no le contó fue eso, la puerta de la clínica, la reja que no parecía una reja, los cuatro meses. Ella no sabe. Y él lo escribía para él, no para ella, con la rabia tranquila de quien sabe algo que el otro no puede saber. Me pareció, en ese momento, un reproche a Ana por su ignorancia. Me pareció que él estaba solo.</p>\n<p><em>mié 10/9. El 4 se lo digo.</em></p>\n<p>Y después nada. Después del 10 de septiembre venían las cuatro hojas cortadas al ras, el borde liso contra el lomo, y después la hoja en blanco, y la libreta terminaba. El 12 de septiembre, dos días después de «el 4 se lo digo», estaba fechado el boleto. Lo que siguió a eso, lo que escribió del 12 de septiembre al 10 de octubre, un mes entero, no estaba. Alguien lo había sacado. Con una trincheta. Con cuidado.</p>\n<p>El 4 se lo digo. El 4 de octubre era el sábado pasado, el primer sábado, el día que yo había estado en esa casa de diez a cinco hablando del motor y de la pintura de la galería. Y él no me había dicho nada. No me había dicho nada porque ella, pensé, Ana, que volvía de Zárate los sábados a la noche, le había hecho preguntas que lo dejaban sin dejarlo ir, le había contado pastillas sobre la mesa, le había bajado la carpeta con mi firma a la mesa de luz y había aprendido a hacerla de corrido, mejor que yo. Él se lo iba a decir a ella. Que no. Que no iba a firmar lo que ella ya había firmado por mí. Y el martes me llamó, y el miércoles salió en la lancha, y ella lo despidió en el muelle.</p>\n<p>Apagué la vela con los dedos. Me quedé en la oscuridad con el papel contra el pecho. Abajo, en la planta baja, algo golpeaba contra el techo de la cocina, que era el piso de mi pieza: una cosa que flotaba y que el agua levantaba hasta las vigas y soltaba, levantaba y soltaba, un golpe sordo cada tantos segundos, justo debajo de la cama, como si alguien, desde abajo, quisiera saber si yo estaba.</p>","palabras":1834},{"n":9,"titulo":"La chata","cuando":"Sábado 11 de octubre, 5.50","html":"<p>Lo vi desde la ventana de mi pieza, que da al frente. No había dormido o había dormido de a ratos, con la campera puesta, y a las seis menos diez la luz era un gris apenas más claro que la noche, y en ese gris, enfrente, mucho más cerca que el día anterior, estaba la chata.</p>\n<p>El arroyo había crecido hasta los sauces del recreo y los había pasado, y ahora lo que había enfrente de casa era agua hasta donde antes había tierra, y los sauces estaban en el medio de esa agua como árboles de un río nuevo. Entre los dos primeros, agarrado con una mano a una rama baja, con la chata atravesada a la corriente, estaba el hombre. A treinta metros. Con la gorra, con la campera oscura, con la cara vuelta hacia la casa. Hacia mi ventana. No se movía. La chata subía y bajaba con el agua y él se mantenía ahí, agarrado a la rama, mirando, como se mira una casa que uno conoce.</p>\n<p>Bajé las escaleras sin ponerme las botas. No me acuerdo de haber decidido nada: me acuerdo del tercer escalón y del séptimo, del frío del agua en los pies en el descanso, donde ya llegaba, y del nudo de la chata, el as de guía, que mis manos deshicieron en la oscuridad del hueco de la escalera. La chata estaba al lado de la baranda, flotando a la altura de lo que había sido el techo de la galería. Me subí de rodillas. Agarré los remos de debajo del banco, los calcé en las horquillas. Y salí.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Hay una cosa que no se puede explicar a quien no la vivió, y es cómo se mueve el agua de una sudestada. No es corriente. Es un cuerpo que respira. Va para arriba, despacio, todo junto, y cada tanto da un empujón, una ola larga que entra desde el río grande y pasa por debajo de todo, y después afloja y se queda, y después vuelve. Yo salí en el afloje. Remé de frente, hacia los sauces, con el viento de costado y el agua lisa, y en diez paladas estaba a la mitad. Él me vio. Soltó la rama. Y la chata, la suya, se fue hacia la derecha, arroyo abajo, pegada a los sauces, con ese remar cruzado, torpe y rápido, de alguien que rema mal y rema con todo.</p>\n<p>—¡Martín!</p>\n<p>No sé por qué grité ese nombre. Grité y el viento se lo llevó, y él no se dio vuelta, y yo remé.</p>\n<p>Remé como no remaba desde los veinte años, con la espalda, con todo, y la chata de Elías, la nuestra, que es pesada y noble, se abrió paso en el agua marrón. Lo seguí por entre los sauces, a diez metros de la línea de árboles, donde el agua era un poco más quieta, y lo veía, veinte metros adelante, la gorra, la campera, la espalda que se doblaba y se enderezaba, y lo veía desaparecer detrás de un sauce y aparecer detrás del otro. Pasamos el recreo, del que se veía el techo de chapa y la mitad del cartel. Pasamos el lote vacío de enfrente. Íbamos arroyo abajo, hacia la curva, hacia donde del otro lado está lo de Elías, y en algún momento, no sé cuándo, salimos de la sombra de los sauces y el viento nos agarró.</p>\n<p>Y entonces el río dio el empujón.</p>\n<p>Lo sentí llegar antes de verlo: la chata que se levantó de proa, el agua que de pronto no estaba quieta sino que iba, toda, hacia arriba, hacia atrás, hacia el lado contrario del que yo remaba, y el remo derecho que entró en el agua y no encontró nada, aire, agua blanda, y se me fue. Se me fue de la mano. Lo vi flotar un segundo al lado de la chata, a un metro, y estiré el brazo y la chata se atravesó y el remo se alejó dando vueltas, y en ese mismo momento algo golpeó el casco por debajo con un ruido de hueso. Un tronco. Un tronco entero de sauce, con las raíces, negro, que pasó rozando y siguió para arriba como si tuviera adónde ir.</p>\n<p>La chata giró. Con un solo remo no se puede hacer nada más que girar, y giré, y la corriente me llevó de vuelta, arroyo arriba, hacia la casa, pero no derecho: en diagonal, hacia el medio, hacia la parte ancha donde ya no había sauces ni nada a qué agarrarse. Vi la casa pasar, verde, con la ventana de mi pieza iluminada por la vela que había dejado prendida. Vi el techo de la galería bajo el agua. Me vi pasar de largo.</p>\n<p>Antes de eso, un segundo antes, cuando la chata giró y la casa me pasó por delante, vi la galería. La vi desde el agua, desde abajo, como la había visto toda la vida desde la lancha colectiva, con la diferencia de que ahora la galería estaba a la altura del río y la mesa de mi abuela flotaba contra la baranda con las patas para arriba, y pensé, con una nitidez que no correspondía al momento, que esa mesa tenía ochenta años y que iba a sobrevivir a eso también, como había sobrevivido a la del cincuenta y nueve, y que yo no estaba tan segura de lo mismo sobre mí.</p>\n<p>Y oí al perro.</p>\n<p>Lejos, arroyo abajo, en lo de Elías, detrás de la curva que ya no se veía porque yo iba para el otro lado, el Negro ladraba. No a mí. Conozco los ladridos de ese perro como conozco el compás de los remos de su dueño: tiene el ladrido de los que pasan, dos ladridos y se calla, y tiene el otro, el corto, repetido, el de perro que avisa, el que da parado delante de una puerta. Era ese. Ladraba y ladraba, hacia algo que estaba con él, en su casa, detrás de la curva, y no paraba.</p>\n<p>Me paré en la chata. No se hace. Me paré para ver, con el remo que me quedaba en una mano y la otra en el aire, y la chata se escoró y yo me fui.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>El agua estaba más fría de lo que había estado el día anterior en el taller, o yo estaba más cansada. Me cerró la garganta. Salí a la superficie con la campera de Martín pesando como una persona encima de mí y vi la chata a tres metros, dada vuelta, con el fondo verde al aire, yéndose, y nadé hacia ella con una brazada de alguien que aprendió a nadar en ese arroyo a los seis años y no había nadado en treinta, y la alcancé, y me agarré de la quilla, y me quedé ahí. Respirando. Con las piernas colgando en el agua marrón, pataleando para no irme, con el papel doblado en el forro de la campera contra el pecho, pensando, con una parte de la cabeza que seguía funcionando como un reloj, que la tinta de birome aguanta el agua y el papel no.</p>\n<p>Miré hacia los sauces. El hombre no estaba. En algún lugar entre el recreo y la curva se había metido entre los árboles y ya no estaba, o estaba y yo no lo veía, y el perro de Elías seguía ladrando, lejos, y el río me llevaba despacio hacia arriba, hacia el lado de la casa, con la chata dada vuelta como una tortuga.</p>\n<p>Pataleé. La chata era mi única cosa en el mundo y pataleé hacia la casa, de costado, con los brazos en la quilla y las piernas en el agua, y la casa se acercaba y se alejaba según el río respirara, y en un momento vi en la escalera, en el descanso, con el agua en las rodillas, a Ana.</p>\n<p>Tenía la soga. La soga larga del muelle, la de amarrar la «Marta», que había quedado atada a la baranda cuando el muelle se hundió, y la estaba desenrollando con las dos manos, y tenía puesta la toalla celeste en la cabeza como un pañuelo y la cara blanca. Gritó algo. Yo no lo oí. La soga voló, con la boya naranja en la punta, y cayó en el agua a dos metros de mí, y la corriente la empezó a llevar, y yo solté la chata.</p>\n<p>Solté la chata y nadé dos brazadas y agarré la boya. Y Ana tiró.</p>\n<p>Tiró con todo, con el cuerpo echado para atrás, con los pies trabados en los barrotes de la escalera, y yo venía, contra el río, con la soga quemándome las manos, y la chata se iba, dada vuelta, arroyo arriba, hacia donde fuera que fuera todo lo que se soltaba esa semana. Toqué la escalera. Ana me agarró de la campera, del cuello, de lo que había, y me subió dos escalones como se sube una bolsa, y yo me quedé a cuatro patas en el descanso, con el agua saliéndome de la boca y de la nariz y de la ropa, temblando como no había temblado nunca.</p>\n<p>Ana estaba sentada en el escalón de arriba. Respiraba como yo. Me miraba.</p>\n<p>—¿Qué querés? —dijo—. ¿Morirte vos también?</p>\n<p>Y se oyó decirlo. Se le vio en la cara que se había oído. Ese «también». Se le quedó en la boca como se le había quedado el «es mi…» en la pieza de Martín, con la diferencia de que esta vez la palabra había salido entera, y las dos la habíamos escuchado, y ya no había cómo volverla a meter.</p>\n<p>No le contesté. Me quedé a cuatro patas mirando el agua, que seguía subiendo por la escalera, un escalón más alto que cuando había bajado, y pensé en la chata, que era de Elías, que la había hecho con sus manos cuando yo tenía diez años, y que ahora iba dando vueltas por un río que no era un río, sola, con el fondo al aire, y pensé que el hombre de la gorra me había mirado, antes de soltar la rama, un segundo, a treinta metros, y que yo no le había visto la cara, y que había gritado el nombre de mi hermano.</p>","palabras":1704},{"n":10,"titulo":"El pan","cuando":"Sábado 11 de octubre, 9.00","html":"<p>Me cambié con lo que había, que era ropa de Martín: un jean que me até con un cordón, una camisa de trabajo, el buzo gris. La campera verde la colgué de un clavo del pasillo, chorreando, y antes de colgarla saqué del forro el boleto. Estaba mojado. Mojado pero entero, doblado en tres, con la tinta azul de las firmas que no se había corrido y la tinta negra de la impresora que sí, un poco, en los bordes. Lo abrí sobre el piso de mi pieza, con cuidado, como se abre un documento que estuvo en un sótano, y lo dejé secar con dos libros míos sosteniendo las puntas. Las firmas se veían. La mía se veía perfectamente.</p>\n<p>Ana había prendido el calentador en el baño. Había puesto la pava. Había traído el pan de Elías, uno de los dos redondos, y el queso, y una tabla, y había armado en el piso del pasillo, sobre un repasador, un desayuno. Me senté enfrente. Nos miramos. Teníamos las dos la cara de quien estuvo en el agua a las seis de la mañana, que es una cara que no se finge.</p>\n<p>Agarró el cuchillo. Puso el pan en la tabla, lo sostuvo con la izquierda, y lo cortó con la derecha, en rebanadas gruesas, con el gesto de serrucho de quien corta pan de campo desde chica. Con la derecha. Lo anoté donde anoto las cosas sin importancia, en el renglón de los hechos que no son conclusiones, y me dije que una firma se puede aprender con cualquier mano si uno la hace mil veces, que el arrastre lo puede dejar un diestro que apoya raro, que yo misma había visto diestros con arrastre en pericias de gente que escribía torcido, y lo cerré ahí. Me dio una rebanada. La comí.</p>\n<p>—Gracias —dije—. Por la soga.</p>\n<p>—Si no te sacaba se te iba la chata con vos adentro. —Cortó otra—. ¿Qué hacías?</p>\n<p>—Había un hombre. Enfrente, en los sauces. Ayer también. Lo seguí.</p>\n<p>—¿Y?</p>\n<p>—Se fue. Remaba mal. —Mastiqué—. El perro de Elías ladraba.</p>\n<p>Ana no dijo nada de eso. Comió. Tomó un mate. Y cuando lo devolvió a la pava yo me levanté, fui a mi pieza, saqué el boleto de entre los libros y volví, y lo puse sobre el repasador, entre el pan y el queso, abierto, con las firmas para arriba.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Ana lo miró. No lo agarró. Lo miró desde donde estaba, con el mate en la mano, y vi lo que pasó en su cara con la claridad con que se ve, en una firma, el lugar donde el trazo se detiene: los ojos que fueron al encabezado, que bajaron, que se detuvieron en las tres firmas del pie, y que se quedaron ahí, en la del medio, en la mía, y la sangre que se le fue de la cara como si alguien hubiera abierto una canilla.</p>\n<p>—¿Dónde estaba? —dijo.</p>\n<p>—En el taller. En el cajón de las herramientas finas. Debajo de una lata con ocho mil dólares.</p>\n<p>Cerró los ojos. Los abrió.</p>\n<p>—Martín te lo iba a decir.</p>\n<p>—¿Decirme qué?</p>\n<p>—Esto. —Señaló el papel con el mentón, sin tocarlo—. Te lo iba a decir. Te llamó para eso.</p>\n<p>—Me llamó para decirme que había un boleto de compraventa de mi casa con mi firma, que yo no firmé.</p>\n<p>—Sí.</p>\n<p>—Y que vos la habías hecho.</p>\n<p>Ana levantó la cabeza. Me miró con una cara que no le había visto, una cara sin nada, lisa, de alguien que acaba de oír algo que no entra en ningún lugar de lo que tenía preparado.</p>\n<p>—¿Qué?</p>\n<p>—La firma. Mi firma. La aprendiste de la carpeta, de la que estaba en la mesa de luz. La hiciste de corrido. Te salió bien. —Oí mi voz, pareja, la voz con que dicto los informes—. Mejor que la mía.</p>\n<p>—¿Vos pensás que yo…?</p>\n<p>—Pienso que mi hermano no está.</p>\n<p>Se quedó callada. Afuera el viento, que había bajado un poco a la madrugada, volvía a subir, y la lluvia, que hasta entonces había sido una cosa que iba y venía, empezó a caer de verdad, de costado, contra la ventana del fondo del pasillo. Ana puso el mate en el piso, despacio, con las dos manos, como quien deja algo que podría romperse.</p>\n<p>—No sabés nada de él —dijo.</p>\n<p>—Sé cómo firma.</p>\n<p>—Sí —dijo Ana—. Eso lo sabés.</p>\n<p>Lo dijo de un modo que me pasó de largo en ese momento, y que después iba a volver, pero en ese momento lo que oí fue el tono, que era de desprecio, y lo que vi fue que no negaba. Que no decía «yo no fui». Que no me decía quién había sido. Que se quedaba sentada delante del papel con mi firma falsa mirándome a mí como si la acusada fuera yo.</p>\n<p>—Decime quién firmó esto.</p>\n<p>—Preguntale a él.</p>\n<p>—Mi hermano no está, Ana. Decís «también». Decís «morirte vos también». ¿Dónde está?</p>\n<p>—No sé.</p>\n<p>—Lo despediste en el muelle el miércoles.</p>\n<p>—Sí.</p>\n<p>—Después de decirme que dormías.</p>\n<p>—Sí.</p>\n<p>—¿Qué le dijiste en el muelle?</p>\n<p>Ana se paró. Se paró con una lentitud rara, apoyando una mano en la pared, como si le pesara el cuerpo, y se quedó parada mirándome desde arriba, con la toalla celeste todavía en los hombros, que no se la había sacado desde la escalera.</p>\n<p>—Le dije que lo quería —dijo—. ¿Querés saber qué le dije? Le dije eso. Y le dije otra cosa, que no te voy a decir a vos, porque es de él, y si él está vivo te la va a decir él, y si no está vivo no te la voy a decir nunca. —Le temblaba la boca—. Vos pensás que yo le hice algo. Decilo.</p>\n<p>No lo dije. No pude decirlo o no quise, y las dos cosas son lo mismo visto desde afuera. Me quedé sentada en el piso con el pan en la mano, mirando el boleto, y Ana esperó un tiempo que me pareció largo y después dio dos pasos, entró en el baño, y cerró la puerta, y oí el pestillo.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Me quedé un rato así. Después doblé el boleto, lo guardé en el bolsillo del jean de mi hermano, me levanté y fui a la ventana del fondo del pasillo, la chica, la alta, y me subí a la silla.</p>\n<p>Llovía. La lluvia caía sobre el agua marrón y la hacía gris, y borraba la otra orilla, y entre la lluvia y las ramas del sauce de la curva el muelle de Elías era una mancha azul, la lona, nada más, sin forma, y la casa de Elías una sombra, y no se veía al perro. El viento traía la lluvia contra el vidrio en ráfagas, y entre ráfaga y ráfaga el vidrio se limpiaba y se veía un segundo más lejos, y después se cerraba.</p>\n<p>Pensé en Ana del otro lado de la puerta del baño. Pensé en su cara cuando vio el papel: la sangre que se iba. Eso no se finge. Pero una se queda sin sangre en la cara por muchas razones, y una de las razones es ver sobre una mesa algo que una creía bien escondido. Pensé en «morirte vos también». Pensé en «lo quería», en pasado, dicho por una mujer que dos días antes decía «preguntale a él» en presente. Pensé en lo que no me iba a decir nunca.</p>\n<p>Y pensé, porque soy lo que soy, en la mano con que había cortado el pan. La derecha. El cuchillo en la derecha, el pan en la izquierda, el gesto de serrucho. Y en el arrastre en el remate de la cola de mi firma, un velo de tinta hacia la derecha, la sombra de una mano que pasó por encima.</p>\n<p>Hay un momento en toda pericia en que los hechos que una anotó en renglones separados empiezan a pedir que se los junte, y una tiene que decidir si los junta o si todavía no. Es un momento de oficio. Es el momento en que la mayoría de los peritos se equivoca, para un lado o para el otro: los que juntan antes de tiempo ven lo que querían ver, y los que no juntan nunca entregan un informe que no dice nada. Yo me jacto de saber cuándo.</p>\n<p>Me equivoqué una vez. Lo cuento porque viene al caso y porque no lo cuento nunca. Hace nueve años, un juzgado de Lomas me mandó un testamento ológrafo, de puño y letra, de una mujer de ochenta y dos años, y las muestras de comparación: cartas, cheques, un cuaderno de recetas. El testamento dejaba todo a un sobrino y nada a las hijas. Las hijas decían que era falso. Yo miré el testamento y vi una letra temblorosa, lenta, con retoques, con la presión despareja, y miré las cartas, que eran de una mano firme, y junté. Junté en dos días lo que tenía que haber tardado dos semanas: dictaminé que el testamento no era de la mano de la testadora. Era. La mujer había escrito el testamento un mes después de un accidente cerebrovascular que le había dejado la mano derecha a medias, y nadie me había mandado muestras de después del accidente porque nadie había pensado que importaba, y yo no las había pedido porque la letra temblorosa me había dicho lo que yo ya pensaba sobre un sobrino que se queda con todo. Un perito de parte lo demostró en una audiencia con una historia clínica. El juez fue amable conmigo. Yo no fui amable conmigo durante un año.</p>\n<p>Desde entonces tengo una regla, que es la del oficial de justicia con otro nombre: cuando los hechos me dicen lo que yo ya pensaba, es cuando menos hay que creerles. Esa mañana, en la silla, con la lluvia en el vidrio, decidí que todavía no. Que la mano derecha era un hecho y el arrastre era un hecho y no se tocaban. Que lo que se tocaba era lo otro: la carpeta en la mesa de luz, el almanaque cuando dije Acuña, el «también», la puerta del baño con el pestillo.</p>\n<p>Me bajé de la silla. En el baño corría el agua de la canilla, que era agua del tanque, que había que cuidar, y que Ana dejaba correr para que yo no la oyera, y la oí igual.</p>","palabras":1727},{"n":11,"titulo":"El señor Acuña","cuando":"Sábado 11 de octubre, 12.30","html":"<p>A las doce y media paró de llover. No aflojó el viento del todo, pero bajó a algo que ya no silbaba en las ventanas, y el cielo, sin abrirse, se levantó: de un gris pegado al agua pasó a un gris con altura, y por primera vez en dos días se vio la otra orilla entera, los sauces metidos hasta la mitad, el techo del recreo, y más lejos, por el lado de la curva, una franja de luz blanca que podía ser el sol en algún lado. El agua no bajó. Dejó de subir, que no es lo mismo, y se quedó quieta en el descanso de la escalera, lisa, con una capa de aserrín y hojas y una mancha de nafta con los colores de la nafta.</p>\n<p>Oí el motor antes de ver la lancha. Un motor grande, de los de noventa, que venía arroyo arriba a media máquina, y pensé Prefectura, y pensé Martín, y salí al descanso con el agua en los tobillos y el buzo gris de mi hermano y vi aparecer por la curva un semirrígido gris con una franja roja y la leyenda «Acuña Hnos.» en el tubo, y un hombre solo al timón, parado, con una campera de agua amarilla.</p>\n<p>Redujo al ver la casa. Vino despacio, mirando, como se mira un terreno, los pilotes, el techo, el galpón, con un interés que no era el de alguien que busca a una persona. Se arrimó a la escalera. Apagó el motor. Y recién entonces me miró a mí.</p>\n<p>—Buenas. —Tenía una voz suave, de los que no la levantan nunca—. Busco a Martín Aldao.</p>\n<p>—No está.</p>\n<p>—¿Y usted es…?</p>\n<p>—La hermana.</p>\n<p>Hubo un segundo en que la cara del hombre hizo una cosa muy rápida, un reacomodo, como un expediente que cambia de carátula.</p>\n<p>—Verónica. —Se sacó el guante y me tendió la mano desde la lancha, y yo se la di porque no supe qué otra cosa hacer—. Federico Acuña. Tenemos cita el martes.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Lo dejé subir. No lo invité: él preguntó si podía amarrar un momento, que venía mojado y que quería hablar cinco minutos, y yo dije que sí porque un perito deja que el testigo hable. Amarró a la baranda con dos vueltas rápidas, de alguien que ata lanchas todos los días, y subió la escalera con las botas de goma hasta la rodilla, secas por dentro, y se quedó en el pasillo de arriba mirando las sillas apiladas y las velas en los platos y el almanaque de la ferretería con una cortesía de visita.</p>\n<p>Tenía cuarenta y pico. Camisa celeste bajo la campera, bien planchada, con un escudo bordado. La cara afeitada, las manos cuidadas, el reloj. Olía a perfume por encima del olor a río, que es una combinación rara. Se parecía a los abogados que me contratan para la parte privada, los de los bancos, que te explican lo que querés oír con una paciencia de quien sabe que el tiempo está de su lado.</p>\n<p>—Lamento la situación —dijo—. Vine porque no logro comunicarme con su hermano desde el miércoles y mañana, pasado, tenemos un compromiso. No sabía que usted estaba acá. —Miró alrededor otra vez—. Con esto.</p>\n<p>—¿Qué compromiso?</p>\n<p>Me miró con una expresión paciente, un poco sorprendida, un poco no.</p>\n<p>—La escritura. El martes a las once, en lo de Pereyra. —Esperó—. Su hermano me dijo que usted estaba de acuerdo.</p>\n<p>—¿Eso le dijo?</p>\n<p>—Me trajo el boleto ya firmado por usted. —Lo dijo con el tono con que se dice un dato que uno ya sabe que va a ser discutido—. Yo lo acepté de buena fe, Verónica. Se lo digo con todo respeto. Entre vecinos, en el Delta, las cosas se hacen así. El lote está a nombre de los dos, su hermano me dijo que usted vivía en Capital y que no iba a venir a firmar un boleto por un lote que no pisa, que ya lo había firmado, y yo no tengo por qué desconfiar de un hombre que conozco hace tres años. —Hizo una pausa—. Si hay un problema con eso, prefiero que me lo diga ahora.</p>\n<p>Yo tenía el boleto en el bolsillo del jean. Lo sentí contra la pierna. No lo saqué.</p>\n<p>—No hay problema —dije—. Cuénteme del miércoles.</p>\n<p>Me contó. Lo contó bien, en orden, sin que yo le pidiera detalles, como quien tiene la versión lista porque ya la pensó. Martín había pasado a buscarlo el miércoles a las ocho por el muelle de la empresa, en Tigre, en la «Marta». Habían ido juntos en el auto de Acuña a la escribanía a dejar los papeles para el martes: la documentación del lote, las fotocopias, lo que el escribano pide una semana antes. Habían tomado un café. Martín, dijo, estaba callado, más callado que siempre, que ya es decir. Después Martín le había dicho que tenía que ir a lo del Turco Salim, el mecánico de la calle Mitre, por el arranque del motor, y Acuña lo había llevado en el auto hasta la estación fluvial, que queda a dos cuadras, y lo había dejado ahí a las dos.</p>\n<p>—¿A las dos?</p>\n<p>—A las dos, dos y cinco. Me acuerdo porque tenía una reunión a las dos y media. —Se tocó el reloj—. La lancha de él quedó en mi muelle. Cuando volví a la empresa, a las seis, ya no estaba. Supuse que había vuelto a la isla antes de que se largara el viento. El jueves lo llamé. Apagado. El viernes, apagado. Hoy, con esto, me preocupé. Por él —agregó, y la pausa antes del «por él» fue tan chica que casi no estuvo.</p>\n<p>Martín estaba vivo el miércoles a las dos de la tarde en la estación fluvial de Tigre, a dos cuadras de lo del Turco, con la lancha amarrada en un muelle ajeno. Entre las dos y las seis la había sacado. Entre las dos y las seis había hecho algo, y después de las seis, con el viento ya largado, había ido a algún lado en una lancha de madera de cinco metros con el arranque fallando.</p>\n<p>—¿Estaba bien?</p>\n<p>—Estaba… —Acuña buscó la palabra con cuidado, como quien elige la que no le va a traer problemas—. Como si tuviera algo que decir y no lo dijera. Yo pensé que era por el precio. Pasa. La gente firma y después se arrepiente, y la seña ya está entregada. —Me miró—. Usted sabe cómo es, Verónica. Si no se escritura el martes, hay que devolver el doble. Cuarenta mil. Yo no quiero llegar a eso. Le juro que no quiero. Pero tengo socios.</p>\n<p>Lo dijo con una amabilidad perfecta. Me dio una tarjeta, blanca, con relieve. Me dijo que los Cardozo ya habían firmado, que los Riquelme estaban por, que el arroyo iba a cambiar mucho en dos años y que iba a ser para mejor, con un muelle público y la calle de tablas nueva, y que él entendía lo que era una casa de la abuela, que él también había tenido una. Me preguntó si necesitaba algo, agua, nafta, si quería que me llevara a Tigre, que con esa lancha se podía. Le dije que no. Me preguntó si podía hacer algo por Martín. Le dije que avisara a Prefectura que había estado con él el miércoles a las dos. Dijo que lo iba a hacer.</p>\n<p>—Una cosa más —dije cuando ya bajaba la escalera—. ¿Usted anduvo por acá ayer, temprano? ¿En una chata?</p>\n<p>Se rió. Fue la única risa de la visita y fue honesta.</p>\n<p>—¿En chata? Yo no sé remar, Verónica. Nací en Tigre y no sé remar. —Se subió al semirrígido—. Si Martín aparece, que me llame. Y si no aparece… —Desató las dos vueltas—. Si no aparece, usted y yo tenemos que hablar igual. El boleto lo firmaron los dos.</p>\n<p>Arrancó el motor y se fue arroyo abajo, despacio, mirando las casas.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Ana estaba en la escalera de arriba, sentada en el último escalón, con la puerta del baño abierta detrás. Había escuchado todo. Tenía la cara limpia y los ojos hinchados y no me esquivó.</p>\n<p>—Ese es Acuña —dijo.</p>\n<p>—Dijiste que no sabías quién era.</p>\n<p>—Dije que no sabía. —Se apretó las manos entre las rodillas—. Vino dos veces en septiembre. Martín me hizo quedarme arriba las dos veces. Yo lo escuché desde acá, como ahora. —Me miró—. A las dos de la tarde. ¿Oíste? Estaba vivo a las dos de la tarde del miércoles.</p>\n<p>—Oí.</p>\n<p>—Y la lancha la sacó después.</p>\n<p>—Oí.</p>\n<p>—Hay otra cosa —dijo Ana, antes de que yo me moviera—. De septiembre. La segunda vez que vino, yo estaba arriba, acá, en este escalón, y lo escuché a Martín decirle «mi hermana está de acuerdo». Con esa voz. La de cuando dice que el motor anda bien. —Se miró las manos—. Y yo me quedé arriba. No bajé. No bajé a decir que no era cierto, ni ese día ni el otro. Pensé: es de él, que lo arregle él. —Levantó la vista—. Eso también es mío, Verónica. No el papel. Lo otro. El escalón.</p>\n<p>No supe qué decirle. Era, pensé, la primera cosa que Ana me decía que no fuera una defensa ni un ataque, y venía en el peor momento, cuando yo tenía en el bolsillo un papel que decía que ella era otra cosa, y la dejé pasar, como había dejado pasar el pan y la mano derecha, al renglón de lo que no se junta todavía.</p>\n<p>No dijo nada más. Yo tampoco. Teníamos, cada una, un pedazo de miércoles, y los dos pedazos no se tocaban, y entre uno y otro había una tarde entera en Tigre con un hombre callado que tenía algo que decir.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Elías vino a las tres, en el bajón del viento. Venía remando con su chata, el compás de siempre, y remolcaba la nuestra. La nuestra, verde, derecha otra vez, con el agua sacada, atada por la proa a la popa de la de Elías con una soga corta. La había encontrado, dijo, en el muelle de los Riquelme, dada vuelta, trabada entre dos postes, con un remo adentro, enganchado bajo el banco. El otro remo no. Me traía uno de los suyos.</p>\n<p>—Te dije que no anduvieras en la chata.</p>\n<p>—Ya sé.</p>\n<p>—Te lo dije dos veces.</p>\n<p>—Ya sé, Elías.</p>\n<p>Me miró desde abajo, desde la chata, con la gorra chorreando, y en esa mirada había algo más que el reto, una cosa cansada, vieja, de hombre que lleva días sin dormir. Ató la nuestra a la baranda. Me alcanzó el remo. No subió.</p>\n<p>—¿Viste al hombre? —dije—. El de la chata. Fue para tu lado, por los sauces.</p>\n<p>—No vi a nadie.</p>\n<p>—El Negro ladraba.</p>\n<p>—El Negro ladra. —Agarró los remos—. Con el agua así no le gusta el galpón, le entra por abajo. Ladra todo el día.</p>\n<p>Se fue. Antes de la curva se dio vuelta, una vez, y miró la casa, y miró la ventana del fondo del pasillo, la alta, la chica, donde yo había estado subida a una silla, y después siguió remando y el sauce lo tapó.</p>\n<p>Me quedé en el descanso con el remo de Elías en la mano. Pensé en el muelle de los Riquelme, que está arroyo arriba, hacia donde el río me había llevado. Pensé en que Elías había salido con esa creciente a buscar una chata para devolvérmela, y que me había traído un remo, y que no había visto a nadie, y que el Negro ladra todo el día. Y pensé en Acuña, que no sabía remar, y en Ana, que había escuchado desde la escalera, y en que el hombre de la gorra me había mirado desde los sauces, a treinta metros, como se mira una casa que uno conoce.</p>","palabras":1968},{"n":12,"titulo":"14.10","cuando":"Sábado 11 de octubre, 16.00","html":"<p>Ana se bañó a las cuatro. Quedaba un fondo en el tanque, lo suficiente para un baño corto de una persona, y lo decidió ella: dijo que se iba a bañar, que después yo, que con lo que sobrara llenábamos las botellas, y entró en el baño con una muda de ropa doblada y cerró la puerta sin pestillo, que fue una manera de decir algo. Oí la ducha.</p>\n<p>El teléfono quedó en el pasillo.</p>\n<p>Lo había dejado en el piso, al lado de la ventana del fondo, parado contra la pared, donde a veces entraba una raya de señal cuando el viento bajaba. Tenía la pantalla negra. Lo miré desde mi lugar, sentada con la espalda contra la pared de enfrente, durante lo que debe haber sido un minuto, mientras la ducha corría, y lo que pensé en ese minuto no lo voy a adornar: pensé que una perita no abre un teléfono ajeno, y pensé que una perita trabaja con lo que el juez le da, y que ahí no había juez, y que la ducha de una persona con un tanque en el fondo dura cuatro minutos.</p>\n<p>Lo agarré. Lo prendí. Once por ciento, una raya de señal que vino y se fue. Pedía la clave.</p>\n<p>La gente elige la clave como elige la firma: con lo que tiene más cerca. Un cumpleaños, el propio, el de un hijo, el del otro. Martín nació el 23 de marzo. Puse 2303 y el teléfono se abrió, y sentí en el pecho algo que no era triunfo.</p>\n<p>Fui a los mensajes. Al primero, al de arriba, al chat que decía «Martín» con una foto de perfil que era una foto del taller, el banco, las gubias, sin cara. Lo abrí.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>El último mensaje era de ella, del jueves a las 23.40: <em>por favor</em>. Arriba, del jueves a las 21: <em>donde estás</em>. Arriba, del miércoles a las 23.10: <em>Martín</em>. A las 21.05: <em>contestame</em>. A las 19.30: <em>estoy en casa. no estás</em>. A las 15.02: <em>contestame por favor</em>. A las 14.30: <em>Martín</em>. A las 14.12: <em>qué no podés?</em></p>\n<p>Y arriba de eso, a las 14.10 del miércoles, en gris, del otro lado, de él:</p>\n<p><em>no puedo. perdoname</em></p>\n<p>Sin mayúscula, sin acento, como escribe Martín en el teléfono, que escribe como si el teléfono le pesara. Dos frases. Un punto entre las dos. Y arriba de eso, a las 6.05 del miércoles, de ella, mandado desde ese muelle que ya no existía, cuando la lancha se alejaba con el motor bajo y Elías levantaba las nasas:</p>\n<p><em>te amo. hacelo.</em></p>\n<p>Hay una cosa que se aprende leyendo correspondencia ajena en los expedientes, y es que la gente no escribe para el que después la va a leer. Escribe para el otro, para ese otro solo, con una taquigrafía de dos personas que nadie más entiende del todo, y el que lee después, el perito, el juez, la hermana, entra en esa taquigrafía como en una casa donde no se conocen los pasillos. Yo no conocía esos pasillos. Sabía que mi hermano escribía sin acentos y que ponía punto entre las frases cortas como si cada una fuera una tabla que apoya antes de poner la siguiente, y nada más.</p>\n<p>Subí más. Antes del miércoles los mensajes eran de otra cosa: una foto de un chico de la escuela con un diente menos, un «comprá pan», un «llego en la de las cinco», un audio que no escuché, un corazón. La vida. El martes a la noche, a las 23.20, después de que él me llamara, de ella: <em>bien. ya está. ahora dormí.</em> Y nada más que importara, y la ducha que seguía corriendo, y yo con el teléfono de otra mujer en la mano leyendo los mensajes de mi hermano, que decían no puedo, que decían perdoname, y que no decían a quién.</p>\n<p>La ducha paró.</p>\n<p>No lo apagué. No lo dejé en su lugar. Me quedé sentada con el teléfono en la mano, la pantalla prendida, la conversación abierta, y cuando Ana salió del baño con el pelo mojado y la ropa limpia me encontró así, y se detuvo en la puerta, y lo vio.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>No gritó. Ya lo dije: Ana no grita. Lo que hizo fue cruzar el pasillo en tres pasos, sacármelo de la mano con una fuerza que no me esperaba, y quedarse parada delante de mí con el teléfono contra el pecho, mirándome desde arriba con una cara que no era de rabia. Era peor. Era la cara de alguien a quien le acaban de sacar la última cosa que tenía para ella sola.</p>\n<p>—¿Leíste?</p>\n<p>—Sí.</p>\n<p>—Bien. —Le temblaba la mandíbula—. Ahora sabés lo mismo que yo.</p>\n<p>—¿Qué no podía?</p>\n<p>—No sé.</p>\n<p>—«Hacelo». ¿Hacer qué?</p>\n<p>—Decírtelo. —Lo dijo en voz baja, apretada—. El martes a la noche te llamó. Yo estaba al lado. Le dije que estaba bien, que ya estaba, que durmiera. El miércoles a la mañana lo despedí en el muelle y le dije que te lo dijera ese día, en Tigre, por teléfono, en persona, como fuera, que no esperara al jueves a que vinieras vos. Le dije: se lo decís hoy o me voy. —Se le quebró la voz y la enderezó—. No es una amenaza, le dije. Es lo que hay. No puedo vivir con un hombre que le tiene más miedo a su hermana que al río. Eso le dije. Y le dije que lo amaba, porque era verdad. Y le mandé eso. —Apretó el teléfono—. Te amo. Hacelo.</p>\n<p>—¿Y «no puedo»?</p>\n<p>Ana se sentó. Se dejó caer, en realidad, contra la puerta de la pieza de Martín, con las piernas estiradas, con el teléfono en la falda, y me miró con los ojos rojos y la cara mojada que podía ser de la ducha.</p>\n<p>—Es una despedida, Verónica. ¿No lo ves? Es una despedida. «No puedo. Perdoname». Un hombre que a los veintiséis se tomó dos tiras de pastillas con ginebra te escribe eso a las dos de la tarde y a las seis saca la lancha con el viento largado y no vuelve. —Le salió un sonido que no era un sollozo, era más seco—. Se mató. Tu hermano se mató y yo hace tres días que no puedo decirlo en voz alta porque si lo digo es verdad.</p>\n<p>—Mi hermano no se mató.</p>\n<p>—Lo intentó una vez.</p>\n<p>—Por eso sé. —Me oí—. Yo lo encontré. Yo sé cómo es cuando lo hace. No manda un mensaje. No saca la lancha. Se queda. Se queda en el piso de la cocina.</p>\n<p>—Tenía veintiséis años.</p>\n<p>—Lo sé mejor que vos.</p>\n<p>—Sabés cómo firma —dijo Ana—. Eso sabés.</p>\n<p>Nos quedamos en silencio. Afuera el viento, que había bajado para Acuña y para Elías, estaba subiendo otra vez, y la luz se iba, y la ventana del fondo se había puesto de un gris de plomo.</p>\n<p>—¿Y por qué lo iba a hacer? —dije—. ¿Por un boleto? ¿Por cuarenta mil dólares?</p>\n<p>—Por vos.</p>\n<p>Lo dijo sin levantar la voz. Lo dijo como se dice el nombre de una enfermedad.</p>\n<p>—Porque no podía decírtelo. Porque hace doce años que vive de lo que vos le dejás sobre la mesa y no sabe cómo se dice que no. Porque yo le pedí que lo hiciera y él no pudo, y lo que no pudo fue eso, hablar con vos, y lo otro le pareció más fácil. —Se pasó la mano por la cara—. No te lo digo para lastimarte. Te lo digo porque es lo que pienso desde el miércoles a las dos y diez y no se lo puedo decir a nadie más.</p>\n<p>—A mí no me tiene miedo.</p>\n<p>—Leé las libretas.</p>\n<p>—Las leí. —Me levanté. No sé por qué me levanté—. Las leí, Ana. Dice que tiene miedo. Lo escribió. Dice «ella no va a dejarme ir». Dice «ella me dejó las pastillas contadas». Dice «ella no sabe lo que es que te cierren con llave».</p>\n<p>Ana me miró desde el piso. Hubo un momento, largo, en que me pareció que iba a decir algo y lo vi cambiar de idea, como quien ve un camino y toma el otro.</p>\n<p>—Yo no leí esas libretas —dijo—. Nunca las abrí. Vos sí. —Se puso de pie, con la pared—. Leelas mejor.</p>\n<p>Entró en la pieza de Martín. No cerró con pestillo porque esa puerta no tiene pestillo, tiene una llave vieja que está puesta del lado de afuera desde que mi abuela vivía, y no la movió. Cerró, nada más, y la casa se quedó con el viento.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Encendí la vela cuando ya no se veía. Me senté en mi lugar del pasillo, con la espalda en la pared y el boleto en el bolsillo del jean, y me quedé mirando la puerta cerrada de la pieza de mi hermano.</p>\n<p>No puedo. Perdoname.</p>\n<p>Hay una manera de leer eso que es la de Ana, y esa noche, por primera vez, la pensé entera, sin pararla en la puerta. La pensé así: no puedo decírselo. Perdoname porque no puedo decírselo. Y lo que no podía decir era una cosa que tenía que ver conmigo, que era para mí, que tenía mi nombre, y que un hombre de treinta y ocho años con una libreta y una lancha y una mujer que lo amaba no había podido decir en voz alta a su hermana en doce años. La pensé y me pasó por el cuerpo como pasa el frío del agua, de golpe, y después no pude seguir. No pude. Es la palabra exacta. Hay un lugar al que el pensamiento llega y donde se queda parado, y una lo ve ahí y sabe que no va a entrar, y lo que hace en lugar de entrar es dar la vuelta.</p>\n<p>Di la vuelta. La di como se da en un informe cuando el perito, en lugar de concluir lo que los hechos piden, concluye lo que puede firmar. Pensé: «hacelo». Pensé: «se lo decís hoy o me voy». Pensé en una mujer parada en un muelle a las seis de la mañana diciéndole a un hombre que no sabe decir que no que tenía que hacer una cosa ese mismo día o perderla. Pensé en lo que le había hecho a él esa presión, a él, que escribía que no lo dejaban ir y que le contaban las pastillas. Pensé en un hombre con miedo en una lancha con el viento largado.</p>\n<p>Y se lo dije a la puerta. En voz baja, para que no me oyera y para oírme yo:</p>\n<p>—Vos lo empujaste.</p>\n<p>La vela hizo una sombra larga en la pared de enfrente, hasta el almanaque de febrero. Abajo el agua golpeaba el piso de mi pieza desde el otro lado, con el ritmo de siempre, y afuera el viento había vuelto a ser el de la primera noche, y yo me quedé con la frase en la boca, la frase que me salvaba, apretada como se aprieta un papel en el bolsillo para saber que sigue ahí.</p>","palabras":1845},{"n":13,"titulo":"Con llave","cuando":"Sábado 11 de octubre, 23.00","html":"<p>A las once el viento arrancó la lona. No la nuestra, que no teníamos: la de la casa de enfrente, la del recreo, una lona que había estado atada sobre el techo del quincho desde hacía años, y que se soltó de un lado y empezó a dar latigazos contra la chapa con un ruido de disparo, cada cuatro o cinco segundos, que llegaba por encima del viento y del agua y que no iba a parar en toda la noche. El río había vuelto a subir. Lo vi con la linterna desde arriba de la escalera: el agua tapaba el descanso y lamía el escalón siguiente, y el pasillo de abajo, el hueco de la escalera, la cocina, la galería, todo eso era ahora una sola oscuridad con agua que se movía y chocaba contra las vigas, y la chata, atada a la baranda, flotaba casi a la altura del pasillo de arriba, con el remo de Elías y el nuestro cruzados adentro.</p>\n<p>Las velas de Elías eran tres. Quedaba una y media. La media la tenía prendida en el pasillo, en el plato, y la luz le daba a la puerta de la pieza de Martín y a mis manos, y nada más.</p>\n<p>Ana salió a las once y cuarto.</p>\n<p>Salió vestida: el jean, las zapatillas, la campera de jean cerrada hasta arriba, el pelo atado, la linterna en la mano. Se había puesto encima el impermeable de Martín, el amarillo, el que cuelga del clavo del taller y que yo no había visto subir. Tenía la cara de alguien que tomó una decisión en la oscuridad de una pieza y que no la va a discutir.</p>\n<p>—Voy a lo de Elías.</p>\n<p>—¿Ahora?</p>\n<p>—A la radio. —Hablaba bajo, como si la lona de enfrente le impusiera el tono—. Que Prefectura busque la lancha. Que busquen en el Luján, en el Sarmiento, donde sea. Que busquen un cuerpo, Verónica. Hace tres días que nadie busca. Elías dijo que llamó y no llamó. Lo conozco. Cuando miente mira el agua.</p>\n<p>—Elías llamó.</p>\n<p>—Elías no llamó. —Se puso la capucha—. Voy en la chata, pegada a la orilla, por los árboles, donde el agua está quieta. Son trescientos metros. Si vos pudiste cruzar a la madrugada, yo puedo ir por la orilla.</p>\n<p>—Me di vuelta.</p>\n<p>—Vos fuiste al medio. Yo no voy al medio.</p>\n<p>Me paré. Me paré entre ella y la escalera, que es un lugar angosto, y lo hice sin pensarlo, como se pone una mano sobre un papel que el viento va a llevarse.</p>\n<p>—No vas a ningún lado.</p>\n<p>Ana se detuvo. Me miró con la linterna apuntando al piso, que me iluminaba desde abajo, que debe haberme hecho la cara que me hizo.</p>\n<p>—Correte.</p>\n<p>—Nadie sale de esta casa hasta que yo sepa qué pasó.</p>\n<p>—¿Qué pasó con qué?</p>\n<p>—Con mi hermano.</p>\n<p>—Tu hermano está en el fondo del río —dijo Ana—, y vos querés que me quede acá para preguntarme si lo empujé.</p>\n<p>Lo había oído. A través de la puerta, la noche anterior, en voz baja, lo había oído. Me lo dijo con la cara a un palmo, con el aliento tibio, y en ese momento no me importó.</p>\n<p>—Sí.</p>\n<p>—Correte.</p>\n<p>Me empujó. No con fuerza: con el hombro, para pasar, como se pasa en un pasillo lleno de gente. Y yo la agarré.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>No voy a contar esto mejor de lo que fue. La agarré del impermeable, del brazo, y ella se dio vuelta y me agarró a mí, y por un momento fuimos dos mujeres en un pasillo de un metro de ancho, a la luz de media vela y una linterna que rodó por el piso, forcejeando sin gritar, con la respiración y nada más, con las sillas apiladas que se vinieron abajo, con la escalera a dos pasos y el agua negra abajo de la escalera. Ella era más fuerte. Yo era más pesada. Me pegó un codazo en la boca que me hizo sentir el gusto de la sangre y yo la empujé contra la pared con todo el cuerpo y oí el ruido de su cabeza contra la madera, un ruido seco, y ella se quedó un segundo quieta, aturdida, y en ese segundo la tomé de la campera por detrás, del cuello del impermeable, y la llevé.</p>\n<p>Dos pasos. Tres. La pieza de Martín tenía la puerta abierta y adentro estaba oscuro y la empujé adentro, y ella trastabilló y cayó de rodillas sobre las tablas, y yo cerré la puerta.</p>\n<p>Y giré la llave.</p>\n<p>Es una llave vieja, de hierro, grande, de las que giran dos veces. La giré dos veces. Hizo el ruido que hacen esas llaves, un ruido de mecanismo, pesado, definitivo, que se oye en toda la casa, y lo oí, y lo que pensé mientras lo oía fue que ese ruido lo conocía de algún lado, que lo había oído antes en algún lugar con un ficus y una mujer de anteojos, y no lo pensé más. Saqué la llave. Me la guardé en el bolsillo del jean, con el boleto.</p>\n<p>Del otro lado Ana golpeó la puerta. Una vez con la mano abierta, después con el puño, después con el cuerpo. La puerta de esa pieza la hizo mi abuelo con tablas de dos pulgadas y no se movió.</p>\n<p>—¡Abrí!</p>\n<p>Me senté en el piso del pasillo, de espaldas a la pared de enfrente, con las piernas cruzadas, como en todos esos días. Levanté la linterna. La apagué. Enderecé la vela en el plato.</p>\n<p>—¡Verónica, abrí la puerta!</p>\n<p>—Mañana —dije—. Cuando baje el agua. Cuando venga Prefectura. Cuando yo sepa.</p>\n<p>—¡Estás loca!</p>\n<p>—Puede ser.</p>\n<p>Golpeó un rato más. Pateó la puerta, y la puerta hizo el ruido de las tablas de dos pulgadas, y después dejó de patear, y oí que se sentaba del otro lado, contra la madera, a treinta centímetros de mí, con la puerta en el medio, y oí su respiración, que al principio era rápida y después no, y después no oí nada, porque el viento y la lona y el agua se lo llevaban todo.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Me quedé ahí con las libretas.</p>\n<p>Las había subido todas, las once, del estante del ropero, la noche anterior, en dos viajes, y las tenía apiladas al lado de la pared por orden de lomo. Agarré la de arriba. La abrí sobre las rodillas, a la luz de la vela, y empecé a leer como no había leído hasta entonces: no buscando, sino de corrido, desde el principio, como se lee un expediente entero cuando una entiende que la primera lectura no sirvió.</p>\n<p>La boca me sangraba. Me la limpié con la manga del buzo de Martín, y seguí.</p>\n<p>Las libretas de los años del medio son las más llenas. Hay una, la del cuarto año, que es casi toda de un bote: un casco de cedro de seis metros, de un hombre de San Fernando, que Martín rehízo cuaderna por cuaderna durante ocho meses y que anota como se anota una enfermedad, con fechas y partes del cuerpo. <em>Quilla, lista. Roda, mañana. La tercera cuaderna no entra. Entró.</em> Hay una, la del sexto año, donde aparece una P., una mujer que vivía en San Fernando y que durante dos meses viene y se va en las entradas con una ternura torpe, <em>P. trajo empanadas, P. dice que el taller huele bien, P. no vuelve, mejor</em>, y después no está más. Hay páginas enteras sobre el Turco, que le enseñó los motores y que una vez, en el quinto año, lo encontró con una cerveza en la mano en un bar de Tigre y se la sacó y se la tomó él, delante suyo, sin decir nada, y Martín escribió: <em>el Turco no me dijo nada y es lo mejor que me dijo nadie</em>. Hay anotaciones del río, de la altura, de las crecientes, de los pájaros, del día en que una garza se le paró en el muelle y lo miró. Hay un hombre ahí. Un hombre entero, con un oficio y una vida y gente, que escribe para él en una letra chica desde hace doce años, y yo lo estaba conociendo a la una de la mañana, con una llave en el bolsillo, en un pasillo con olor a vela.</p>\n<p>En algún momento, después de medianoche, me dolió la espalda y me levanté a estirarme, y fui hasta la ventana del fondo del pasillo, la alta, la chica, y me subí a la silla que había quedado en pie.</p>\n<p>Afuera era la noche de la sudestada: negra, sin orillas, con el ruido. La lluvia había vuelto. No se veía el sauce de la curva ni el muelle de Elías ni la casa de Elías. No se veía nada. Me quedé igual, con la frente contra el vidrio frío, mirando esa nada, no sé cuánto tiempo, y en un momento el viento abrió un hueco en la lluvia, como abre a veces, un segundo, un corredor limpio en el aire, y por ese corredor, arroyo abajo, a trescientos metros, donde tenía que estar el galpón de Elías, vi una luz.</p>\n<p>Una luz chica, amarilla, baja. No la de la casa: la casa de Elías está más alta y más a la izquierda. Esta estaba al nivel del agua, a la derecha, donde la chapa del galpón, donde el pallet y el perro. Una luz de farol o de sol de noche, quieta, que no era un reflejo porque el agua no estaba quieta y ella sí. La vi un segundo entero. Después la lluvia cerró el hueco y no vi más nada.</p>\n<p>Me bajé de la silla. Volví a mi lugar. Pensé que Elías estaba en el galpón, a la una de la mañana, con el agua entrándole por abajo, atando cosas, o que había dejado un farol prendido para el perro, que es algo que hace la gente que vive sola con un perro. Pensé eso y lo anoté en el renglón de los hechos sin importancia, que a esa altura era un renglón largo, y agarré la libreta siguiente.</p>\n<p>Del otro lado de la puerta, Ana no se movía. Me pareció que dormía. Me pareció, después, que no, que estaba despierta y escuchando, como yo, con la puerta en el medio, dos mujeres en una casa sobre el agua separadas por tablas de dos pulgadas y una llave de hierro, y no me levanté a abrirle, y no lo hice porque todavía no sabía, y porque la llave en el bolsillo pesaba de un modo que yo, esa noche, confundí con la razón.</p>","palabras":1765},{"n":14,"titulo":"Ella","cuando":"Domingo 12 de octubre, 3.00","html":"<p>La primera libreta es de hace doce años. En el lomo dice, con fibra blanca, «jul-dic», sin año, porque ese año él no necesitaba anotarlo. Es la que le dio la psicóloga de la clínica. Tiene las primeras hojas con la letra más grande que ahora, más abierta, de alguien que vuelve a escribir después de mucho, y las primeras entradas no tienen fecha, solamente el día.</p>\n<p><em>Salí. Ella firmó la salida también. En la oficina del ficus. Dijo que había hecho lo correcto y la de anteojos dijo que sí.</em></p>\n<p><em>Dice que la casa es un buen lugar. Que la casa es mía, de los dos, y que vaya. Dice que va a venir una vez por mes, a ver. No dice a ver qué.</em></p>\n<p><em>Primer sábado. Vino con una bolsa. Yerba, pilas, el diario. Las pastillas. Las contó en la mesa. Yo miré.</em></p>\n<p>Leí esa página tres veces, como había leído «ella trajo la bolsa» la primera noche, y las tres veces fue lo mismo, y no fue lo mismo, porque esa libreta era de hace doce años y hace doce años Ana no existía. Hace doce años en esa casa no había nadie más que él, y una vez por mes, yo.</p>\n<p>Ella.</p>\n<p>Sin inicial. Doce años sin inicial.</p>\n<p><em>Dice que va a venir una vez por mes, a ver.</em> No dice a ver qué. Yo lo había dicho en su cocina de Caballito, no en la suya, en la mía: voy a ir una vez por mes, a ver. Me acuerdo de haberlo dicho y me acuerdo de no haber terminado la frase, porque el «a ver» me pareció suficiente, porque los dos sabíamos a ver qué. A ver si estaba vivo. A ver si tomaba. A ver si las pastillas estaban. A ver. Doce años después, a la luz de una vela, la frase me volvía desde la letra de él, y era exactamente la mía, con la misma falta de final, y lo que él había anotado no era la frase sino el hueco, ese «a ver» sin objeto, que yo había dejado abierto como se deja abierta una puerta para no tener que decir que una va a entrar cuando quiera.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Agarré un papel. Una hoja de uno de mis libros de chica, la guarda, que arranqué, y la birome de la libreta de Martín, y empecé a hacer lo que hago cuando un expediente tiene más de un cuerpo y no me entra en la cabeza: una tabla. Fechas en una columna. Lo que dice en la otra.</p>\n<p>Fui libreta por libreta. Once. Las entradas con «ella» no eran muchas: cuatro, cinco por libreta, entre decenas de otras cosas, el motor, la madera, el río, el Turco, un bote que arregló, una mujer de San Fernando que duró dos meses y tuvo inicial, la P., y el frío, y la soledad escrita sin esa palabra. Pero las que decían «ella» tenían fecha, porque él le pone fecha a todo, y las fechas fueron cayendo en la columna una abajo de la otra, y yo las fui mirando caer.</p>\n<p>Sáb 7/6. Sáb 5/7. Sáb 6/9. De este año. Y del anterior: sáb 2/3, sáb 6/4, sáb 4/5, sáb 1/6, sáb 6/7. Y del anterior. Y del anterior. En doce años, con tres o cuatro excepciones, que eran días en que yo había llamado, que me acuerdo, las entradas con «ella» tenían fecha de primer sábado.</p>\n<p>El primer sábado de cada mes. Lo escribí en el capítulo uno de mi propia vida, en voz alta, en una lancha: voy a la isla el primer sábado de cada mes. Lo escribí como se escribe una virtud.</p>\n<p>Ella trajo la bolsa. La bolsa de siempre. Las pastillas contadas sobre la mesa, treinta, y él las mira toda la noche. Yo las cuento delante de él. Lo dije. No es desconfianza, es orden, lo dije, y las cuento delante de él y las dejo en la mesada al lado de la yerba y él las mira. Doce años. Ciento cuarenta y cuatro veces.</p>\n<p>Sáb 2/8: le mostré el galpón en el teléfono. Dijo: lindo. Dijo: para el verano.</p>\n<p>Y entonces me acordé. No de a poco: de golpe, entero, como se acuerda uno de un sueño cuando alguien dice una palabra. El dos de agosto, en la galería, con el mate, él con el teléfono en la mano, dándomelo, una foto de un galpón de chapa sobre un río ancho con un muelle de tablas y un guinche, y yo mirando la foto un segundo y devolviéndole el teléfono y diciendo: lindo. Diciendo: para el verano. Para ir a pescar en enero, pensé, un lugar que alquila alguien, y seguí hablando de la pintura de la galería. No entendió. O entendió.</p>\n<p>Entendí. Esa era la frase que decía la libreta, y la había leído mal la primera vez y la había leído mal la segunda. O entendió: él lo escribió con la esperanza de que yo hubiera entendido y hubiera elegido no decirlo. No había entendido. No me había dado cuenta de que mi hermano, con una foto en la mano, me estaba diciendo que se quería ir.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Intenté que fuera Ana. Lo digo porque es verdad y porque la verdad es lo que estoy escribiendo acá. Me senté con el papel en las rodillas y lo intenté con todo lo que sé. Ana también podía venir los sábados: vuelve de Zárate, se puede volver antes. Ana le pudo contar las pastillas por su cuenta, para que las tomara, como hace una mujer que tuvo un padre borracho. Ana pudo. Ana pudo. Lo que no pudo Ana fue firmar la salida de una clínica hace doce años en una oficina con un ficus, y lo que no pudo Ana fue venir con una bolsa de yerba y pilas y el diario un primer sábado de hace doce años, y en la libreta era la misma mano y el mismo pronombre y la misma falta de inicial, doce años seguidos, para la misma persona. No hay dos «ella». Yo lo sé. Es mi trabajo saber cuándo dos trazos son de la misma mano.</p>\n<p>Se me cayó. Así se siente: no como un golpe sino como una cosa que una tenía sostenida con un brazo y el brazo se cansa.</p>\n<p>Ella no va a dejarme ir. No lo dice así. Dice: ¿y la casa? Dice: ¿y vos? Dice: ¿y el motor, lo arreglaste? Como si el motor fuera una manera de quedarse.</p>\n<p>Yo pregunto por el motor cada primer sábado. Es lo primero que pregunto. Lo escribí en la lancha: pregunto cómo anda el motor, y él me dice que bien, y yo le creo porque sobre motores no tengo con qué no creerle.</p>\n<p>Ella no sabe lo que es que te cierren con llave. Yo sí.</p>\n<p>Me metí la mano en el bolsillo del jean y toqué la llave. La de hierro, la de dos vueltas. La toqué y la saqué y la miré a la luz de la vela, que ya era una vela chica, y me acordé del ruido, el de mecanismo, pesado, el que había oído dos horas antes y que había reconocido de un lugar con un ficus, y me acordé de que lo había pensado y lo había dejado de pensar. Ella no sabe. Él sí. Él sabe lo que es que te cierren con llave porque yo lo cerré con llave, con mi firma, en una oficina, a los veintiséis años, y había hecho lo correcto. Y a los cuarenta y cuatro acababa de cerrar con llave a una mujer en la pieza de mi hermano porque todavía no sabía, y había sentido que la llave pesaba como la razón.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Saqué el boleto. Lo abrí sobre el papel de las fechas. Puse la vela cerca. No saqué la lupa: no hacía falta la lupa.</p>\n<p>La V con la cola larga. La mía. La que inventé a los nueve copiando la de mi madre y la que le hice a él a los cinco en la mesa de la galería, con mi mano sobre la suya, cien veces, hasta que la hizo sola. Le hice la tuya, dijo mi abuela. Esta firma la había hecho una mano que conocía mi V desde adentro, desde el gesto, no desde el dibujo, una mano a la que yo misma le había enseñado ese gesto antes de que supiera escribir su nombre. Más fluida que la mía, había dicho yo en el taller, con el agua en el muslo. Sin la pausa. Más segura. Claro que no tenía la pausa. La pausa es mía, de cuando la hacía en dos partes a los nueve años; él nunca la hizo en dos partes porque yo se la enseñé entera.</p>\n<p>Y el arrastre. El velo de tinta en el remate de la cola, hacia la derecha, la sombra de una mano que pasa por encima de lo que escribe. El arrastre de un zurdo. Lo había anotado yo en el renglón de los hechos: compatible con escritura de mano izquierda. Lo había anotado y lo había dejado ahí, sin tocar, mientras miraba a una mujer cortar el pan con la derecha, con el cuchillo en la derecha y el pan en la izquierda, y me decía que una firma se aprende con cualquier mano, que el arrastre lo deja cualquiera, cosas que en veinte años de pericias no le había aceptado a ningún abogado.</p>\n<p>Martín es zurdo desde que agarró la primera cuchara.</p>\n<p>Él la escribió. Mi hermano se sentó en algún lado, en el banco del taller, en la mesa de la galería, con la carpeta que yo le armé, con mi firma en el poder de la obra social y en la fotocopia certificada para el gas, y aprendió mi firma. La hizo mil veces. La hizo hasta que la mano la hizo sola, con el gesto que yo le había dado y que ahora me devolvía. Y la puso en un papel que vendía la casa de mi abuela, al lado de la suya, y se lo dio a un hombre con camisa celeste, y cobró, y tiró la cuenta que no daba, y puso ocho mil dólares en una lata de botones y doce mil en un galpón de chapa en Villa Paranacito. Y después me llamó un martes a la noche y me dijo: necesito que vengas. No por teléfono.</p>\n<p>Y cuando yo iba a venir, no pudo. No puedo. Perdoname.</p>\n<p>No podía decírmelo porque yo soy ella. Yo soy la de la bolsa. La que cuenta. La que pregunta por el motor como una manera de que se quede. La que firmó la entrada y firmó la salida y le armó la carpeta y le dijo que si no contestaba tres días iba a tomar la lancha. La que vino, con la bolsa, un jueves.</p>\n<p>Me quedé un rato sin hacer nada. No lloré. No es que no quisiera: es que había otra cosa primero, una cosa que estaba parada en el pasillo de mi cabeza y que ahora sí entraba, y entró, y la dejé entrar entera, y era simplemente esto: en doce años no había abierto las libretas por respeto, y las había abierto la noche en que mi hermano no estaba, y en tres noches de leerlas no había sido capaz de reconocerme en la única persona que estaba en todas.</p>\n<p>Hernán tenía razón. Lo pensé así, con su nombre. Lo pensé y no me dolió, lo que es peor.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Me levanté. Me dolían las rodillas de estar sentada. Fui hasta la puerta de la pieza de Martín con la llave en la mano, y la metí en la cerradura, y la giré dos veces, y el ruido fue el mismo ruido, y abrí.</p>\n<p>—Ana.</p>\n<p>La pieza estaba oscura y olía a lluvia. A lluvia de verdad, mojada, a agua que entra. Levanté la vela. La cama. La mesa de luz con la lámpara de pinza. La banqueta de Ana con la crema y el libro de la escuela. El ropero abierto. Y la ventana, la del costado, la que da al pasillo de tablas del taller, abierta de par en par, con la cortina empapada pegada al marco y la lluvia entrando de costado sobre las tablas del piso, que brillaban.</p>\n<p>Ana no estaba.</p>\n<p>Fui a la ventana. Abajo, a un metro y medio del alféizar, estaba el agua. Negra, moviéndose, con el viento encima. No había nada en el agua. No había nada en el pasillo de tablas, que estaba un metro bajo el agua. No había linterna, no había impermeable amarillo, no había nada que no fuera noche y río y la lona de enfrente dando latigazos contra la chapa, cada cuatro o cinco segundos, como venía haciendo desde las once, mientras yo leía.</p>\n<p>Grité su nombre por la ventana. El viento me lo devolvió a la cara.</p>","palabras":2153},{"n":15,"titulo":"El Negro","cuando":"Domingo 12 de octubre, 4.20","html":"<p>Bajé la escalera con la linterna y sin botas. El agua estaba en el tercer escalón contando desde arriba. La chata flotaba al lado de la baranda, verde, con los dos remos cruzados, el nuestro y el de Elías, y la desaté con el nudo que la mano sabe, y me subí de rodillas, y esta vez no salí al medio.</p>\n<p>Fui por la orilla. Por donde Ana había dicho: pegada a lo que había sido la costa, entre los árboles, los ceibos y los sauces de nuestro lado que ahora eran troncos en el agua, donde el río, frenado por las ramas, se movía menos. Remé con la linterna apretada entre las rodillas apuntando a la proa, y lo que iluminaba era agua marrón, ramas, hojas, una botella, una puerta de alacena que no era nuestra, y lluvia, y lluvia. El viento venía de atrás ahora, arroyo abajo, hacia lo de Elías, y me empujaba, y yo remaba para no ir más rápido de lo que podía ver.</p>\n<p>—¡Ana!</p>\n<p>Cada diez paladas. El viento se llevaba el grito hacia adelante, que era la dirección correcta, y no volvía nada.</p>\n<p>Pasé lo de los Cardozo, de los que se veía el techo y la punta de una chimenea. Pasé el lote vacío con el cartel caído, que no se veía. Pasé el otro lote. Y oí al perro.</p>\n<p>El Negro ladraba. Ladraba como había ladrado a la madrugada del sábado, el ladrido corto, repetido, de perro parado delante de algo, pero más fuerte, más cerca, y más desesperado, con un gemido entre ladrido y ladrido que no le conocía. Ladraba hacia el agua. Lo supe por cómo venía el sonido, abierto, no rebotado contra una pared. Y por encima del ladrido, entre ráfaga y ráfaga, oí otra cosa, una voz, que no decía nada, que era un sonido sin palabra, de alguien que ya no tiene palabras y hace ruido para que se sepa que está.</p>\n<p>Remé con todo.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>La luz de la linterna encontró primero la lona. Azul, tirante, chorreando, sobre el muelle de Elías que ya no era un muelle: estaba bajo el agua, y la lona flotaba sobre lo que tapaba, y debajo de la lona los dos bultos, las dos curvas, y una de las curvas, la más larga, la más baja, tenía bajo la luz de mi linterna un borde de madera barnizada, roja, que yo conocía porque había visto a mi hermano darle tres manos de barniz un verano entero, tabla por tabla. La «Marta». La proa de la «Marta», asomando bajo la lona de Elías, al lado de la lancha de Elías, amarrada ahí desde quién sabe cuándo.</p>\n<p>No pensé nada. O pensé una sola cosa, chica, de oficio: la proa de la «Marta» tenía el barniz intacto, sin un raspón, sin una marca de haber chocado contra nada, y una lancha que se hunde en el Luján con el viento largado no vuelve sola a amarrarse bajo una lona a trescientos metros de su casa. Lo pensé y lo dejé, porque la luz, al moverse, había encontrado otra cosa.</p>\n<p>Y después la luz encontró a Ana.</p>\n<p>Estaba agarrada a un poste del muelle. Uno de los postes de quebracho que sobresalían del agua un metro, con el impermeable amarillo pegado al cuerpo y el pelo en la cara y los dos brazos alrededor del poste, con el agua al pecho, que para ella era casi al cuello, y la cara vuelta hacia el galpón, hacia donde el perro ladraba, con la boca abierta. Me vio. Vio la luz, mejor dicho, y giró la cabeza, y abrió más la boca y no le salió nada.</p>\n<p>—¡Agarrate! —grité, que es lo que se grita.</p>\n<p>Me arrimé. La chata vino de costado con el viento y pegó contra el poste con un golpe de madera, y yo solté los remos y me estiré y la tomé del impermeable, del hombro, y tiré, y ella soltó el poste con un brazo para agarrarse de la borda, y la chata se escoró.</p>\n<p>Se escoró como se había escorado el sábado, de golpe, con todo el peso de las dos de un mismo lado, y el agua entró por la borda como una ola negra y la chata se fue de abajo y yo me fui con ella, otra vez, al río, con la linterna que se apagó en el aire y Ana encima o abajo o al lado, no sé, y el frío que esta vez no me cerró la garganta porque ya la tenía cerrada.</p>\n<p>Salí. Toqué el poste con la mano, el quebracho áspero, y me agarré. Ana estaba del otro lado, agarrada también, y las dos nos quedamos ahí, abrazadas a un poste de un muelle hundido, con la chata dada vuelta yéndose despacio hacia la lona, y el perro ladrando a diez metros, en la oscuridad, y yo grité lo único que quedaba:</p>\n<p>—¡Elías!</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Se abrió la puerta del galpón.</p>\n<p>La corrediza, la de chapa, con un ruido de hierro que llegó por encima de todo, y detrás de la puerta había una luz. Un farol a kerosene, de los de mecha, colgado de una mano, amarillo, que se movió, que bajó, que entró en el agua. Vi la luz bajar hasta el nivel del río y seguir hacia nosotras, despacio, balanceándose, y vi el agua iluminada alrededor de la luz, marrón, con hojas, y vi al perro, el Negro, negro de verdad bajo esa luz, parado en el pallet que flotaba atado a la puerta, ladrando hacia la luz, hacia el que la llevaba, con la cola baja.</p>\n<p>El que la llevaba era alto. Venía con el agua al pecho, abriéndose paso con el brazo libre, con el farol en alto en el otro, y tenía puesta una campera que no se veía de qué color, y una gorra, y bajo la gorra la cara no se veía porque el farol la dejaba a contraluz. Llegó. Colgó el farol del gancho del poste, el gancho donde Elías cuelga las nasas, y la luz nos cayó encima a las tres.</p>\n<p>Agarró a Ana primero. La tomó por debajo de los brazos, desde atrás, con la izquierda, con el brazo izquierdo cruzado por el pecho de ella, y la levantó. La levantó como se levanta a alguien que ya no puede hacer nada, entera, y la sentó en las tablas del muelle, que estaban a medio metro bajo el agua, de modo que quedó sentada con el agua a la cintura, apoyada en el poste, con la cabeza caída, respirando. Después vino por mí.</p>\n<p>Me agarró del brazo. De la muñeca derecha, con la mano izquierda, y yo le miré la mano antes de mirarle la cara, porque es lo que hago, porque es lo que soy, y la mano era larga, quemada por el sol, con una cicatriz blanca en el nudillo del índice que se había hecho con un formón a los dieciséis años en ese mismo galpón, con Elías mirando, y que yo le había curado con agua oxigenada en la cocina de mi abuela.</p>\n<p>Levanté la vista. El farol le daba de lleno. La gorra, la barba de cuatro días, la cara flaca con los pómulos, los ojos de mi madre.</p>\n<p>—Vero —dijo Martín.</p>\n<p>Me sacó del agua. Me sentó al lado de Ana, en las tablas, con el agua a la cintura, y se quedó parado delante de las dos, con el agua al pecho, con la mano izquierda todavía en mi brazo, como si no supiera qué hacer con ella. El perro dejó de ladrar. Y en el silencio que quedó, que no era silencio porque estaba el viento y la lluvia y la lona de enfrente, lejos, dando latigazos, oí mi propia respiración, y la de Ana, y la de él, las tres, desparejas, y pensé con la parte de la cabeza que seguía funcionando como un reloj que había gritado su nombre el sábado a las seis de la mañana en el medio del arroyo y que él me había oído.</p>\n<p>Ana levantó la cabeza. Lo miró. Lo miró un tiempo largo, con la cara iluminada por el farol y el pelo pegado y los labios azules, y después levantó la mano derecha, despacio, y lo abofeteó.</p>\n<p>Fue un golpe sin fuerza, mojado, que hizo un ruido chico. Martín no se movió. Ana lo abofeteó otra vez, y la tercera vez la mano ya no llegó, se le quedó en el aire, y él se la agarró, con la izquierda, y se la bajó, y ella se dobló hacia adelante y se le apoyó en el pecho, en el agua, y él la sostuvo.</p>\n<p>Yo no hice nada. Me quedé sentada en el muelle hundido de Elías, con el agua a la cintura, mirando a mi hermano vivo bajo un farol a kerosene, con una cicatriz en el índice y una mujer contra el pecho, y lo único que se me ocurrió, lo único que me salió, con la voz que me quedaba, fue decirle lo que le decía cuando tenía seis años y salía del arroyo azul de frío:</p>\n<p>—Salí del agua, Martín.</p>\n<p>Y salió.</p>","palabras":1530},{"n":16,"titulo":"La cocina de Elías","cuando":"Domingo 12 de octubre, 7.00","html":"<p>La cocina a leña estaba prendida desde la noche. Elías había bajado a los diez minutos, con una linterna y en camiseta, cuando el perro no paró y después oyó las voces, y nos había encontrado a los tres en su galpón, sentados en el piso de tierra sobre unas bolsas de arpillera, con el agua a diez centímetros de la puerta y el farol en un clavo, y no había dicho nada. Había mirado a Martín, y Martín lo había mirado a él, y Elías había dicho «vengan» y nos había llevado por el pasillo de tablas, que en su casa está más alto y seguía seco, hasta la cocina. Nos dio mantas. Nos dio ropa de Nilda, que guarda en un baúl, a Ana y a mí: dos camisones de franela y dos polleras que nos quedaban como cortinas. A Martín le dio una camisa suya. Puso la pava en la cocina a leña y se sentó en su silla con el mate, y el Negro se echó bajo la mesa, y afuera, por la ventana, el cielo tenía por primera vez en tres días un color que no era gris.</p>\n<p>El viento había cambiado. Se oía: ya no empujaba, silbaba, y venía del este, y a las ocho iba a estar en el norte, dijo Elías, y a mediodía el agua iba a empezar a bajar con la misma velocidad con que había subido. Una sudestada se va como viene: de golpe, sin pedir perdón.</p>\n<p>Martín estaba sentado en el banco de la pared, con la camisa de Elías abierta en el cuello y las manos entre las rodillas. Tenía la barba de cuatro días, los ojos hundidos, y olía. No a alcohol: a galpón, a kerosene, a hombre que durmió cuatro noches sobre bolsas. Ana estaba en la otra punta de la mesa, envuelta en la manta hasta la nariz, mirando la cocina a leña, no a él. Yo estaba en el medio. Elías me pasó el mate. Lo tomé. Lo devolví. Y dije lo que digo en una audiencia cuando el testigo ya está sentado y el juez me da la palabra:</p>\n<p>—Contá.</p>\n<p class=\"sep\" role=\"separator\">⁂</p>\n<p>Contó. Lo hizo mal, al principio, con la voz que tiene cuando habla de algo que no es madera: a medias, buscando, parando. Yo pregunté. Es mi oficio. Pregunté como pregunto en las audiencias, una cosa por vez, sin adjetivos, y él fue contestando, y de a poco, como pasa con los testigos cuando entienden que la pregunta siguiente va a llegar igual, dejó de parar.</p>\n<p>El galpón lo había visto en mayo. Había ido con el Turco a Villa Paranacito a buscar un motor, y el Turco tenía un conocido ahí, un tal Ibarra, un viejo que se jubilaba y vendía el taller con el guinche y el muelle y la casa de atrás, sobre el río Paranacito, que es ancho y tranquilo y tiene lanchas de madera todavía. Veinticuatro mil dólares. La mitad ahora, la mitad en un año. Martín había caminado por ese galpón una tarde entera con las manos en los bolsillos y había vuelto a la isla sin decir nada, y había escrito en la libreta, me dijo, «vi un lugar», y nada más, porque no tenía con qué.</p>\n<p>Acuña había venido en julio. Primero a lo de los Cardozo, que firmaron enseguida. Después a casa, en el semirrígido, con la camisa, a ofrecer. Martín le había dicho que no.
