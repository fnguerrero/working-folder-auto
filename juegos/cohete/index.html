<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1230">
<title>Cohete</title>
<style>
  :root { --tap: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1230; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  .barra { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: calc(8px + env(safe-area-inset-left));
    right: calc(8px + env(safe-area-inset-right)); display: flex; align-items: center; justify-content: space-between;
    gap: 8px; pointer-events: none; }
  .barra h1 { margin: 0; font-size: 1.2rem; text-shadow: 0 2px 4px rgba(0,0,0,.45); letter-spacing: -.01em; }
  .botones { display: flex; gap: 8px; pointer-events: auto; }
  .botones button { min-height: var(--tap); min-width: var(--tap); border: 0; border-radius: 14px; padding: 0 14px;
    font: 700 1rem/1 inherit; color: #123; background: rgba(255,255,255,.92); box-shadow: 0 3px 0 rgba(0,0,0,.35);
    cursor: pointer; touch-action: manipulation; }
  .botones button:focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }
  .botones button[aria-pressed="true"] { background: #ffd166; }
  .ayuda { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.4); font-size: .9rem; pointer-events: none;
    white-space: nowrap; transition: opacity .6s; }
  .ayuda.oculta { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .ayuda { transition: none; } }
</style>
</head>
<body>
<canvas id="cielo" aria-label="Cohete: tocá el cohete para despegar y las estrellas para que suenen" role="img"></canvas>
<header class="barra">
  <h1>🚀 Cohete</h1>
  <div class="botones">
    <button id="despegar" type="button" aria-label="Despegar">🚀 ¡Vamos!</button>
    <button id="sonido" type="button" aria-pressed="true" aria-label="Sonido">🔊</button>
  </div>
</header>
<div id="ayuda" class="ayuda">Tocá el cohete para despegar</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("cielo");
  const ctx = canvas.getContext("2d");
  const ayuda = document.getElementById("ayuda");
  const btnDespegar = document.getElementById("despegar");
  const btnSonido = document.getElementById("sonido");
  const reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- Estado ----------
  let W = 1, H = 1, dpr = 1, suelo = 0, esc = 1;
  let ALT_LUNA = 1, CAM_MAX = 0, cam = 0;
  const estrellas = [], planetas = [], chispas = [], humo = [], estelas = [];
  const dedos = new Map(); // pointerId -> {x, y, ultimoX, ultimoY, recorrido, fiuu}
  let cohete = null, luna = null, satelite = null, ovni = null, cometa = null;
  let ultimoT = 0, tiempo = 0, viajes = 0;
  let sonidoActivo = true, huboToque = false, pausado = false;

  const azar = (a, b) => a + Math.random() * (b - a);
  const elegir = (xs) => xs[Math.floor(Math.random() * xs.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // Do mayor pentatónica, dos octavas: suena bien cualquier combinación de dedos.
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98];

  try { sonidoActivo = localStorage.getItem("cohete.sonido") !== "no"; } catch (e) { /* sin localStorage, da igual */ }
  btnSonido.setAttribute("aria-pressed", String(sonidoActivo));
  btnSonido.textContent = sonidoActivo ? "🔊" : "🔇";

  // ---------- Sonido (WebAudio, sin archivos) ----------
  let actx = null, master = null, rumble = null;
  function audio() {
    if (!sonidoActivo) return null;
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
    }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function ruido(a, seg, forma) {
    const n = Math.floor(a.sampleRate * seg), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (forma ? forma(i / n) : 1);
    return buf;
  }
  // Campanita: seno con un armónico y decaimiento largo.
  function sonNota(f, vol = 0.3, dur = 1.1) {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    for (const [mult, v, tipo] of [[1, 1, "sine"], [2.01, 0.25, "sine"], [3, 0.08, "triangle"]]) {
      const o = a.createOscillator(); o.type = tipo; o.frequency.value = f * mult;
      const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * v, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur / mult);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur);
    }
  }
  // Rumble del motor: ruido grave filtrado que sube de tono mientras acelera. Queda sonando hasta apagarlo.
  function sonMotor(prender) {
    const a = audio();
    if (!prender || !a) {
      if (rumble) { const t = rumble.a.currentTime; rumble.g.gain.cancelScheduledValues(t); rumble.g.gain.setValueAtTime(rumble.g.gain.value, t); rumble.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); rumble.src.stop(t + 0.55); rumble = null; }
      return;
    }
    if (rumble) return;
    const t = a.currentTime;
    const src = a.createBufferSource(); src.buffer = ruido(a, 1.5); src.loop = true;
    const filtro = a.createBiquadFilter(); filtro.type = "lowpass"; filtro.Q.value = 1.2;
    filtro.frequency.setValueAtTime(90, t); filtro.frequency.exponentialRampToValueAtTime(420, t + 2.5);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.7, t + 0.6);
    src.connect(filtro); filtro.connect(g); g.connect(master); src.start(t);
    rumble = { a, src, g };
  }
  // Fiuuu: la estrella fugaz. Ruido con pasabanda que baja.
  function sonFiuu() {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const src = a.createBufferSource(); src.buffer = ruido(a, 0.5, (k) => Math.sin(k * Math.PI));
    const filtro = a.createBiquadFilter(); filtro.type = "bandpass"; filtro.Q.value = 3;
    filtro.frequency.setValueAtTime(3200, t); filtro.frequency.exponentialRampToValueAtTime(500, t + 0.5);
    const g = a.createGain(); g.gain.value = 0.3;
    src.connect(filtro); filtro.connect(g); g.connect(master); src.start(t);
  }
  // Boing: un planeta que rebota.
  function sonBoing() {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.25);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.32);
  }
  // Bip: tocar el cohete en vuelo.
  function sonBip() {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(); o.type = "square"; o.frequency.value = elegir([880, 988, 1175]);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.1);
  }
  // Ovni: dos notitas raras que suben y bajan.
  function sonOvni() {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(); o.type = "triangle";
    o.frequency.setValueAtTime(600, t); o.frequency.linearRampToValueAtTime(1300, t + 0.15); o.frequency.linearRampToValueAtTime(700, t + 0.3); o.frequency.linearRampToValueAtTime(1500, t + 0.45);
    const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.02); g.gain.setValueAtTime(0.2, t + 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.52);
  }
  // Pof: se abre el paracaídas / el cohete toca el suelo.
  function sonPof() {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const src = a.createBufferSource(); src.buffer = ruido(a, 0.18, (k) => Math.pow(1 - k, 3));
    const filtro = a.createBiquadFilter(); filtro.type = "lowpass"; filtro.frequency.value = 700;
    const g = a.createGain(); g.gain.value = 0.5;
    src.connect(filtro); filtro.connect(g); g.connect(master); src.start(t);
  }
  // La melodía de la luna: cortita y alegre.
  function sonLuna() {
    const a = audio(); if (!a) return;
    const notas = [[523.25, 0], [659.25, 0.16], [783.99, 0.32], [1046.5, 0.48], [783.99, 0.72], [1046.5, 0.88]];
    const t = a.currentTime;
    for (const [f, d] of notas) {
      const o = a.createOscillator(); o.type = "triangle"; o.frequency.value = f;
      const g = a.createGain(); g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.3, t + d + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.35);
      o.connect(g); g.connect(master); o.start(t + d); o.stop(t + d + 0.4);
    }
  }

  // ---------- Coordenadas ----------
  // El mundo se mide en «altura» desde la plataforma. Cada cosa tiene una profundidad d: 1 se mueve con el cohete,
  // menos de 1 se mueve más despacio (paralaje). Pantalla: y = suelo - alt + cam * d.
  const pantallaY = (alt, d) => suelo - alt + cam * d;

  // ---------- Estrellas y planetas ----------
  function armarCielo() {
    estrellas.length = 0; planetas.length = 0;
    const dens = (reducido ? 0.5 : 1) * Math.max(16, Math.round(W * H / 14000));
    for (const d of [0.35, 0.65, 1]) {
      const tope = suelo + CAM_MAX * d + 40;
      const n = Math.round(dens * tope / suelo * (d === 1 ? 0.9 : 0.55));
      for (let i = 0; i < n; i++) {
        estrellas.push({ x: Math.random(), alt: azar(-10, tope), d, r: azar(1.2, 3.2) * (0.6 + d * 0.6) * esc, fase: Math.random() * 6.3,
          vel: azar(0.8, 2.2), brillo: 0, tono: elegir(["#fff", "#fff6d5", "#d8ecff", "#ffe3f3"]), nota: 0 });
      }
    }
    // Las que están cerca tienen nota según la altura: más arriba, más aguda.
    for (const e of estrellas) e.nota = PENTA[clamp(Math.floor((e.alt / (suelo + CAM_MAX)) * PENTA.length * 2) % PENTA.length, 0, PENTA.length - 1)];
    const colores = [["#ff8c42", "#ffb37a"], ["#5ef2a6", "#b4ffd9"], ["#c77dff", "#e7c6ff"], ["#8ecae6", "#d3f0ff"], ["#ffd23f", "#fff0a8"]];
    function planeta(x, alt, d, r, anillo) {
      const [c1, c2] = elegir(colores);
      planetas.push({ x, alt, d, r: r * esc, c1, c2, anillo, ang: Math.random() * 6, giro: 0, bote: 0, vgiro: azar(0.05, 0.15) });
    }
    // Dos a la vista al arrancar.
    planeta(azar(0.14, 0.26), suelo * azar(0.55, 0.72), 0.5, azar(20, 26), true);
    planeta(azar(0.74, 0.88), suelo * azar(0.3, 0.5), 0.5, azar(16, 22), false);
    // Dos que aparecen durante el viaje (altura calculada para que se vean a un tercio y a dos tercios de la subida).
    planeta(azar(0.68, 0.82), suelo - H * 0.3 + CAM_MAX * 0.35 * 0.6, 0.6, azar(24, 32), Math.random() < 0.5);
    planeta(azar(0.12, 0.28), suelo - H * 0.35 + CAM_MAX * 0.72 * 0.6, 0.6, azar(22, 30), true);
  }
  function dibujarEstrella(e) {
    const x = e.x * W, y = pantallaY(e.alt, e.d);
    if (y < -20 || y > H + 20) return;
    const tit = 0.7 + 0.3 * Math.sin(tiempo * e.vel + e.fase);
    let r = e.r * tit, alfa = (0.45 + 0.55 * tit) * (0.5 + e.d * 0.5);
    if (e.brillo > 0) {
      const k = e.brillo / 0.9;
      r = e.r * (1 + 5 * Math.sin(k * Math.PI)); alfa = 1;
      ctx.save(); ctx.globalAlpha = 0.9 * k; ctx.strokeStyle = e.tono; ctx.lineWidth = 2 * esc; ctx.lineCap = "round";
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 + (1 - k) * 0.5, L = r * 2.4;
        ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); ctx.lineTo(x + Math.cos(a) * L, y + Math.sin(a) * L); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = alfa; ctx.fillStyle = e.tono;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * 0.4 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
  function dibujarPlaneta(p) {
    const x = p.x * W, y = pantallaY(p.alt, p.d);
    if (y < -p.r * 2 || y > H + p.r * 2) return;
    const bote = p.bote > 0 ? 1 + 0.18 * Math.sin(p.bote * 14) * p.bote : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(bote, 2 - bote); ctx.rotate(p.ang);
    if (p.anillo) { ctx.strokeStyle = p.c2; ctx.lineWidth = p.r * 0.22; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.7, p.r * 0.45, -0.3, Math.PI * 0.05, Math.PI * 0.95); ctx.stroke(); ctx.globalAlpha = 1; }
    const g = ctx.createRadialGradient(-p.r * 0.35, -p.r * 0.35, p.r * 0.1, 0, 0, p.r);
    g.addColorStop(0, p.c2); g.addColorStop(1, p.c1);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = "rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.ellipse(0, -p.r * 0.25, p.r * 1.1, p.r * 0.14, 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, p.r * 0.35, p.r * 1.1, p.r * 0.1, -0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.beginPath(); ctx.arc(p.r * 0.45, p.r * 0.1, p.r * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (p.anillo) { ctx.strokeStyle = p.c2; ctx.lineWidth = p.r * 0.22; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.7, p.r * 0.45, -0.3, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.restore();
  }

  // ---------- Cohete, luna, satélite ----------
  function crearCohete() { return { x: 0.42, alt: 0, v: 0, fase: "lista", t: 0, temblor: 0, chispa: 0, para: 0 }; }
  function alturaCohete() { return 86 * esc; }
  function despegar() {
    if (!cohete || cohete.fase !== "lista") { if (cohete) tocarCoheteEnVuelo(); return; }
    cohete.fase = "encendido"; cohete.t = 0; cohete.v = 0; viajes++;
    sonMotor(true);
  }
  function tocarCoheteEnVuelo() {
    cohete.chispa = 0.3; sonBip();
    const y = pantallaY(cohete.alt, 1) - alturaCohete() * 0.5;
    chispear(cohete.x * W, y, 8, elegir(["#ffd166", "#fff", "#5ef2a6"]));
  }
  function moverCohete(c, dt) {
    c.t += dt;
    if (c.chispa > 0) c.chispa -= dt;
    const camMeta = () => clamp(c.alt - H * 0.45, 0, CAM_MAX);
    if (c.fase === "encendido") {
      c.temblor = 2 * esc * Math.min(1, c.t);
      if (!reducido || Math.random() < 0.3) humear(c, 2, 0.5);
      if (c.t > 1.3) { c.fase = "subiendo"; c.t = 0; }
    } else if (c.fase === "subiendo") {
      const quiere = c.alt > ALT_LUNA - H * 0.5 ? H * 0.28 : H * 0.9;
      c.v += (quiere - c.v) * (1 - Math.exp(-dt * 1.6));
      c.alt += c.v * dt; c.temblor = 1.2 * esc;
      humear(c, reducido ? 1 : 3, 1);
      cam += (camMeta() - cam) * (1 - Math.exp(-dt * 6));
      if (c.alt >= ALT_LUNA) {
        c.alt = ALT_LUNA; c.fase = "luna"; c.t = 0; c.temblor = 0; c.v = 0;
        sonMotor(false); sonLuna(); luna.feliz = 3.2; luna.parpadeo = 0;
        chispear(luna.x * W, pantallaY(luna.alt, 1), reducido ? 8 : 26, "#fff6a8");
      }
    } else if (c.fase === "luna") {
      cam += (camMeta() - cam) * (1 - Math.exp(-dt * 6));
      if (c.t > 3.2) { c.fase = "bajando"; c.t = 0; c.para = 0; sonPof(); }
    } else if (c.fase === "bajando") {
      c.para = Math.min(1, c.para + dt * 2.5);
      c.v += (H * 0.26 - c.v) * (1 - Math.exp(-dt * 2));
      c.alt -= c.v * dt;
      cam += (camMeta() - cam) * (1 - Math.exp(-dt * 6));
      if (c.alt <= 0) {
        c.alt = 0; c.v = 0; c.fase = "lista"; c.t = 0; c.para = 0; cam = 0;
        sonPof(); chispear(c.x * W, suelo, reducido ? 4 : 12, "#cfd8e3");
        for (let i = 0; i < 6; i++) humo.push({ x: c.x * W + azar(-30, 30) * esc, alt: azar(0, 8), vx: azar(-25, 25), vy: azar(5, 20), r: azar(8, 14) * esc, vida: azar(0.8, 1.4), tono: 200 });
      }
    }
  }
  function humear(c, n, fuerza) {
    for (let i = 0; i < n; i++) {
      humo.push({ x: c.x * W + azar(-6, 6) * esc, alt: c.alt + azar(-4, 4), vx: azar(-18, 18) * fuerza, vy: -azar(60, 140) * fuerza,
        r: azar(5, 9) * esc, vida: azar(0.7, 1.4), tono: azar(170, 230) });
    }
  }
  function dibujarCohete(c) {
    const h = alturaCohete(), w = h * 0.42;
    const x = c.x * W + (c.temblor ? azar(-c.temblor, c.temblor) : 0) + (c.fase === "bajando" ? Math.sin(c.t * 1.6) * 18 * esc : 0);
    const base = pantallaY(c.alt, 1) + (c.temblor ? azar(-c.temblor, c.temblor) : 0);
    ctx.save(); ctx.translate(x, base);
    if (c.fase === "bajando") ctx.rotate(Math.sin(c.t * 1.6) * 0.12);
    // Llama.
    if (c.fase === "encendido" || c.fase === "subiendo") {
      const f = (c.fase === "encendido" ? 0.5 + 0.5 * Math.min(1, c.t) : 1) * (0.85 + 0.3 * Math.random());
      const g = ctx.createLinearGradient(0, 0, 0, h * 0.7 * f);
      g.addColorStop(0, "#fff"); g.addColorStop(0.3, "#ffd166"); g.addColorStop(0.7, "#ff7b2e"); g.addColorStop(1, "rgba(255,80,30,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-w * 0.32, 0); ctx.quadraticCurveTo(0, h * 0.95 * f, w * 0.32, 0); ctx.fill();
    }
    // Paracaídas.
    if (c.fase === "bajando" && c.para > 0) {
      const R = w * 1.7 * c.para, top = -h - R * 0.9;
      ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1.5;
      for (const k of [-1, -0.5, 0, 0.5, 1]) { ctx.beginPath(); ctx.moveTo(0, -h * 0.8); ctx.lineTo(k * R, top + R * 0.25); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(-R, top + R * 0.25);
      ctx.arc(0, top + R * 0.25, R, Math.PI, 0);
      for (let i = 0; i < 4; i++) ctx.quadraticCurveTo(R - R * (i + 0.5) / 2, top + R * 0.42, R - R * (i + 1) / 2, top + R * 0.25);
      ctx.closePath();
      const gp = ctx.createLinearGradient(-R, 0, R, 0); gp.addColorStop(0, "#ff5e78"); gp.addColorStop(0.5, "#ffd166"); gp.addColorStop(1, "#5ef2a6");
      ctx.fillStyle = gp; ctx.fill();
    }
    // Patas y aletas.
    ctx.fillStyle = "#ff5e78";
    ctx.beginPath(); ctx.moveTo(-w * 0.45, -h * 0.05); ctx.lineTo(-w * 0.95, h * 0.05); ctx.lineTo(-w * 0.45, -h * 0.4); ctx.fill();

    if (ev.target && ev.target.tagName === "BUTTON" && (ev.key === "Enter" || ev.key === " ")) return;
    if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); huboToque = true; ayuda.classList.add("oculta"); audio(); despegar(); }
    else if (ev.key === "m" || ev.key === "M") btnSonido.click();
    else if (ev.key.length === 1 && /[a-z0-9]/i.test(ev.key)) {
      // Cualquier otra tecla: una estrella al azar brilla y suena.
      const visibles = estrellas.filter((e) => { const y = pantallaY(e.alt, e.d); return y > 0 && y < H; });
      const e = elegir(visibles); if (e) { audio(); e.brillo = 0.9; sonNota(e.nota); chispear(e.x * W, pantallaY(e.alt, e.d), 6, e.tono); }
    }
  });
  btnDespegar.addEventListener("click", () => { huboToque = true; ayuda.classList.add("oculta"); audio(); despegar(); });
  btnSonido.addEventListener("click", () => {
    sonidoActivo = !sonidoActivo;
    btnSonido.setAttribute("aria-pressed", String(sonidoActivo)); btnSonido.textContent = sonidoActivo ? "🔊" : "🔇";
    try { localStorage.setItem("cohete.sonido", sonidoActivo ? "si" : "no"); } catch (e) { /* da igual */ }
    if (sonidoActivo) { audio(); sonNota(PENTA[2], 0.2, 0.6); if (cohete.fase === "encendido" || cohete.fase === "subiendo") sonMotor(true); }
    else if (rumble) { rumble.src.stop(); rumble = null; }
  });
  document.addEventListener("visibilitychange", () => {
    pausado = document.hidden; ultimoT = 0;
    if (pausado) { dedos.clear(); if (rumble) { rumble.src.stop(); rumble = null; } }
    else if (cohete.fase === "encendido" || cohete.fase === "subiendo") sonMotor(true);
  });

  // ---------- Tamaño ----------
  function medir() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    esc = clamp(Math.min(W, H) / 560, 1, 1.6);
    suelo = H * 0.84;
    ALT_LUNA = H * 2.3; CAM_MAX = ALT_LUNA - H * 0.45;
    armarCielo();
    if (!cohete) cohete = crearCohete();
    luna = Object.assign(crearLuna(), luna ? { feliz: luna.feliz } : {});
    if (cohete.fase !== "lista") cam = clamp(cohete.alt - H * 0.45, 0, CAM_MAX);
  }
  window.addEventListener("resize", medir);

  // ---------- Arranque ----------
  medir();
  requestAnimationFrame(cuadro);
  setTimeout(() => { if (!huboToque) ayuda.classList.add("oculta"); }, 12000);

  // Para las pruebas automáticas.
  window.__cohete = {
    estrellas, planetas, chispas, humo, estelas, dedos, tocar,
    get cohete() { return cohete; }, get fase() { return cohete.fase; }, get alt() { return cohete.alt; },
    get luna() { return luna; }, get ovni() { return ovni; }, get cometa() { return cometa; }, get satelite() { return satelite; },
    get cam() { return cam; }, get suelo() { return suelo; }, get tiempo() { return tiempo; }, get viajes() { return viajes; },
    get altLuna() { return ALT_LUNA; }, pantallaY, get W() { return W; }, get H() { return H; },
  };
})();
