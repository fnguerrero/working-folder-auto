<!doctype html>
<html lang="es" data-tema="nocturno">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Programador nocturno</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3Cmask id='m'%3E%3Crect width='40' height='40' fill='%23fff'/%3E%3Ccircle cx='29.5' cy='11.5' r='8' fill='%23000'/%3E%3C/mask%3E%3C/defs%3E%3Crect width='40' height='40' rx='10' fill='%23141a3d'/%3E%3Ccircle cx='25' cy='15' r='9' fill='%23ffd27a' mask='url(%23m)'/%3E%3Cpath d='M8 25.5l4 3.2-4 3.2' fill='none' stroke='%239d93ff' stroke-width='2.2' stroke-linecap='round'/%3E%3Crect x='14.5' y='30' width='7' height='2.4' rx='1' fill='%239d93ff'/%3E%3C/svg%3E">
<script>try { const t = localStorage.getItem("tema-nocturno"); if (t) document.documentElement.dataset.tema = t; } catch (e) {}</script>
<style>
  :root { --bg: #f6f5f1; --card: #fff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc; --accent: #5b4fd6; --accent-fg: #fff; --suave: rgba(91, 79, 214, .09); --lateral: #efede7;
    --c-juegos: #f28c28; --c-apps: #2e9e6b; --c-herramientas: #2b7fd1; --c-escritos: #8a5cd6; --c-experimentos: #d64f6a; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema]) { --bg: #111114; --card: #1b1b20; --fg: #ececf1; --muted: #9a9aa3; --line: #2a2a31; --accent: #9d93ff; --accent-fg: #15122e; --suave: rgba(157, 147, 255, .14); --lateral: #16161a; color-scheme: dark; } }
  :root[data-tema="claro"] { color-scheme: light; }
  :root[data-tema="oscuro"] { --bg: #111114; --card: #1b1b20; --fg: #ececf1; --muted: #9a9aa3; --line: #2a2a31; --accent: #9d93ff; --accent-fg: #15122e; --suave: rgba(157, 147, 255, .14); --lateral: #16161a; color-scheme: dark; }
  :root[data-tema="nocturno"] { --bg: #0b1026; --card: #121a38; --fg: #e9ecff; --muted: #a2aad0; --line: #232d58; --accent: #ffd27a; --accent-fg: #221800; --suave: rgba(255, 210, 122, .13); --lateral: #0d1330; color-scheme: dark; }
  :root[data-tema="nocturno"] body { background-image: radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55), transparent 60%), radial-gradient(1px 1px at 68% 9%, rgba(255,255,255,.4), transparent 60%), radial-gradient(1.5px 1.5px at 84% 42%, rgba(255,255,255,.35), transparent 60%), radial-gradient(1px 1px at 36% 64%, rgba(255,255,255,.3), transparent 60%), radial-gradient(1px 1px at 91% 81%, rgba(255,255,255,.45), transparent 60%), radial-gradient(1px 1px at 22% 88%, rgba(255,255,255,.3), transparent 60%); background-attachment: fixed; }
  :root[data-tema="nocturno"] .chip.cat { color: #10142b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.45; }
  .marco { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
  .barra { grid-column: 2; display: flex; justify-content: flex-end; align-items: stretch; gap: 0; padding: 0 12px; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .barra::-webkit-scrollbar { display: none; }
  .tile { display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 7px 16px; white-space: nowrap; flex: none; }
  .tile[hidden] { display: none; }
  .tile b { overflow: hidden; text-overflow: ellipsis; }
  .tile small { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .tile b { font-size: .86rem; font-weight: 600; color: var(--fg); }
  .tile a { color: var(--accent); text-decoration: none; } .tile a:hover { text-decoration: underline; }
  .tile.ultima { flex: 0 1 auto; min-width: 0; } .tile.ultima b { max-width: 300px; }
  .tile .nombres a + a::before { content: "· "; margin: 0 .2em 0 .35em; color: var(--muted); }
  .tile .ok { color: var(--c-apps); } .tile .pendiente { color: var(--c-juegos); }
  .frase { margin: 6px 0 28px; padding: 2px 0 2px 18px; border-left: 2px solid var(--accent); max-width: 680px; transition: opacity .5s; }
  .frase.cambiando { opacity: 0; }
  .frase blockquote { margin: 0; font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; font-style: italic; font-size: 1.1rem; line-height: 1.5; color: var(--fg); }
  .frase blockquote::before { content: "«"; } .frase blockquote::after { content: "»"; }
  .frase figcaption { margin-top: 6px; font-size: .7rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .frase figcaption::before { content: "— "; }
  aside { grid-row: 1 / -1; background: var(--lateral); border-right: 1px solid var(--line); padding: 22px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .marca { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; }
  .logo { width: 40px; height: 40px; flex: none; }
  .logo .cursor { animation: titila 1.1s steps(1) infinite; }
  @keyframes titila { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .logo .cursor { animation: none; } }
  h1 { margin: 0; font-size: 1.2rem; line-height: 1.15; }
  .temas { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 16px; }
  .temas button { font: inherit; font-size: .78rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .temas button:hover { border-color: var(--accent); color: var(--fg); }
  .temas button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .buscar { width: 100%; font: inherit; font-size: .9rem; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); margin-bottom: 14px; }
  .grupo h2 { margin: 12px 0 4px; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  nav button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: .93rem; padding: 8px 10px; min-height: 38px; border-radius: 8px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
  nav button:hover { background: var(--suave); }
  nav button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  nav button .n { margin-left: auto; font-size: .76rem; opacity: .7; }
  nav button i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .pie { margin-top: 20px; font-size: .78rem; color: var(--muted); }
  .pie a { color: var(--accent); }
  main { padding: 26px 28px 48px; min-width: 0; }
  main h2.seccion { margin: 0 0 4px; font-size: 1.25rem; }
  main .explica { margin: 0 0 16px; color: var(--muted); font-size: .92rem; max-width: 70ch; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .grilla.destacados { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .tarjeta { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
  .tarjeta:hover { border-color: var(--accent); }
  .cab { display: flex; gap: 12px; align-items: center; }
  .icono { flex: none; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 28px; background: var(--suave); }
  .destacados .icono { width: 64px; height: 64px; font-size: 36px; }
  .icono.juegos { background: color-mix(in srgb, var(--c-juegos) 18%, transparent); } .icono.apps { background: color-mix(in srgb, var(--c-apps) 18%, transparent); } .icono.herramientas { background: color-mix(in srgb, var(--c-herramientas) 18%, transparent); } .icono.escritos { background: color-mix(in srgb, var(--c-escritos) 18%, transparent); } .icono.experimentos { background: color-mix(in srgb, var(--c-experimentos) 18%, transparent); }
  .tarjeta h3 { margin: 0; font-size: 1.05rem; line-height: 1.25; }
  .tarjeta h3 a { color: inherit; text-decoration: none; } .tarjeta h3 a:hover { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .chip { font-size: .74rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip.cat { border-color: transparent; color: #fff; }
  .chip.juegos { background: var(--c-juegos); } .chip.apps { background: var(--c-apps); } .chip.herramientas { background: var(--c-herramientas); } .chip.escritos { background: var(--c-escritos); } .chip.experimentos { background: var(--c-experimentos); }
  .chip.edad { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip.en-curso { border-color: var(--c-juegos); color: var(--c-juegos); }
  .tarjeta p { margin: 0; color: var(--muted); font-size: .92rem; }
  .orden { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: -6px 0 14px; }
  .orden span { font-size: .78rem; color: var(--muted); margin-right: 4px; }
  .orden button { font: inherit; font-size: .78rem; min-height: 32px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
  .orden button:hover { border-color: var(--accent); color: var(--fg); }
  .orden button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .acciones { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ver-mas { font: inherit; font-size: .84rem; min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--accent); cursor: pointer; }
  .ver-mas:hover { border-color: var(--accent); } .ver-mas::before { content: "+ "; } .ver-mas[aria-expanded="true"]::before { content: "– "; }
  .acciones .fechas { font-size: .74rem; color: var(--muted); line-height: 1.3; margin-left: auto; text-align: right; }
  .mas p { margin: 8px 0 0; font-size: .9rem; color: var(--fg); }
  .probar { display: inline-flex; align-items: center; min-height: 36px; padding: 6px 14px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); text-decoration: none; font-size: .88rem; font-weight: 600; }
  .probar:hover { filter: brightness(1.1); }
  .vacio { color: var(--muted); }
  .menu-movil { display: none; }
  @media (max-width: 820px) {
    .marco { grid-template-columns: 1fr; }
    .marco { grid-template-rows: auto auto 1fr; }
    .barra { grid-column: 1; padding: 0 6px; justify-content: flex-start; }
    .tile { padding: 6px 10px; flex: none; }
    .tile.ultima { flex: none; } .tile.ultima b { max-width: 220px; }
    aside { grid-row: auto; position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
    .grupo h2 { margin-top: 10px; }
    nav { display: flex; flex-wrap: wrap; gap: 4px; } nav button { width: auto; min-height: 34px; padding: 5px 10px; font-size: .86rem; border: 1px solid var(--line); border-radius: 999px; } nav button .n { margin-left: 4px; }
    main { padding: 18px 16px 40px; }
    .grilla, .grilla.destacados { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="marco">
  <header class="barra" id="barra" aria-label="De un vistazo">
    <span class="tile" id="bLuna" hidden><small>Luna</small><b id="bLunaValor"></b></span>
    <span class="tile" id="bCielo" hidden title="Dónde están el Sol y la Luna esta noche (zodíaco tropical)"><small>Astrología</small><b id="bCieloValor"></b></span>
    <span class="tile ultima" id="bUltima" hidden><small id="bUltimaCuando">Última noche</small><b class="nombres" id="bUltimaQue"></b></span>
    <span class="tile" id="bPedidos" hidden><small>Pedidos</small><b><a id="bPedidosLink" href="https://github.com/fnguerrero/working-folder-auto/issues?q=is%3Aissue+is%3Aopen+label%3Anoche"></a></b></span>
  </header>
  <aside>
    <div class="marca"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><defs><mask id="luna"><rect width="40" height="40" fill="#fff"/><circle cx="29.5" cy="11.5" r="8" fill="#000"/></mask></defs><rect width="40" height="40" rx="10" fill="#141a3d"/><circle cx="9" cy="9" r="1" fill="#fff" opacity=".7"/><circle cx="15" cy="5.5" r=".7" fill="#fff" opacity=".5"/><circle cx="33" cy="25" r=".8" fill="#fff" opacity=".6"/><circle cx="25" cy="15" r="9" fill="#ffd27a" mask="url(#luna)"/><path d="M8 25.5l4 3.2-4 3.2" fill="none" stroke="#9d93ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="cursor" x="14.5" y="30" width="7" height="2.4" rx="1" fill="#9d93ff"/></svg><h1>Programador nocturno</h1></div>
    <input class="buscar" id="buscar" type="search" placeholder="Buscar…" aria-label="Buscar proyectos">
    <div class="grupo"><h2>Categorías</h2><nav id="categorias" aria-label="Categorías"></nav></div>
    <div class="grupo"><h2>Para quién</h2><nav id="publicos" aria-label="Para quién"></nav></div>
    <p class="pie"><a href="https://github.com/fnguerrero/working-folder-auto">El repo</a> · <a href="https://github.com/fnguerrero/working-folder-auto/blob/main/BITACORA.md">La bitácora</a></p>
    <div class="temas" id="temas" role="group" aria-label="Tema"><button data-tema="claro">Claro</button><button data-tema="oscuro">Oscuro</button><button data-tema="nocturno">Nocturno</button></div>
  </aside>
  <main>
    <figure class="frase" id="bFrase" hidden><blockquote id="bFraseTexto"></blockquote><figcaption id="bFraseAutor"></figcaption></figure>
    <section id="secDestacados"><h2 class="seccion">Lo más copado</h2><p class="explica">Por donde conviene empezar.</p><div class="grilla destacados" id="destacados"></div></section>
    <section><h2 class="seccion" id="tituloTodos">Todo</h2><p class="explica" id="explicaTodos"></p><div class="orden" id="orden" role="group" aria-label="Ordenar"><span>Ordenar por</span><button data-orden="actividad">Última actividad</button><button data-orden="nuevos">Más nuevos</button><button data-orden="nombre">Nombre</button></div><div class="grilla" id="grilla"><p class="vacio">Cargando…</p></div></section>
  </main>
</div>
<script>
(function () {
  "use strict";
  const CATEGORIAS = { todo: "Todo", juegos: "Juegos", apps: "Apps", herramientas: "Herramientas", escritos: "Escritos", experimentos: "Experimentos" };
  const EXPLICA = { todo: "Juegos para Valentín, apps para la vida argentina, herramientas y experimentos para el que programa en .NET.", juegos: "Para tocar en el celu. Los que dicen «desde 1 año» no tienen puntaje ni derrota: son para mirar y hacer ruido.", apps: "Cuentas de todos los días, hechas para Argentina: cuotas, asado, pintura, lo que te corresponde.", herramientas: "Pegás algo (un JSON, una regex, un JWT, un plan, un stack trace) y te lo explica en castellano, con el C# listo.", escritos: "Guías y experimentos largos, medidos contra servidores de verdad, para leer con tiempo.", experimentos: "Simuladores que corren en el navegador para entender por qué el backend se porta como se porta." };
  const PUBLICOS = { todos: ["Todos", ""], "1+": ["Desde 1 año", "Para Valentín: sin puntaje ni derrota"], "3+": ["Desde 3 años", "Chicos que ya siguen una consigna"], cualquiera: ["Para cualquiera", "Cuentas de todos los días"], devs: ["Para devs .NET", "Herramientas, guías y simuladores"] };
  const EDAD = { "1+": "Desde 1 año", "3+": "Desde 3 años", todos: "Para cualquiera", devs: "Para devs .NET" };
  const $ = (s) => document.querySelector(s);
  let proyectos = []; let categoria = "todo"; let publico = "todos"; let busqueda = ""; let orden = "actividad";
  const ORDENES = { actividad: "lo último trabajado primero", nuevos: "lo más nuevo primero", nombre: "por nombre" };
  const leerHash = () => { const h = new URLSearchParams(location.hash.replace(/^#/, "")); if (h.get("cat") && CATEGORIAS[h.get("cat")]) categoria = h.get("cat"); if (h.get("para") && PUBLICOS[h.get("para")]) publico = h.get("para"); if (h.get("orden") && ORDENES[h.get("orden")]) orden = h.get("orden"); };
  const escribirHash = () => { const h = new URLSearchParams(); if (categoria !== "todo") h.set("cat", categoria); if (publico !== "todos") h.set("para", publico); if (orden !== "actividad") h.set("orden", orden); history.replaceState(null, "", h.toString() ? "#" + h.toString() : location.pathname); };
  const claveDePublico = (p) => (p.para === "todos" ? "cualquiera" : p.para);
  const visibles = () => proyectos.filter((p) => p.estado !== "archivado");
  function pintarNav() {
    const vis = visibles();
    const cat = $("#categorias"); cat.innerHTML = "";
    for (const [clave, nombre] of Object.entries(CATEGORIAS)) {
      const n = clave === "todo" ? vis.length : vis.filter((p) => p.categoria === clave).length; if (!n) continue;
      const b = document.createElement("button"); b.dataset.cat = clave; b.setAttribute("aria-pressed", String(clave === categoria));
      b.innerHTML = `${clave === "todo" ? "" : `<i style="background:var(--c-${clave})"></i>`}<span>${nombre}</span><span class="n">${n}</span>`;
      b.onclick = () => { categoria = clave; escribirHash(); pintarNav(); pintar(); }; cat.appendChild(b);
    }
    const pub = $("#publicos"); pub.innerHTML = "";
    for (const [clave, [nombre]] of Object.entries(PUBLICOS)) {
      const n = clave === "todos" ? vis.length : vis.filter((p) => claveDePublico(p) === clave).length; if (!n) continue;
      const b = document.createElement("button"); b.dataset.para = clave; b.setAttribute("aria-pressed", String(clave === publico));
      b.innerHTML = `<span>${nombre}</span><span class="n">${n}</span>`;
      b.onclick = () => { publico = clave; escribirHash(); pintarNav(); pintar(); }; pub.appendChild(b);
    }
  }
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function tarjeta(p) {
    const a = document.createElement("article"); a.className = "tarjeta"; a.dataset.slug = p.slug;
    a.innerHTML = `<div class="cab"><div class="icono ${esc(p.categoria)}" aria-hidden="true">${esc(p.icono || "✨")}</div><div><h3><a href="${esc(p.probar)}">${esc(p.nombre)}</a></h3><div class="chips"><span class="chip cat ${esc(p.categoria)}">${esc(CATEGORIAS[p.categoria] || p.categoria)}</span><span class="chip edad">${esc(EDAD[p.para] || "")}</span>${p.estado !== "terminado" ? `<span class="chip en-curso">${esc(p.estado)}</span>` : ""}</div></div></div>
      <p>${esc(p.descripcion)}</p>
      <div class="acciones"><a class="probar" href="${esc(p.probar)}">Probar →</a>${p.detalle ? `<button type="button" class="ver-mas" aria-expanded="false">Qué es, un poco más</button>` : ""}<span class="fechas">${p.desde ? `Creado el ${fechaCorta(p.desde)}` : ""}${p.actualizado && p.actualizado !== p.desde ? `<br>Actualizado el ${fechaCorta(p.actualizado)}` : ""}</span></div>
      ${p.detalle ? `<div class="mas" hidden><p>${esc(p.detalle)}</p></div>` : ""}`;
    const mas = a.querySelector(".ver-mas"); if (mas) mas.onclick = () => { const abierto = mas.getAttribute("aria-expanded") === "true"; mas.setAttribute("aria-expanded", String(!abierto)); a.querySelector(".mas").hidden = abierto; };
    return a;
  }
  function filtrar(lista) {
    const q = busqueda.trim().toLowerCase();
    return lista.filter((p) => (categoria === "todo" || p.categoria === categoria) && (publico === "todos" || claveDePublico(p) === publico) && (!q || (p.nombre + " " + p.descripcion + " " + (p.detalle || "")).toLowerCase().includes(q)));
  }
  function pintar() {
    const vis = visibles(); const porFecha = (k) => (a, b) => (b[k] || b.desde || "").localeCompare(a[k] || a.desde || "") || (b.desde || "").localeCompare(a.desde || "") || a.nombre.localeCompare(b.nombre, "es");
    const ordenados = vis.slice().sort(orden === "nombre" ? (a, b) => a.nombre.localeCompare(b.nombre, "es") : orden === "nuevos" ? porFecha("desde") : porFecha("actualizado"));
    for (const b of document.querySelectorAll("#orden button")) b.setAttribute("aria-pressed", String(b.dataset.orden === orden));
    const sinFiltro = categoria === "todo" && publico === "todos" && !busqueda.trim();
    const dest = $("#destacados"); dest.innerHTML = "";
    const destacados = vis.filter((p) => p.destacado).sort(porFecha("desde"));
    $("#secDestacados").hidden = !(sinFiltro && destacados.length);
    if (sinFiltro) for (const p of destacados) dest.appendChild(tarjeta(p));
    const lista = filtrar(ordenados); const el = $("#grilla"); el.innerHTML = "";
    $("#tituloTodos").textContent = busqueda.trim() ? `Resultados para «${busqueda.trim()}»` : categoria === "todo" && publico === "todos" ? `Todo, ${ORDENES[orden]}` : [categoria !== "todo" ? CATEGORIAS[categoria] : "", publico !== "todos" ? PUBLICOS[publico][0] : ""].filter(Boolean).join(" · ");
    $("#explicaTodos").textContent = busqueda.trim() ? `${lista.length} ${lista.length === 1 ? "proyecto" : "proyectos"}.` : publico !== "todos" && categoria === "todo" ? PUBLICOS[publico][1] : EXPLICA[categoria];
    if (!lista.length) { el.innerHTML = '<p class="vacio">Nada por acá todavía.</p>'; return; }
    for (const p of lista) el.appendChild(tarjeta(p));
  }
  // Barra superior: todo lo que falle se oculta sin ruido.
  const ART = 3 * 3600e3; // Argentina es UTC-3 todo el año.
  const hoyArg = () => new Date(Date.now() - ART);
  const fechaCorta = (iso) => { const [y, m, d] = iso.split("-").map(Number); return `${d} ${["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"][m - 1]}`; };
  function pintarBarra() {
    const vis = visibles();
    if (!vis.length) return;
    const ultima = vis.map((p) => p.actualizado || p.desde || "").sort().pop();
    if (ultima) {
      const h = hoyArg(); const dias = Math.round((Date.UTC(h.getUTCFullYear(), h.getUTCMonth(), h.getUTCDate()) - new Date(ultima + "T00:00:00Z")) / 864e5);
      $("#bUltimaCuando").textContent = dias <= 0 ? "Anoche" : `Hace ${dias} ${dias === 1 ? "noche" : "noches"} · ${fechaCorta(ultima)}`;
      const que = $("#bUltimaQue"); que.innerHTML = "";
      const salieron = vis.filter((p) => p.desde === ultima || p.actualizado === ultima).sort((a, b) => (a.desde === ultima ? 0 : 1) - (b.desde === ultima ? 0 : 1));
      for (const p of salieron.slice(0, 3)) { const a = document.createElement("a"); a.href = p.probar; a.textContent = p.nombre; que.appendChild(a); }
      if (salieron.length > 3) { const a = document.createElement("a"); a.href = "https://github.com/fnguerrero/working-folder-auto/blob/main/BITACORA.md"; a.textContent = `y ${salieron.length - 3} más`; que.appendChild(a); }
      $("#bUltima").hidden = false;
    }
  }
  function pintarLuna() {
    // Edad de la luna desde la luna nueva del 2000-01-06 18:14 UTC, en meses sinódicos.
    const edad = (((Date.now() - Date.UTC(2000, 0, 6, 18, 14)) / 864e5 / 29.530588853) % 1 + 1) % 1;
    const fases = [[0, "🌑", "Luna nueva"], [0.25, "🌓", "Cuarto creciente"], [0.5, "🌕", "Luna llena"], [0.75, "🌗", "Cuarto menguante"], [1, "🌑", "Luna nueva"]];
    let fase = fases.find((f) => Math.abs(edad - f[0]) < 0.034);
    if (!fase) fase = edad < 0.25 ? [0, "🌒", "Luna creciente"] : edad < 0.5 ? [0, "🌔", "Luna gibosa creciente"] : edad < 0.75 ? [0, "🌖", "Luna gibosa menguante"] : [0, "🌘", "Luna menguante"];
    const luz = Math.round((1 - Math.cos(2 * Math.PI * edad)) / 2 * 100);
    $("#bLunaValor").textContent = `${fase[1]} ${luz} %`; $("#bLuna").querySelector("small").textContent = fase[2]; $("#bLuna").title = "La luna de esta noche (iluminada al " + luz + " %). Vista desde Argentina se ve espejada respecto del dibujo."; $("#bLuna").hidden = false;
  }
  const FRASES = [
    ["Mejor encender una vela que maldecir la oscuridad.", "Proverbio chino"],
    ["No es que tengamos poco tiempo, sino que perdemos mucho.", "Séneca"],
    ["Mientras se espera vivir, la vida pasa.", "Séneca"],
    ["No es pobre el que tiene poco, sino el que desea más.", "Séneca"],
    ["No son las cosas las que nos perturban, sino las opiniones que tenemos sobre ellas.", "Epicteto"],
    ["La mejor manera de vengarse es no parecerse a quien te hizo daño.", "Marco Aurelio"],
    ["Nadie se baña dos veces en el mismo río.", "Heráclito"],
    ["Una vida sin examen no merece ser vivida.", "Sócrates"],
    ["Un viaje de mil leguas empieza con un solo paso.", "Lao Tse"],
    ["Quien tiene un porqué para vivir soporta casi cualquier cómo.", "Friedrich Nietzsche"],
    ["La vida solo puede comprenderse mirando hacia atrás, pero hay que vivirla mirando hacia adelante.", "Søren Kierkegaard"],
    ["En lo más hondo del invierno aprendí, por fin, que había en mí un verano invencible.", "Albert Camus"],
    ["Hay que imaginarse a Sísifo feliz.", "Albert Camus"],
    ["El hombre está condenado a ser libre.", "Jean-Paul Sartre"],
    ["Yo soy yo y mi circunstancia.", "José Ortega y Gasset"],
    ["Los límites de mi lenguaje significan los límites de mi mundo.", "Ludwig Wittgenstein"],
    ["Caminante, no hay camino: se hace camino al andar.", "Antonio Machado"],
    ["La noche es más oscura justo antes del amanecer.", "Thomas Fuller"],
  ];
  function pintarCielo() {
    // Longitudes eclípticas aproximadas (error de un grado o dos), en días desde J2000.
    const d = (Date.now() - Date.UTC(2000, 0, 1, 12)) / 864e5; const r = (g) => g * Math.PI / 180;
    const g = 357.528 + 0.9856003 * d; const sol = 280.460 + 0.9856474 * d + 1.915 * Math.sin(r(g)) + 0.020 * Math.sin(r(2 * g));
    const m = 134.963 + 13.064993 * d; const e = 297.850 + 12.190749 * d;
    const luna = 218.316 + 13.176396 * d + 6.289 * Math.sin(r(m)) + 1.274 * Math.sin(r(2 * e - m)) + 0.658 * Math.sin(r(2 * e)) - 0.186 * Math.sin(r(g));
    const signos = ["Aries", "Tauro", "Géminis", "Cáncer", "Leo", "Virgo", "Libra", "Escorpio", "Sagitario", "Capricornio", "Acuario", "Piscis"];
    const signo = (l) => signos[Math.floor((((l % 360) + 360) % 360) / 30)];
    $("#bCieloValor").textContent = `☉ ${signo(sol)} · ☽ ${signo(luna)}`; $("#bCielo").hidden = false;
  }
  function pintarFrase() {
    let i = Math.floor(Date.now() / 864e5) % FRASES.length; const f = $("#bFrase");
    const mostrar = () => { $("#bFraseTexto").textContent = FRASES[i][0]; $("#bFraseAutor").textContent = FRASES[i][1]; };
    mostrar(); f.hidden = false;
    setInterval(() => { f.classList.add("cambiando"); setTimeout(() => { i = (i + 1) % FRASES.length; mostrar(); f.classList.remove("cambiando"); }, 500); }, 20000);
  }
  function pintarPedidos() {
    if (typeof fetch !== "function") return;
    fetch("https://api.github.com/repos/fnguerrero/working-folder-auto/issues?labels=noche&state=open&per_page=100", { headers: { Accept: "application/vnd.github+json" } })
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error(String(r.status)))))
      .then((lista) => {
        if (!Array.isArray(lista)) return;
        const n = lista.filter((i) => !i.pull_request).length; const a = $("#bPedidosLink");
        if (n) { a.textContent = `${n} en cola`; a.className = "pendiente"; }
        else { a.textContent = "0 en cola"; a.title = "Dejale uno"; a.href = "https://github.com/fnguerrero/working-folder-auto/issues/new?labels=noche"; a.className = "ok"; }
        $("#bPedidos").hidden = false;
      })
      .catch(() => {});
  }
  try { pintarLuna(); } catch (e) {}
  try { pintarCielo(); } catch (e) {}
  try { pintarPedidos(); } catch (e) {}
  function marcarTema() {
    const t = document.documentElement.dataset.tema || (matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro");
    for (const b of document.querySelectorAll("#temas button")) b.setAttribute("aria-pressed", String(b.dataset.tema === t));
  }
  for (const b of document.querySelectorAll("#temas button")) b.onclick = () => {
    const t = b.dataset.tema;
    document.documentElement.dataset.tema = t;
    try { localStorage.setItem("tema-nocturno", t); } catch (e) {}
    marcarTema();
  };
  marcarTema();
  for (const b of document.querySelectorAll("#orden button")) b.onclick = () => { orden = b.dataset.orden; escribirHash(); pintar(); };
  $("#buscar").addEventListener("input", (ev) => { busqueda = ev.target.value; pintar(); });
  window.addEventListener("hashchange", () => { leerHash(); pintarNav(); pintar(); });
  leerHash();
  fetch("proyectos.json", { cache: "no-cache" })
    .then((r) => r.json())
    .then((data) => { proyectos = data; pintarNav(); pintar(); try { pintarBarra(); pintarFrase(); } catch (e) {} })
    .catch(() => { $("#grilla").innerHTML = '<p class="vacio">No se pudo cargar la lista. Si lo abriste como archivo local, serví la carpeta con un servidor estático.</p>'; });
})();
</script>
