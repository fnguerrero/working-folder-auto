<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Working Folder Auto</title>
<style>
  :root { --bg: #f6f5f1; --card: #fff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc; --accent: #5b4fd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111114; --card: #1b1b20; --fg: #ececf1; --muted: #9a9aa3; --line: #2a2a31; --accent: #9d93ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); padding: 24px 16px 48px; }
  main { max-width: 880px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { margin: 0 0 24px; color: var(--muted); }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .filtros button { font: inherit; padding: 8px 14px; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  .filtros button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  a.tarjeta { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none; }
  a.tarjeta:hover, a.tarjeta:focus-visible { border-color: var(--accent); outline: none; }
  .tarjeta h2 { margin: 0; font-size: 1.05rem; }
  .tarjeta p { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.4; }
  .meta { display: flex; gap: 6px; font-size: .78rem; margin-top: auto; padding-top: 6px; }
  .chip { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .chip.en-curso { border-color: var(--accent); color: var(--accent); }
  .vacio { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Working Folder Auto</h1>
  <p class="sub">Lo que arma el Programador nocturno.</p>
  <div class="filtros" id="filtros"></div>
  <div class="grilla" id="grilla"><p class="vacio">Cargando…</p></div>
</main>
<script>
  const CATEGORIAS = { todo: "Todo", juegos: "Juegos", apps: "Apps", herramientas: "Herramientas", escritos: "Escritos", experimentos: "Experimentos" };
  let proyectos = [];
  let filtro = "todo";

  function pintarFiltros() {
    const usadas = new Set(proyectos.map(p => p.categoria));
    const el = document.getElementById("filtros");
    el.innerHTML = "";
    for (const [clave, nombre] of Object.entries(CATEGORIAS)) {
      if (clave !== "todo" && !usadas.has(clave)) continue;
      const b = document.createElement("button");
      b.textContent = nombre;
      b.setAttribute("aria-pressed", String(clave === filtro));
      b.onclick = () => { filtro = clave; pintarFiltros(); pintar(); };
      el.appendChild(b);
    }
  }

  function pintar() {
    const el = document.getElementById("grilla");
    el.innerHTML = "";
    const lista = proyectos
      .filter(p => p.estado !== "archivado" && (filtro === "todo" || p.categoria === filtro))
      .sort((a, b) => (b.desde || "").localeCompare(a.desde || ""));
    if (!lista.length) { el.innerHTML = '<p class="vacio">Nada por acá todavía.</p>'; return; }
    for (const p of lista) {
      const a = document.createElement("a");
      a.className = "tarjeta";
      a.href = p.probar;
      const h = document.createElement("h2"); h.textContent = p.nombre;
      const d = document.createElement("p"); d.textContent = p.descripcion;
      const m = document.createElement("div"); m.className = "meta";
      const c = document.createElement("span"); c.className = "chip"; c.textContent = CATEGORIAS[p.categoria] || p.categoria;
      const e = document.createElement("span"); e.className = "chip" + (p.estado === "en curso" ? " en-curso" : ""); e.textContent = p.estado;
      m.append(c, e);
      a.append(h, d, m);
      el.appendChild(a);
    }
  }

  fetch("proyectos.json", { cache: "no-cache" })
    .then(r => r.json())
    .then(data => { proyectos = data; pintarFiltros(); pintar(); })
    .catch(() => { document.getElementById("grilla").innerHTML = '<p class="vacio">No se pudo cargar la lista. Si lo abriste como archivo local, serví la carpeta con un servidor estático.</p>'; });
</script>
</body>
</html>
