# Publica el contenido de `main` en GitHub Pages en cada push.
# Si Pages no está habilitado para el repo, lo habilita (configure-pages con enablement).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Traer el repo
        uses: actions/checkout@v4
      - name: Configurar (y habilitar) Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
